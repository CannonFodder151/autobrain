# Reverse proxy: /api -> backend, /ai -> AI gateway, / -> static frontend (optional)
server {
    listen 80;
    server_name _;
    client_max_body_size 20m;

    # Re-resolve `backend` via Docker embedded DNS at request time so the
    # upstream IP survives backend container recreates (AUT-373).
    resolver 127.0.0.11 valid=5s ipv6=off;

    location /api/ {
        set $backend http://backend:8000;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        set $backend http://backend:8000;
        proxy_pass $backend;
    }

    location /ai/ {
        # ponytail: `ai` upstream still resolved once at boot — same stale-IP
        # risk as `backend`; convert when the AI gateway recreate is an issue.
        proxy_pass http://ai:8001/;
        proxy_set_header Host $host;
    }

    location /ws/ {
        set $backend http://backend:8000;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # Serve the Flutter web build if mounted; otherwise 404 page
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html =404;
    }
}
