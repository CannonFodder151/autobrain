# DEAD CONFIG — DO NOT EDIT (AUT-5623).
# This file is never shipped: docker/frontend/Dockerfile copies
# docker/frontend/nginx.conf to /etc/nginx/conf.d/default.conf, and no
# compose file or CI workflow mounts or references this file. The reverse
# proxy that actually runs is docker/frontend/nginx.conf.
# The literal `proxy_pass http://ai:8001/` below was the stale-IP bug
# described in AUT-5623 — it survives here only as a fossil and would 502
# after an `ai` container recreate if it were ever used.
# Fix the live config in docker/frontend/nginx.conf.
# Reverse proxy: /api -> backend, /ai -> AI gateway, / -> static frontend (optional)
server {
    listen 80;
    server_name _;
    server_tokens off;
    client_max_body_size 20m;

    # AUT-5460: identical to nginx.conf — rewrite $remote_addr from
    # CF-Connecting-IP for requests arriving from a Cloudflare edge
    # node, so per-client login rate limiting (X-Real-IP / socket
    # peer) keys on the real visitor instead of a shared edge ip.
    # The set_real_ip_from list is the trust boundary; backend
    # client_ip() still trusts only X-Real-IP / the socket peer,
    # keeping the AUT-303 spoof fix closed.
    real_ip_header CF-Connecting-IP;
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;

    # Re-resolve `backend` via Docker embedded DNS at request time so the
    # upstream IP survives backend container recreates (AUT-373).
    resolver 127.0.0.11 valid=5s ipv6=off;

    location /api/ {
        set $backend http://backend:8000;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        set $backend http://backend:8000;
        proxy_pass $backend;
    }

    location /ai/ {
        # AUT-5623: mirror the /api/ pattern — an upstream VARIABLE makes nginx
        # re-resolve `ai` through the Docker embedded DNS at request time, so the
        # IP survives AI gateway container recreates. A literal `proxy_pass
        # http://ai:8001/` is resolved once at startup and cached for the
        # process lifetime, which 502'd every /ai/* route after any recreate.
        set $ai http://ai:8001;
        # Fossil mirror of the live block in nginx.conf — kept in sync so this
        # dead file does not teach the wrong shape. Variable proxy_pass does
        # NOT strip the /ai/ prefix; the rewrite is required (AUT-5623).
        rewrite ^/ai(/.*)$ $1 break;
        proxy_pass $ai;
        proxy_set_header Host $host;
    }

    location /ws/ {
        set $backend http://backend:8000;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # Serve the Flutter web build if mounted; otherwise 404 page
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html =404;
    }
}
