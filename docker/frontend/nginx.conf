server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 20m;

    # Re-resolve `backend` via Docker embedded DNS at request time so the
    # upstream IP survives backend container recreates (AUT-373).
    resolver 127.0.0.11 valid=5s ipv6=off;

    # AUT-5460 (customer login lockout, AUT-3858): the immediate TCP
    # peer of this container is the local reverse proxy — the
    # nginx-proxy-manager container on the same docker bridge
    # (hosted: 172.18.0.3, measured live in PR #901: the
    # login-failure bucket was keyed login:fail:ip:172.18.0.3) or the
    # host nginx on EP2's bridge (172.26.0.1) — never a Cloudflare
    # edge. So $remote_addr was the proxy address and every visitor on
    # the internet shared one 5-failure/3-hour login bucket
    # (LOGIN_MAX_ATTEMPTS=5); five failures by anyone locked out
    # everyone.
    #
    # The realip module rewrites $remote_addr to CF-Connecting-IP
    # (forwarded through untouched by the proxy) for requests that
    # arrive from a trusted peer, so the X-Real-IP this file already
    # sets carries the real visitor to client_ip().
    # client_ip() is deliberately left trusting only the proxy-set
    # X-Real-IP (never client-supplied CF-Connecting-IP or
    # X-Forwarded-For) — that is the AUT-303 bypass fix, and it stays
    # closed: set_real_ip_from is the trust boundary, so a request
    # that arrives from anywhere else is never rewritten from a
    # spoofed header.
    real_ip_header CF-Connecting-IP;
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    # The local reverse proxy, i.e. the actual immediate peer. It hops
    # over the docker bridge pool (hosted npm 172.18.0.3, EP2 host
    # nginx 172.26.0.1), so realip only fires if that pool is trusted —
    # the Cloudflare edge ranges alone never match. A public client
    # cannot reach this container with a 172.16/12 source address (the
    # compose files bind the frontend to 127.0.0.1 on hosted/dev and
    # DNAT preserves an external source IP), so AUT-303 stays closed
    # against internet clients; the residual widening is a co-tenant
    # container on the same bridge being able to set X-Real-IP.
    # ponytail: trusting the whole pool is the cheapest expression
    # because the proxy's address is assigned by docker, not pinned in
    # any compose file in this repo. Upgrade path: pin npm's address
    # (`set_real_ip_from 172.18.0.3;`) once npm's stack is defined
    # here, or terminate realip at the proxy and forward a single
    # normalised header.
    set_real_ip_from 172.16.0.0/12;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # CSP + X-Frame-Options + Referrer-Policy on all responses (AUT-236)
    include /etc/nginx/conf.d/security-headers.inc;

    # Reverse proxy to backend / AI gateway (same compose network)
    location /api/ {
        set $backend http://backend:8000;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # $remote_addr, NOT $proxy_add_x_forwarded_for: the latter
        # re-attaches the client-supplied chain in front of the real
        # hop. Nothing reads X-Forwarded-For today (client_ip() ignores
        # it - AUT-303), so this is defence in depth for a future
        # reader of that header.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        set $backend http://backend:8000;
        proxy_pass $backend;
    }

    # AUT-4532: the post-deploy smoke probe hits /ready. Without this block the
    # `location /` SPA fallback below answered it with index.html (200 +
    # text/html), so the probe "passed" while never touching the backend.
    # ponytail: aliases /ready onto the backend /health handler — upgrade path
    # is a real backend /ready route once readiness must check Postgres/MinIO.
    location = /ready {
        set $backend http://backend:8000;
        proxy_pass $backend/health;
        proxy_set_header Host $host;
        access_log off;
    }

    # Private MinIO objects (AUT-321): the bucket is NOT anonymously readable.
    # Time-limited presigned GET URLs (returned by the backend) are proxied to
    # MinIO with the original signed Host header preserved so SigV4 validates.
    #
    # AUT-4317: the bucket prefix is per-environment — `autobrain-assets` on
    # dev/hosted, `autobrainservice-assets` on demo/default (deployed env drift;
    # see MINIO_BUCKET in the per-environment compose). A single hardcoded
    # prefix made the wrong environment's image serve the SPA shell
    # (`index.html`, text/html) instead of the asset, so community-hub photos
    # failed to load in the browser even though the presigned URLs were valid.
    # Match either prefix and forward the original URI (with its bucket prefix)
    # so MinIO resolves the object regardless of which bucket is in use.
    location ~ ^/(autobrain-assets|autobrainservice-assets)/ {
        proxy_pass http://minio:9000$request_uri;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /ai/ {
        set $backend http://backend:8001;
        proxy_pass $backend/;
        proxy_set_header Host $host;
    }

    location /ws/ {
        set $backend http://backend:8000;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # Never cache the app entry files — the Flutter web bundle is served under
    # stable URLs (flutter_bootstrap.js, main.dart.js) and would otherwise sit in
    # a CDN/browser cache after every deploy. Hashed assets under /assets/ are
    # immutable, so caching them is safe.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        include /etc/nginx/conf.d/security-headers.inc;
    }

    location = /flutter_bootstrap.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        include /etc/nginx/conf.d/security-headers.inc;
    }

    location = /main.dart.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        include /etc/nginx/conf.d/security-headers.inc;
    }

    location = /version.json {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        include /etc/nginx/conf.d/security-headers.inc;
    }

    # Never cache service worker
    location = /flutter_service_worker.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        include /etc/nginx/conf.d/security-headers.inc;
        try_files $uri =404;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/conf.d/security-headers.inc;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
