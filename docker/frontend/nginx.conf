server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 20m;

    # Re-resolve `backend` via Docker embedded DNS at request time so the
    # upstream IP survives backend container recreates (AUT-373).
    resolver 127.0.0.11 valid=5s ipv6=off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # CSP + X-Frame-Options + Referrer-Policy on all responses (AUT-236)
    include /etc/nginx/conf.d/security-headers.inc;

    # Reverse proxy to backend / AI gateway (same compose network)
    location /api/ {
        set $backend http://backend:8000;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        set $backend http://backend:8000;
        proxy_pass $backend;
    }

    # Private MinIO objects (AUT-321): the bucket is NOT anonymously readable.
    # Time-limited presigned GET URLs (returned by the backend) are proxied to
    # MinIO with the original signed Host header preserved so SigV4 validates.
    location /autobrain-assets/ {
        proxy_pass http://minio:9000;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /ai/ {
        set $backend http://backend:8001;
        proxy_pass $backend/;
        proxy_set_header Host $host;
    }

    location /ws/ {
        set $backend http://backend:8000;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # Never cache the app entry files — the Flutter web bundle is served under
    # stable URLs (flutter_bootstrap.js, main.dart.js) and would otherwise sit in
    # a CDN/browser cache after every deploy. Hashed assets under /assets/ are
    # immutable, so caching them is safe.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        include /etc/nginx/conf.d/security-headers.inc;
    }

    location = /flutter_bootstrap.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        include /etc/nginx/conf.d/security-headers.inc;
    }

    location = /main.dart.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        include /etc/nginx/conf.d/security-headers.inc;
    }

    location = /version.json {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        include /etc/nginx/conf.d/security-headers.inc;
    }

    # Never cache service worker
    location = /flutter_service_worker.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        include /etc/nginx/conf.d/security-headers.inc;
        try_files $uri =404;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/conf.d/security-headers.inc;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
