# AutoBrain HOSTED stack (self-service Free signup + Stripe subscriptions).
# Image-based deployment: prebuilt `cannonfodder151/autobrain-*:hosted` images
# from Docker Hub (builds: backend/worker/ai unchanged code; frontend built
# with API_BASE_URL/WS_BASE_URL pointed at the hosted instance).
#
# Portainer: standalone stack on endpoint 2 (Portainer-Host). The frontend
# nginx publishes on :8086 — the box's reverse proxy routes
# hosted.autobrainservice.app to it.
#
# Secrets are interpolated from ${VAR}; set them in Portainer's stack env
# vars or a local .env. Never commit real values.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-autobrain}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-autobrain}
      POSTGRES_DB: ${POSTGRES_DB:-autobrain}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-autobrain}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-autobrain}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-autobrain}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ACCESS_KEY:-autobrain} ${MINIO_SECRET_KEY:-autobrain} &&
      mc mb -p local/${MINIO_BUCKET:-autobrain-assets} || true &&
      mc anonymous set download local/${MINIO_BUCKET:-autobrain-assets} || true;
      "

  backend:
    image: cannonfodder151/autobrain-backend:hosted
    restart: unless-stopped
    environment:
      ENVIRONMENT: production
      SECRET_KEY: ${SECRET_KEY:-change-me}
      POSTGRES_USER: ${POSTGRES_USER:-autobrain}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-autobrain}
      POSTGRES_DB: ${POSTGRES_DB:-autobrain}
      POSTGRES_HOST: postgres
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-autobrain}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-autobrain}
      MINIO_BUCKET: ${MINIO_BUCKET:-autobrain-assets}
      MINIO_PUBLIC_ENDPOINT: ${APP_BASE_URL:-https://hosted.autobrainservice.app}
      AI_LOCAL_BASE_URL: http://ai:8001
      AI_ROUTER_URL: ${AI_ROUTER_URL:-http://your-9router-instance:port/v1}
      AI_ROUTER_API_KEY: ${AI_ROUTER_API_KEY:-}
      AI_ROUTER_MODEL: ${AI_ROUTER_MODEL:-General-Use}
      AI_ROUTER_TIMEOUT_SECONDS: 120
      REGO_LOOKUP_URL: ${REGO_LOOKUP_URL:-}
      REGO_LOOKUP_API_KEY: ${REGO_LOOKUP_API_KEY:-}
      MARKET_DATA_URL: ${MARKET_DATA_URL:-}
      MARKET_DATA_API_KEY: ${MARKET_DATA_API_KEY:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@autobrain.io}
      ADMIN_DISPLAY_NAME: AutoBrain Admin
      ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD:-}
      DEMO_MODE: "false"
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: 25
      SMTP_USE_TLS: "true"
      SMTP_USERNAME: ""
      SMTP_PASSWORD: ""
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-no-reply@autobrainservice.app}
      SMTP_FROM_NAME: AutoBrain
      APP_BASE_URL: ${APP_BASE_URL:-https://hosted.autobrainservice.app}
      MFA_ENFORCED: "true"
      LOGIN_MAX_ATTEMPTS: 5
      LOGIN_WINDOW_SECONDS: 10800
      ADMIN_API_KEY: ${ADMIN_API_KEY:-}
      SELF_SIGNUP_ENABLED: ${SELF_SIGNUP_ENABLED:-true}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_ENTHUSIAST_MONTHLY: ${STRIPE_PRICE_ENTHUSIAST_MONTHLY:-}
      STRIPE_PRICE_ENTHUSIAST_YEARLY: ${STRIPE_PRICE_ENTHUSIAST_YEARLY:-}
      STRIPE_PRICE_GARAGE_MONTHLY: ${STRIPE_PRICE_GARAGE_MONTHLY:-}
      STRIPE_PRICE_GARAGE_YEARLY: ${STRIPE_PRICE_GARAGE_YEARLY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    expose:
      - "8000"

  worker:
    image: cannonfodder151/autobrain-worker:hosted
    restart: unless-stopped
    environment:
      ENVIRONMENT: production
      PYTHONPATH: /app
      POSTGRES_HOST: postgres
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-autobrain}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-autobrain}
      MINIO_BUCKET: ${MINIO_BUCKET:-autobrain-assets}
      AI_LOCAL_BASE_URL: http://ai:8001
      AI_ROUTER_URL: ${AI_ROUTER_URL:-http://your-9router-instance:port/v1}
      AI_ROUTER_API_KEY: ${AI_ROUTER_API_KEY:-}
      AI_ROUTER_MODEL: ${AI_ROUTER_MODEL:-General-Use}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    command: ["celery", "-A", "app.workers.celery_app:celery_app", "worker", "-l", "info", "--concurrency=2"]

  beat:
    image: cannonfodder151/autobrain-worker:hosted
    restart: unless-stopped
    environment:
      ENVIRONMENT: production
      PYTHONPATH: /app
      POSTGRES_HOST: postgres
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-autobrain}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-autobrain}
      MINIO_BUCKET: ${MINIO_BUCKET:-autobrain-assets}
      AI_LOCAL_BASE_URL: http://ai:8001
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["celery", "-A", "app.workers.celery_app:celery_app", "beat", "-l", "info"]

  ai:
    image: cannonfodder151/autobrain-ai:hosted
    restart: unless-stopped
    environment:
      AI_ROUTER_URL: ${AI_ROUTER_URL:-http://your-9router-instance:port/v1}
      AI_ROUTER_API_KEY: ${AI_ROUTER_API_KEY:-}
      AI_ROUTER_MODEL: ${AI_ROUTER_MODEL:-General-Use}
    expose:
      - "8001"

  frontend:
    image: cannonfodder151/autobrain-frontend:hosted
    restart: unless-stopped
    ports:
      - "8086:80"
    depends_on:
      - backend
      - ai

volumes:
  postgres-data:
  redis-data:
  minio-data:
