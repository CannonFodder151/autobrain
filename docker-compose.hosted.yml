# AutoBrain HOSTED stack — self-service Free signup + Stripe subscriptions.
# Deployed on Oracle Cloud VM (152.69.188.133) via Portainer stack on endpoint 5.
# Uses prebuilt `cannonfodder151/autobrain-*:hosted` Docker Hub images.
# Frontend nginx on :8086 → box reverse proxy → hosted.autobrainservice.app.
# Self-signup enabled, MFA enforced, LICENSE_ENABLED=true.
#
# Secrets interpolated from Portainer stack env vars or local .env.
# Never commit real values.

x-core-env: &core-env
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/1
  CELERY_RESULT_BACKEND: redis://redis:6379/2
  MINIO_ENDPOINT: minio:9000
  MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-autobrain}
  MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-autobrain}
  MINIO_BUCKET: ${MINIO_BUCKET:-autobrain-assets}
  AI_LOCAL_BASE_URL: http://ai:8001
  AI_ROUTER_URL: ${AI_ROUTER_URL:-http://your-9router-instance:port/v1}
  AI_ROUTER_API_KEY: ${AI_ROUTER_API_KEY:-}
  AI_ROUTER_MODEL: ${AI_ROUTER_MODEL:-General-Use}

x-db-env: &db-env
  ENVIRONMENT: production
  POSTGRES_HOST: postgres
  POSTGRES_USER: ${POSTGRES_USER:-autobrain}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-autobrain}
  POSTGRES_DB: ${POSTGRES_DB:-autobrain}

services:
  # ── Datastores ──────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-autobrain}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-autobrain}
      POSTGRES_DB: ${POSTGRES_DB:-autobrain}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-autobrain}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-autobrain}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-autobrain}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── App services (prebuilt images from Docker Hub) ─────────
  backend:
    image: cannonfodder151/autobrain-backend:hosted
    restart: unless-stopped
    environment:
      <<: [*db-env, *core-env]
      SECRET_KEY: ${SECRET_KEY:-change-me}
      MINIO_PUBLIC_ENDPOINT: ${APP_BASE_URL:-https://hosted.autobrainservice.app}
      AI_ROUTER_TIMEOUT_SECONDS: 120
      REGO_LOOKUP_URL: ${REGO_LOOKUP_URL:-}
      REGO_LOOKUP_API_KEY: ${REGO_LOOKUP_API_KEY:-}
      MARKET_DATA_URL: ${MARKET_DATA_URL:-}
      MARKET_DATA_API_KEY: ${MARKET_DATA_API_KEY:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@autobrain.io}
      ADMIN_DISPLAY_NAME: AutoBrain Admin
      ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD:-}
      DEMO_MODE: "false"
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: 25
      SMTP_USE_TLS: "true"
      SMTP_USERNAME: ""
      SMTP_PASSWORD: ""
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-no-reply@autobrainservice.app}
      SMTP_FROM_NAME: AutoBrain
      APP_BASE_URL: ${APP_BASE_URL:-https://hosted.autobrainservice.app}
      MFA_ENFORCED: "true"
      LOGIN_MAX_ATTEMPTS: 5
      LOGIN_WINDOW_SECONDS: 10800
      ADMIN_API_KEY: ${ADMIN_API_KEY:-}
      SELF_SIGNUP_ENABLED: ${SELF_SIGNUP_ENABLED:-true}
      LICENSE_ENABLED: "true"
  # Stripe billing — hosted instance enables the License page.
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_ENTHUSIAST_MONTHLY: ${STRIPE_PRICE_ENTHUSIAST_MONTHLY:-}
      STRIPE_PRICE_ENTHUSIAST_YEARLY: ${STRIPE_PRICE_ENTHUSIAST_YEARLY:-}
      STRIPE_PRICE_GARAGE_MONTHLY: ${STRIPE_PRICE_GARAGE_MONTHLY:-}
      STRIPE_PRICE_GARAGE_YEARLY: ${STRIPE_PRICE_GARAGE_YEARLY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    expose:
      - "8000"

  ai:
    image: cannonfodder151/autobrain-ai:hosted
    restart: unless-stopped
    environment:
      AI_ROUTER_URL: ${AI_ROUTER_URL:-http://your-9router-instance:port/v1}
      AI_ROUTER_API_KEY: ${AI_ROUTER_API_KEY:-}
      AI_ROUTER_MODEL: ${AI_ROUTER_MODEL:-General-Use}
    expose:
      - "8001"

  frontend:
    image: cannonfodder151/autobrain-frontend:hosted
    restart: unless-stopped
    ports:
      - "8086:80"
    depends_on:
      - backend
      - ai

volumes:
  postgres-data:
  redis-data:
  minio-data:
