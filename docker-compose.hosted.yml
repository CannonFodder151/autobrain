# AutoBrain HOSTED stack — Portainer stack "autobrain-hosted" (EP5, Oracle Cloud 152.69.188.133)
# Restored to match the actual running services (AUT-101). Project name: autobrain-hosted.
# App images from ghcr.io (multi-arch: the Oracle host is arm64 and Docker Hub :hosted tags are
# amd64-only since AUT-967; ghcr :hosted carries amd64+arm64, AUT-1114). Secrets interpolated
# from the Portainer stack env.
# Env must stay applied via the stack so redeploys never revert SMTP2GO/SMTP_* (see AUT-97/AUT-101).

x-core-env: &core-env
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/1
  CELERY_RESULT_BACKEND: redis://redis:6379/2
  MINIO_ENDPOINT: minio:9000
  MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY must be set}
  MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY must be set}
  MINIO_BUCKET: ${MINIO_BUCKET:-autobrain-assets}
  AI_LOCAL_BASE_URL: http://ai:8001

x-db-env: &db-env
  ENVIRONMENT: production
  POSTGRES_HOST: postgres
  POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
  POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set}

x-router-env: &router-env
  AI_ROUTER_URL: ${AI_ROUTER_URL:-http://9router:20128/v1}
  AI_ROUTER_API_KEY: ${AI_ROUTER_API_KEY:-}
  AI_ROUTER_MODEL: ${AI_ROUTER_MODEL:-General-Use}

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    # Pinned to immutable release (AUT-322). digest sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY must be set}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY must be set}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    # Pinned to immutable release (AUT-322). digest sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY must be set} ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY must be set} &&
      mc mb -p local/${MINIO_BUCKET:-autobrain-assets} || true &&
      mc anonymous set none local/${MINIO_BUCKET:-autobrain-assets} || true;
      "

  backend:
    image: ghcr.io/cannonfodder151/autobrain-backend:hosted
    restart: unless-stopped
    command: sh -c "python -m app.db.bootstrap && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    environment:
      <<: [*db-env, *core-env, *router-env]
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set in the hosted stack env (Portainer)}
      MINIO_PUBLIC_ENDPOINT: ${APP_BASE_URL:-https://hosted.autobrainservice.app}
      AI_ROUTER_TIMEOUT_SECONDS: 120
      REGO_LOOKUP_URL: ${REGO_LOOKUP_URL:-}
      REGO_LOOKUP_API_KEY: ${REGO_LOOKUP_API_KEY:-}
      MARKET_DATA_URL: ${MARKET_DATA_URL:-http://market-data:8000}
      MARKET_DATA_API_KEY: ${MARKET_DATA_API_KEY:-}
      AI_GATEWAY_API_KEY: ${AI_GATEWAY_API_KEY:?AI_GATEWAY_API_KEY must be set in the hosted stack env (Portainer)}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@autobrain.io}
      ADMIN_DISPLAY_NAME: AutoBrain Admin
      ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD:-}
      DEMO_MODE: "false"
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-no-reply@autobrainservice.app}
      SMTP_FROM_NAME: AutoBrain
      APP_BASE_URL: ${APP_BASE_URL:-https://hosted.autobrainservice.app}
      MFA_ENFORCED: "true"
      LOGIN_MAX_ATTEMPTS: 5
      LOGIN_WINDOW_SECONDS: 10800
      ADMIN_API_KEY: ${ADMIN_API_KEY:-}
      SELF_SIGNUP_ENABLED: ${SELF_SIGNUP_ENABLED:-true}
      LICENSE_ENABLED: "true"
      # Community Garage federation hub (AUT-532): the hub is a sibling service
      # in this stack. Wire the URL so /admin/social/register works (was 502
      # "hub not configured"); AutoBrain-Hosted registers hosted=true (free).
      SOCIAL_FEDERATION_HUB_URL: ${SOCIAL_FEDERATION_HUB_URL:-https://hub.autobrainservice.app}
      SOCIAL_FEDERATION_HOSTED: "true"
      SOCIAL_FEDERATION_HOSTED_REGISTRATION_KEY: ${SOCIAL_FEDERATION_HOSTED_REGISTRATION_KEY:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_ENTHUSIAST_MONTHLY: ${STRIPE_PRICE_ENTHUSIAST_MONTHLY:-}
      STRIPE_PRICE_ENTHUSIAST_YEARLY: ${STRIPE_PRICE_ENTHUSIAST_YEARLY:-}
      STRIPE_PRICE_GARAGE_MONTHLY: ${STRIPE_PRICE_GARAGE_MONTHLY:-}
      STRIPE_PRICE_GARAGE_YEARLY: ${STRIPE_PRICE_GARAGE_YEARLY:-}
  # Early-adopter sale (AUT-111): coupon EARLY40, 40% off first 3 months.
      STRIPE_PROMO_EARLY_ADOPTER: ${STRIPE_PROMO_EARLY_ADOPTER:-}
      STRIPE_PROMO_EARLY_ADOPTER_CODE: ${STRIPE_PROMO_EARLY_ADOPTER_CODE:-EARLY40}
      STRIPE_SALE_ENDS_AT: ${STRIPE_SALE_ENDS_AT:-}
      # Store-native IAP (AUT-610/617): empty = disabled (mobile falls back to
      # the Stripe browser path). Credentials are Paperclip secrets.
      IAP_GOOGLE_SERVICE_ACCOUNT_JSON: ${IAP_GOOGLE_SERVICE_ACCOUNT_JSON:-}
      IAP_GOOGLE_PACKAGE_NAME: ${IAP_GOOGLE_PACKAGE_NAME:-com.autobrainservice.app}
      IAP_APPLE_ISSUER_ID: ${IAP_APPLE_ISSUER_ID:-}
      IAP_APPLE_KEY_ID: ${IAP_APPLE_KEY_ID:-}
      IAP_APPLE_PRIVATE_KEY: ${IAP_APPLE_PRIVATE_KEY:-}
      IAP_APPLE_BUNDLE_ID: ${IAP_APPLE_BUNDLE_ID:-com.autobrainservice.app}
      IAP_REFRESH_WINDOW_DAYS: ${IAP_REFRESH_WINDOW_DAYS:-2}
      IAP_GOOGLE_PUBSUB_AUDIENCE: ${IAP_GOOGLE_PUBSUB_AUDIENCE:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    expose:
      - "8000"
    # Backend pinned to .15 (AUT-439): the frontend's static .14 was being
    # grabbed by the recreated backend during redeploys, stalling the stack.
    networks:
      default:
        ipv4_address: 172.18.0.15

  ai:
    image: ghcr.io/cannonfodder151/autobrain-ai:hosted
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8001
    environment:
      <<: *router-env
      AI_GATEWAY_API_KEY: ${AI_GATEWAY_API_KEY:?AI_GATEWAY_API_KEY must be set in the hosted stack env (Portainer)}
    expose:
      - "8001"

  market-data:
    image: ghcr.io/cannonfodder151/autobrain-market-data:hosted
    restart: unless-stopped
    environment:
      API_KEY: ${MARKET_DATA_API_KEY:-}
    expose:
      - "8000"

  worker:
    image: ghcr.io/cannonfodder151/autobrain-worker:hosted
    restart: unless-stopped
    # AUT-1242/C1: beat scheduler embedded in the worker (-B), matching the dev
    # compose. Removes the separate beat container.
    command: celery -A app.workers.celery_app:celery_app worker -B -l info --concurrency=2
    environment:
      <<: [*db-env, *core-env, *router-env]
      PYTHONPATH: /app
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set in the hosted stack env (Portainer)}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    image: ghcr.io/cannonfodder151/autobrain-frontend:hosted
    restart: unless-stopped
    # AUT-473: localhost-bound. External clients reach the app via Cloudflare ->
    # npm (:443), which proxies to the frontend over the docker network. Never
    # re-expose 8086 to 0.0.0.0 (origin bypasses Cloudflare/WAF).
    ports:
      - "127.0.0.1:8086:80"
    networks:
      default:
        ipv4_address: 172.18.0.14
    depends_on:
      - backend
      - ai

  hub:
    # Community Garage federation hub (AUT-333) — deploy config only.
    # Hub internals live in the PRIVATE repo autobrain-federation-hub
    # (board rev 8): private code, private GHCR image. Nothing here is hub code.
    image: ghcr.io/cannonfodder151/autobrain-federation-hub:hosted
    restart: unless-stopped
    environment:
      DATABASE_PATH: /data/hub.db
      HUB_PUBLIC_BASE_URL: ${HUB_PUBLIC_BASE_URL:-https://hub.autobrainservice.app}
      HUB_STRIPE_SECRET_KEY: ${HUB_STRIPE_SECRET_KEY:-}
      HUB_STRIPE_WEBHOOK_SECRET: ${HUB_STRIPE_WEBHOOK_SECRET:-}
      HUB_STRIPE_PRICE_FEDERATION_YEAR: ${HUB_STRIPE_PRICE_FEDERATION_YEAR:-}
      HUB_ADMIN_KEY: ${HUB_ADMIN_KEY:-}
      HUB_HOSTED_REGISTRATION_KEY: ${HUB_HOSTED_REGISTRATION_KEY:-}
    volumes:
      - hub-data:/data
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=3).status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5

  # 9Router AI router (AUT-473). Localhost-bound on :20128 — the admin dashboard
  # and API are NOT internet-reachable. backend/ai consume it via docker DNS
  # (http://9router:20128/v1); ops reach the dashboard via SSH tunnel only.
  # Data lives in the external `9router-data` volume (created by the original
  # standalone container) so provider/API-key config persists across recreates.
  9router:
    image: decolua/9router:latest
    restart: unless-stopped
    entrypoint: ["/entrypoint.sh"]
    command: ["node", "custom-server.js"]
    environment:
      NODE_ENV: production
      PORT: 20128
      HOSTNAME: 0.0.0.0
      NEXT_TELEMETRY_DISABLED: "1"
      DATA_DIR: /app/data
    volumes:
      - 9router-data:/app/data
    ports:
      - "127.0.0.1:20128:20128"

volumes:
   postgres-data:
   redis-data:
   minio-data:
   hub-data:
   9router-data:
     external: true

# AUT-372: pin the default network subnet + a static frontend IP. The host-level
# nginx-proxy-manager (npm) caches the resolved frontend container IP, so a
# changing IP = 502 until npm is restarted; a static IP keeps the cached value
# permanently correct across container recreates.
networks:
  default:
    ipam:
      config:
        - subnet: 172.18.0.0/16
          gateway: 172.18.0.1
