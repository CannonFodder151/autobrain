; Freematics ONE+ Model B reference build. Requires the Freematics ONE+ SDK
; board package + libraries (freematics.com). Kept for reference; the
; compile-verified PoC build is in ../esp32-diy/.
[env:freematics-one-plus]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_extra_dirs = /path/to/Freematics-ONE-plus-SDK/libraries
