<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AutoBrain Dongle Server</title>
  <style>
    body{font:400 14px/1.5 -apple-system,Segoe UI,Roboto,sans-serif;margin:0;background:#0f172a;color:#e2e8f0}
    header{background:#1e293b;padding:16px 20px}
    header h1{font-size:18px;margin:0;color:#f8fafc}
    main{max-width:960px;margin:0 auto;padding:20px}
    a{color:#38bdf8}
    table{width:100%;border-collapse:collapse;margin-top:12px}
    th,td{text-align:left;padding:8px 10px;border-bottom:1px solid #334159;font-size:13px}
    th{color:#94a3b8}
    .card{background:#1e293b;border-radius:10px;padding:16px;margin:12px 0}
    input,textarea{background:#0f172a;border:1px solid #334159;border-radius:6px;padding:8px;color:#e2e8f0;width:100%;box-sizing:border-box}
    button{background:#2563eb;color:#fff;border:0;border-radius:6px;padding:8px 14px;cursor:pointer}
    button:hover{background:#3b82f6}
    .muted{color:#64748b;font-size:12px}
  </style>
</head>
<body>
  <header><h1>AutoBrain Dongle Server</h1></header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
