# AutoBrain production stack.
# Builds from source, tags images as ${DOCKERHUB_USERNAME}/autobrain-*.
# Runs: postgres, redis, minio, minio-init, backend, worker, beat, ai, frontend.
# Nginx frontend container serves Flutter web + proxies /api, /ws, /ai.
# No ports exposed except frontend :80. All internal services exposed only via Compose network.
#
# First time:
#   cp .env.example .env           # fill in values, especially SECRET_KEY
#   docker compose -f docker-compose.prod.yml up -d --build
# Updates:
#   ./scripts/deploy.sh user@host

x-core-env: &core-env
  ENVIRONMENT: production
  PYTHONPATH: /app
  REDIS_URL: redis://redis:6379/0
  MINIO_ENDPOINT: minio:9000
  AI_LOCAL_BASE_URL: http://ai:8001

x-backend-base: &backend-base
  build:
    context: .
    dockerfile: docker/backend/Dockerfile
  image: ${DOCKERHUB_USERNAME:-autobrain}/autobrain-backend:${IMAGE_TAG:-latest}
  restart: unless-stopped
  env_file: .env
  environment:
    POSTGRES_HOST: postgres
    <<: *core-env
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    minio:
      condition: service_healthy
  expose:
    - "8000"

services:
  # ── Datastores ──────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── App services ───────────────────────────────────────────
  backend:
    <<: *backend-base

  worker:
    build:
      context: .
      dockerfile: docker/worker/Dockerfile
      args:
        BASE_IMAGE: ${DOCKERHUB_USERNAME:-autobrain}/autobrain-backend:${IMAGE_TAG:-latest}
    image: ${DOCKERHUB_USERNAME:-autobrain}/autobrain-worker:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      <<: *core-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  ai:
    build:
      context: ./ai
      dockerfile: ../docker/ai/Dockerfile
    image: ${DOCKERHUB_USERNAME:-autobrain}/autobrain-ai:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      AI_ROUTER_URL: ${AI_ROUTER_URL}
    expose:
      - "8001"

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
      args:
        API_BASE_URL: ${API_BASE_URL:-http://localhost:8000/api/v1}
        WS_BASE_URL: ${WS_BASE_URL:-ws://localhost:8000/ws}
    image: ${DOCKERHUB_USERNAME:-autobrain}/autobrain-frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
      - ai

# ── Persistent volumes ──────────────────────────────────────
volumes:
  postgres-data:
  redis-data:
  minio-data:
