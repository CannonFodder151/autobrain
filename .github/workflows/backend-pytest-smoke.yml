# AUT-2277: smoke-run pytest (model-metadata + alembic-graph regression guards)
# on every push and PR so duplicate table-name registrations and other model
# definition regressions get caught before they reach main or break pytest
# collection in developer environments.
name: Backend — pytest smoke (model metadata + alembic heads)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pytest-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest-smoke:
    name: pytest — model metadata + alembic heads
    runs-on: [self-hosted, linux, x64]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend deps
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Run pytest smoke (alembic heads + AI merged-image layout)
        run: |
          set -euo pipefail
          # AUT-2277 regression guard only. Runs the offline alembic-graph +
          # duplicate-tablename tests, which do not import the app and cannot
          # be broken by unrelated test-module rot (e.g. AUT-2201/2203 station
          # annotation tests, which still pull in app.api.v1.fuel and are out
          # of scope here).
          #
          # AUT-4788: also run the AI gateway merged-image layout guard. The
          # Hosted gateway was dark for 5 releases (v0.3.276 -> v0.3.287)
          # because ai/app ships as `ai_app` while absolute `app.*` imports
          # resolved to the BACKEND package. This job is blocking (no `|| true`)
          # and runs on every push/PR, so ai/**, docker/backend/Dockerfile and
          # docker-compose*.yml changes cannot ship that break green again.
          python -m pytest \
            tests/test_alembic_heads.py \
            ../ai/tests/test_merged_image_layout.py \
            -q