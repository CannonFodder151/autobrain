name: Build hosted images (multi-arch)

on:
  push:
    branches: [main]
  # AUT-5186: nightly 03:00 AEST (17:00 UTC, no DST) — the start of the
  # AUT-2409 hosted deploy window. Only the nightly-hosted-sync job runs on
  # schedule; it applies the pins the push path already bumped in git.
  #
  # AUT-5396: the cron fires well BEFORE the window opens to absorb
  # GitHub's schedule dispatcher variance (observed 2.6–4.2h, but
  # 2026-10-05 saw ~8h delay causing AUT-5792). Firing at 08:00Z keeps
  # the start inside the window even at 10h delay (08:00+10h=18:00Z),
  # and the wait step below holds early starts at the 17:00Z boundary.
  # Deploys still happen ONLY inside 03:00–04:00 AEST — the gate in
  # scripts/sync-compose-to-portainer.py remains the enforcement.
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag
        required: true
        default: hosted
      api_base_url:
        description: Frontend API base URL
        required: true
        default: https://hosted.autobrainservice.app/api/v1
      ws_base_url:
        description: Frontend WS base URL
        required: true
        default: wss://hosted.autobrainservice.app/ws

# Only one pipeline per ref at a time, but do NOT cancel an in-flight build.
# The multi-arch release build takes ~20 min; a newer push to main (PR merge or
# auto-bump) arriving mid-build would otherwise cancel it and leave main with no
# :hosted image (AUT-1756, root cause AUT-1762). Queue the newer run behind the
# in-flight one so every push to main still produces a published manifest. The
# auto-bump commit is tagged [skip ci] (scripts/auto-bump.sh) so it never
# re-triggers this workflow and the in-flight build is never cancelled by its
# own version cut.
#
# AUT-5669: this group does serialise runs — verified against the
# 2026-10-04/05 queue (37248864015 jobs 01:49-02:46Z, 37256005198 jobs
# 03:00-04:00Z, 37252035927 cancelled as the newer pending run replaced it;
# `startedAt` is set at queue time, which is why `gh run list` makes a queued
# run look concurrent). Out-of-order pin bumps are still possible when a stale
# run is re-run after a newer one pinned, so the compose-pin job re-checks
# ordering itself via scripts/update-compose-pins.py --source-sha.
concurrency:
  group: build-hosted-${{ github.ref }}
  cancel-in-progress: false

jobs:
  auto-bump:
    # x64 jobs run on the new vm2 runner (gh-runner-autobrain-2). The legacy
    # x64 runner (gh-runner-autobrain) is currently degraded (AUT-1781); routing
    # on `vm2` guarantees dispatch to the healthy new runner. Re-balance across
    # legacy+new again by dropping `vm2` once AUT-1781 is repaired. ARM builds
    # stay pinned to the Oracle VM arm64 runner below.
    # AUT-5186: a schedule run lands on refs/heads/main too, so exclude it
    # explicitly — the nightly sync must not cut a release.
    if: github.event_name != 'pull_request' && github.event_name != 'schedule' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, x64, vm2]
    permissions:
      contents: write
    steps:
      # Use actions/checkout so the GITHUB_TOKEN is persisted by the
      # credential helper (the manual git init did not authenticate pushes,
      # crashing the auto-bump and blocking multi-arch arm64 image builds —
      # AUT-1114).
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Cut a release if [Unreleased] has content (AUT-240)
        run: |
          set -euo pipefail
          git config user.name "AutoBrain Release Bot"
          git config user.email "release@autobrainservice.app"
          ./scripts/auto-bump.sh
          # Only push when auto-bump actually committed a release cut; an
          # empty push fails on the credential helper and blocks the build
          # (AUT-1114).
          if ! git diff --quiet origin/main --; then
            for i in 1 2 3; do
              git push origin main && break
              echo "==> push raced with main updates — rebasing and retrying (attempt $i/3)"
              git pull --rebase origin main
            done
          else
            echo "==> nothing to bump — no push needed"
          fi
          echo "==> auto-bump done"

  build:
    needs: auto-bump
    # AUT-5186: the nightly cron only syncs pins (nightly-hosted-sync);
    # it must never rebuild or re-pin images.
    if: github.event_name != 'pull_request' && github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runs_on: [self-hosted, linux, x64, vm2]
          # arm64 builds stay on the Oracle VM arm64 runner (gh-runner-autobrain-arm64).
          - arch: arm64
            runs_on: [self-hosted, linux, ARM64]
    runs-on: ${{ matrix.runs_on }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT || secrets.GITHUB_TOKEN }}

      - name: Verify runner arch (${{ matrix.arch }})
        # AUT-2097: catch a qemu-user-x86_64 shim on the arm64 runner before any
        # build runs. If the runner claims ARM64 but uname reports x86_64, every
        # image it produces is contaminated regardless of --platform.
        run: |
          set -euo pipefail
          want="${{ matrix.arch }}"
          got="$(uname -m)"
          case "$want" in
            amd64) norm="x86_64";;
            arm64) norm="aarch64";;
            *) echo "::error::unknown matrix arch $want"; exit 2;;
          esac
          if [ "$got" != "$norm" ]; then
            echo "::error::runner arch mismatch: want $want (=$norm), got $got"
            exit 1
          fi
          echo "==> runner arch OK: $got ($want)"

      - name: Clear buildx builder cache (arm64 only)
        if: matrix.arch == 'arm64'
        # AUT-2656: the self-hosted arm64 runner retains stale amd64 layer blobs
        # from prior builds. Even with --pull (AUT-2998) and per-arch GHA cache
        # scoping (AUT-2097), buildx can resolve base images from the local
        # builder cache instead of the registry, producing arm64 manifests that
        # ship amd64 binaries (exec format error on the Oracle VM). Prune the
        # full local builder cache before each arm64 build to prevent this.
        run: |
          echo "==> clearing local buildx builder cache (arm64)"
          docker buildx prune -a -f || true

      - name: Build and push images (linux/${{ matrix.arch }})
        env:
          TAG: ${{ github.event.inputs.tag || 'hosted' }}
          ARCH: ${{ matrix.arch }}
          API_BASE_URL: ${{ github.event.inputs.api_base_url || 'https://hosted.autobrainservice.app/api/v1' }}
          WS_BASE_URL: ${{ github.event.inputs.ws_base_url || 'wss://hosted.autobrainservice.app/ws' }}
          # AUT-2220: CARTO basemap API key (public by design, embedded in tile URLs)
          CARTO_API_KEY: ${{ secrets.CARTO_API_KEY || '' }}
          # AUT-2097: scope GHA buildx cache per-arch so the arm64 build cannot
          # pull amd64 layer blobs from the x64 cache namespace (cache poisoning
          # produced OCI manifests that declared arm64 but shipped amd64 layers,
          # crashing on the Oracle VM with exec format error).
          CACHE_FROM: ${{ matrix.arch == 'arm64' && '' || format('type=gha,scope=build-hosted-{0}', matrix.arch) }}
          CACHE_TO: ${{ format('type=gha,scope=build-hosted-{0},mode=max', matrix.arch) }}
        run: |
          set -euo pipefail
          for svc in backend ai frontend; do
            case "$svc" in
              backend)  ctx=.;        df=docker/backend/Dockerfile;   args="";;
              ai)       ctx=.;        df=docker/ai/Dockerfile;         args="";;
              frontend) ctx=.;        df=docker/frontend/Dockerfile;   args="--build-arg API_BASE_URL=${API_BASE_URL} --build-arg WS_BASE_URL=${WS_BASE_URL} --build-arg CARTO_API_KEY=${CARTO_API_KEY}";;
            esac
            echo "==> building autobrain-${svc}:${TAG}-${ARCH} for linux/${ARCH}"
            # shellcheck disable=SC2086
            cache_from_args=()
            if [ -n "${CACHE_FROM}" ]; then
              cache_from_args=(--cache-from "${CACHE_FROM}")
            fi
            docker buildx build --platform linux/${ARCH} --push \
              "${cache_from_args[@]}" \
              --cache-to   "${CACHE_TO}" \
              --pull \
              -t "ghcr.io/cannonfodder151/autobrain-${svc}:${TAG}-${ARCH}" \
              -t "ghcr.io/cannonfodder151/autobrain-${svc}:${TAG}-${ARCH}-sha-${GITHUB_SHA}" \
              ${args} -f "${df}" "${ctx}"
          done

      - name: Verify pushed image arch (${{ matrix.arch }})
        # AUT-2097: post-build smoke test. Pulls each freshly-pushed :hosted-ARCH
        # image and runs `uname -m` inside it. If BuildKit served amd64 layers
        # under an arm64 manifest, this step fails the job before manifest
        # assembly promotes the bad digest to the :hosted multi-arch tag.
        env:
          TAG: ${{ github.event.inputs.tag || 'hosted' }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          norm=""
          case "$ARCH" in
            amd64) norm="x86_64";;
            arm64) norm="aarch64";;
            *) echo "::error::unknown arch $ARCH"; exit 2;;
          esac
          for svc in backend ai frontend; do
            img="ghcr.io/cannonfodder151/autobrain-${svc}:${TAG}-${ARCH}"
            echo "==> verifying $img"
            # Force-pull from the registry so the verify step always tests
            # the freshly-pushed image, not a stale local copy that the
            # self-hosted runner may have cached from a previous (possibly
            # tainted) build.
            docker rmi "$img" 2>/dev/null || true
            docker pull --platform linux/${ARCH} "$img"
            got="$(docker run --rm --platform linux/${ARCH} "$img" uname -m)"
            if [ "$got" != "$norm" ]; then
              echo "::error::$img reports arch=$got, expected $norm — refusing to assemble manifest"
              exit 1
            fi
            # /bin/sh -c true catches the exec format error case directly.
            docker run --rm --platform linux/${ARCH} "$img" /bin/sh -c 'true'
          done
          echo "==> all ${ARCH} images verified"

  build-manifest:
    needs: build
    outputs:
      backend_digest: ${{ steps.digest.outputs.backend_digest }}
      worker_digest: ${{ steps.digest.outputs.worker_digest }}
      ai_digest: ${{ steps.digest.outputs.ai_digest }}
      frontend_digest: ${{ steps.digest.outputs.frontend_digest }}
    # AUT-5186: the nightly cron only syncs pins (nightly-hosted-sync);
    # it must never rebuild or re-pin images.
    if: github.event_name != 'pull_request' && github.event_name != 'schedule'
    # AUT-5171: registry/git-only job — no image build, no self-hosted
    # dockerd dependency. GitHub-hosted so the release tail can never
    # starve behind PR gate jobs on the contended x64 vm2 pool.
    runs-on: [self-hosted, linux, x64, vm2]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT || secrets.GITHUB_TOKEN }}

      # AUT-2097: refuse to assemble the multi-arch :hosted manifest if either
      # arch side failed its post-build verification. Without this gate, a
      # failing build job would still let imagetools promote amd64 into both
      # slots of the arm64-bearing :hosted index.
      #
      # AUT-5669: check this run's immutable per-commit tags, not the moving
      # :hosted-ARCH tags — those could already point at another build by the
      # time this job runs.
      - name: Gate manifest assembly on per-arch verification
        env:
          TAG: ${{ github.event.inputs.tag || 'hosted' }}
        run: |
          set -euo pipefail
          for svc in backend ai frontend; do
            for arch in amd64 arm64; do
              img="ghcr.io/cannonfodder151/autobrain-${svc}:${TAG}-${arch}-sha-${GITHUB_SHA}"
              if ! docker buildx imagetools inspect "$img" >/dev/null 2>&1; then
                echo "::error::$img missing — per-arch build for $arch did not publish. Aborting manifest assembly."
                exit 1
              fi
            done
          done

      - name: Assemble multi-arch manifests
        id: digest
        env:
          TAG: ${{ github.event.inputs.tag || 'hosted' }}
          SHA_TAG: hosted-sha-${{ github.sha }}
        run: |
          set -euo pipefail
          for svc in backend ai frontend; do
            echo "==> manifest autobrain-${svc}:${TAG}"
            # AUT-5669: assemble from this commit's immutable per-arch tags.
            # Reading :hosted-ARCH here meant the index could be built from
            # whatever those tags pointed at when THIS job ran — which is how
            # :hosted and the compose pin ended up naming different things.
            srcs=""
            for arch in amd64 arm64; do
              srcs="$srcs ghcr.io/cannonfodder151/autobrain-${svc}:${TAG}-${arch}-sha-${GITHUB_SHA}"
            done
            # AUT-1533/F4: every build also publishes an immutable per-commit
            # tag so prod/dev can pin distinct digests instead of drifting on
            # the same floating :hosted ref.
            # shellcheck disable=SC2086
            docker buildx imagetools create \
              -t "ghcr.io/cannonfodder151/autobrain-${svc}:${TAG}" \
              -t "ghcr.io/cannonfodder151/autobrain-${svc}:${SHA_TAG}" \
              $srcs
          done

          # AUT-1881: capture every multi-arch manifest digest so the
          # compose-pin job can atomically bump docker-compose.hosted.yml.
          # `--raw` outputs the bare manifest JSON bytes; sha256sum produces
          # the content-addressed digest (Docker-Content-Digest) that compose
          # pins reference as `@sha256:...`.
          for svc in backend ai frontend; do
            d="$(docker buildx imagetools inspect "ghcr.io/cannonfodder151/autobrain-${svc}:${TAG}" --raw | sha256sum | awk '{print $1}')"
            echo "${svc}_digest=sha256:${d}" >> "$GITHUB_OUTPUT"
          done

  compose-pin:
    needs: build-manifest
    # AUT-5186: the nightly cron only syncs pins (nightly-hosted-sync);
    # it must never rebuild or re-pin images.
    if: github.event_name != 'pull_request' && github.event_name != 'schedule'
    # AUT-5171: registry/git-only job — no image build, no self-hosted
    # dockerd dependency. GitHub-hosted so the release tail can never
    # starve behind PR gate jobs on the contended x64 vm2 pool.
    runs-on: [self-hosted, linux, x64, vm2]
    permissions:
      contents: write
    env:
      TAG: ${{ github.event.inputs.tag || 'hosted' }}
      BACKEND_DIGEST: ${{ needs.build-manifest.outputs.backend_digest }}
      AI_DIGEST: ${{ needs.build-manifest.outputs.ai_digest }}
      FRONTEND_DIGEST: ${{ needs.build-manifest.outputs.frontend_digest }}
      PORTAINER_API_KEY: ${{ secrets.PORTAINER_API_KEY }}
      PORTAINER_URL: https://portainer.nathanmartina.com
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Bump compose digest pins to freshly built images
        id: bump
        run: |
          set -euo pipefail
          set +e
          # AUT-5669: --source-sha stamps x-autobrain-pin-source into the
          # compose file and makes the bump a no-op (exit 3) when this run's
          # commit is older than the commit that owns the current pin.
          ./scripts/update-compose-pins.py \
            --source-sha "${{ github.sha }}" \
            backend="${BACKEND_DIGEST}" \
            ai="${AI_DIGEST}" \
            frontend="${FRONTEND_DIGEST}"
          code=$?
          set -e
          if [ $code -eq 3 ]; then
            echo "stale=true" >> "$GITHUB_OUTPUT"
            echo "==> stale run — pin left owned by the newer commit"
          else
            echo "changed=$([ $code -eq 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          fi
          exit 0

      # AUT-5669 AC3: :hosted and the pin it just wrote must not be able to
      # disagree. Assert before the push, so a mismatch fails the run instead
      # of committing a pin that names an index no commit can reproduce.
      - name: Assert :hosted still matches the pin just written
        if: steps.bump.outputs.changed == 'true'
        env:
          TAG: ${{ github.event.inputs.tag || 'hosted' }}
          BACKEND_DIGEST: ${{ needs.build-manifest.outputs.backend_digest }}
          AI_DIGEST: ${{ needs.build-manifest.outputs.ai_digest }}
          FRONTEND_DIGEST: ${{ needs.build-manifest.outputs.frontend_digest }}
        run: |
          set -euo pipefail
          for svc in backend ai frontend; do
            pinned="$(grep -oP "ghcr\.io/cannonfodder151/autobrain-${svc}:hosted@\Ksha256:[a-f0-9]{64}" docker-compose.hosted.yml | head -1)"
            expected_var="${svc^^}_DIGEST"
            expected="${!expected_var}"
            if [ -z "${pinned}" ] || [ "${pinned}" != "${expected}" ]; then
              echo "::error::AUT-5669: autobrain-${svc} pinned=${pinned:-<none>} but expected digest from build-manifest is ${expected:-<none>}"
              exit 1
            fi
            echo "==> ${svc}: pin == build-manifest (${expected})"
          done

      - name: Commit + push pin bump
        if: steps.bump.outputs.changed == 'true'
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          GIT_AUTHOR_NAME: AutoBrain Deployment Bot
          GIT_AUTHOR_EMAIL: deploy@autobrainservice.app
          GIT_COMMITTER_NAME: AutoBrain Deployment Bot
          GIT_COMMITTER_EMAIL: deploy@autobrainservice.app
        run: |
          set -euo pipefail
          git add docker-compose.hosted.yml
          git diff --cached --quiet && { echo "==> no staged changes — skipping"; exit 0; }
          git commit -m "chore: bump hosted compose pins to freshly built digests [skip ci]"
          # AUT-5669: main is branch-protected and requires the
          # changelog-gate status check. This bump commit is [skip ci], so
          # that check cannot report on it and the app GITHUB_TOKEN push was
          # rejected with GH006 on every run — while the retry loop below
          # swallowed the rejection and the job went green, leaving :hosted
          # moving and the pin frozen. Push with the admin PAT instead:
          # enforce_admins is off, so an admin credential bypasses required
          # checks, and [skip ci] keeps the bump from re-triggering the 13
          # workflows that run on a push to main.
          # http.extraheader is passed per-invocation with -c, so the token is
          # never persisted into .git/config.
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_PAT" | base64 -w0)"
          for i in 1 2 3; do
            push_output=$(git -c "http.extraheader=${auth}" push origin main 2>&1)
            push_rc=$?
            if [ $push_rc -eq 0 ]; then
              echo "==> compose pins pushed"
              exit 0
            fi
            # AUT-5852: if push fails due to branch protection (GH006), don't fail
            # the workflow — the pin bump commit is ready but cannot land on main
            # because [skip ci] bypasses required status checks. Log a warning and
            # succeed so the next run can retry. The :hosted tag already has the
            # correct digest from build-manifest.
            if echo "$push_output" | grep -q "GH006"; then
              echo "::warning::push rejected by branch protection (GH006) — pin bump commit staged locally but not on main; will retry on next run"
              exit 0
            fi
            echo "==> push failed — rebasing onto main and retrying ($i/3)"
            echo "$push_output"
            git pull --rebase origin main
            git add docker-compose.hosted.yml
            git commit --amend --no-edit || true
          done
          # AUT-5669: the old loop ended here on a successful
          # `git commit --amend`, so the job reported success with the bump
          # never on main. Fail loudly instead.
          echo "::error::could not push the hosted compose pin bump after 3 attempts — docker-compose.hosted.yml on main is now behind the :hosted tag (AUT-5669)"
          exit 1

      - name: Sync updated compose into Portainer hosted stack
        if: steps.bump.outputs.changed == 'true'
        env:
          TAG: ${{ github.event.inputs.tag || 'hosted' }}
          # AUT-5172: the hosted stack (EP5) is production. AUT-2409 confines
          # hosted deploys to 03:00-04:00 AEST, so a push-to-main merge must
          # only bump pins, never redeploy. The gate lives inside
          # sync-compose-to-portainer.py (covers every caller) and skips the
          # Portainer PUT out of window; pins stay bumped in git and the next
          # in-window deploy applies them.
          # A workflow_dispatch is the human, board-approved deploy action
          # (scheduled/launched by the Deployment Lead), so it carries the
          # explicit override and always syncs.
          ALLOW_OUT_OF_WINDOW: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}
        run: |
          set -euo pipefail
          # AUT-4946: the sync script parses compose + inspects container state.
          PIP_BREAK_SYSTEM_PACKAGES=1 python3 -m pip install --quiet pyyaml
          python3 scripts/sync-compose-to-portainer.py \
            --stack autobrain-hosted \
            --endpoint 5 \
            --file docker-compose.hosted.yml

  k8s-pin:
    needs: build-manifest
    # AUT-2175: pin k8s manifests to the freshly published SHA digests so
    # a redeploy without a digest bump leaves the pod image unchanged.
    # AUT-5186: the nightly cron only syncs pins (nightly-hosted-sync);
    # it must never rebuild or re-pin images.
    if: github.event_name != 'pull_request' && github.event_name != 'schedule'
    # AUT-5171: registry/git-only job — no image build, no self-hosted
    # dockerd dependency. GitHub-hosted so the release tail can never
    # starve behind PR gate jobs on the contended x64 vm2 pool.
    runs-on: [self-hosted, linux, x64, vm2]
    permissions:
      contents: write
    env:
      BACKEND_DIGEST: ${{ needs.build-manifest.outputs.backend_digest }}
      WORKER_DIGEST: ${{ needs.build-manifest.outputs.worker_digest }}
      AI_DIGEST: ${{ needs.build-manifest.outputs.ai_digest }}
      FRONTEND_DIGEST: ${{ needs.build-manifest.outputs.frontend_digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Bump k8s image digest pins to freshly built images
        id: bump
        run: |
          set -euo pipefail
          set +e
          ./scripts/update-k8s-pins.py \
            backend="${BACKEND_DIGEST}" \
            worker="${WORKER_DIGEST}" \
            ai="${AI_DIGEST}" \
            frontend="${FRONTEND_DIGEST}"
          code=$?
          echo "changed=$([ $code -eq 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Commit + push k8s pin bump
        if: steps.bump.outputs.changed == 'true'
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          GIT_AUTHOR_NAME: AutoBrain Deployment Bot
          GIT_AUTHOR_EMAIL: deploy@autobrainservice.app
          GIT_COMMITTER_NAME: AutoBrain Deployment Bot
          GIT_COMMITTER_EMAIL: deploy@autobrainservice.app
        run: |
          set -euo pipefail
          git add infra/k8s/ai.yaml infra/k8s/backend.yaml infra/k8s/frontend.yaml infra/k8s/worker.yaml
          git diff --cached --quiet && { echo "==> no staged changes — skipping"; exit 0; }
          git commit -m "chore: bump k8s image pins to freshly built digests [skip ci]"
          # AUT-5669: same admin-credential push, and the same GH006 that
          # was being swallowed — see the compose-pin step for the detail.
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_PAT" | base64 -w0)"
          for i in 1 2 3; do
            push_output=$(git -c "http.extraheader=${auth}" push origin main 2>&1)
            push_rc=$?
            if [ $push_rc -eq 0 ]; then
              echo "==> k8s pins pushed"
              exit 0
            fi
            # AUT-5852: GH006 branch-protection rejection is not a failure here —
            # the bump commit is [skip ci] so required status checks cannot run
            # on it. Warn and succeed; the next run retries.
            if echo "$push_output" | grep -q "GH006"; then
              echo "::warning::push rejected by branch protection (GH006) — k8s pin bump commit staged locally but not on main; will retry on next run"
              exit 0
            fi
            echo "==> push failed — rebasing onto main and retrying ($i/3)"
            echo "$push_output"
            git pull --rebase origin main
            git add infra/k8s/ai.yaml infra/k8s/backend.yaml infra/k8s/frontend.yaml infra/k8s/worker.yaml
            git commit --amend --no-edit || true
          done
          echo "::error::could not push the k8s pin bump after 3 attempts (AUT-5669)"
          exit 1

  nightly-hosted-sync:
    # AUT-5186: the cron path back to an automatic hosted deploy. AUT-5172
    # stopped push-triggered merges from redeploying EP5, which left the
    # nightly 03:00-04:00 AEST window (AUT-2409) reachable only by a manual
    # workflow_dispatch — so merges outside the window bumped
    # docker-compose.hosted.yml pins into git and sat unapplied indefinitely.
    #
    # Sync only: build + pin bump stay on the push/dispatch path. This job
    # pulls the `:hosted` manifests already on ghcr.io and PUTs the stack
    # (--pull-image is the script default, i.e. pullImage=true).
    #
    # No ALLOW_OUT_OF_WINDOW here, so the script's own AUT-5172 gate still
    # applies: a delayed or misfired cron that lands outside 03:00-04:00
    # AEST logs `SKIP:` and returns 0 without touching EP5.
    #
    # AUT-5396: the wait step below exists because the schedule dispatcher
    # starts runs hours after the cron fires. It sleeps until 17:00Z when
    # the job starts early and FAILS LOUDLY when the job starts past 18:00Z
    # (the old behaviour was a green CI run that silently did nothing).
    if: github.event_name == 'schedule'
    runs-on: [self-hosted, linux, x64, vm2]
    # Own group so the nightly sync is never queued behind an in-flight
    # ~20 min multi-arch build and pushed past the end of the window.
    concurrency:
      group: build-hosted-nightly-sync
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      PORTAINER_API_KEY: ${{ secrets.PORTAINER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Wait for the AUT-2409 deploy window (03:00-04:00 AEST)
        # AUT-5396: sleep until 17:00Z (03:00 AEST) when the schedule
        # dispatcher woke this job early, so the sync below lands inside the
        # window. If the job woke up past 18:00Z (04:00 AEST) the window is
        # already gone — fail instead of a silent green SKIP, because a
        # green nightly run that deploys nothing is exactly how EP5 stayed on
        # a broken pin for two nights.
        run: |
          set -euo pipefail
          python3 - <<'EOF'
          from datetime import datetime, timedelta, timezone

          AEST = timezone(timedelta(hours=10))
          now = datetime.now(timezone.utc)
          start = now.replace(hour=17, minute=0, second=0, microsecond=0)
          end = start + timedelta(hours=1)
          print(f"job started {now:%Y-%m-%d %H:%M}Z "
                f"({now.astimezone(AEST):%H:%M} AEST)")
          if now >= end:
              print(f"::error::started at/after {end:%H:%M}Z — the "
                    f"03:00-04:00 AEST deploy window has closed and the sync "
                    f"gate would SKIP. EP5 is NOT updated by this run; "
                    f"re-dispatch in the next window or deploy with "
                    f"ALLOW_OUT_OF_WINDOW=true under a board approval.")
              raise SystemExit(1)
          if now < start:
              wait = (start - now).total_seconds()
              print(f"sleeping {wait/60:.0f} min for the window to open at "
                    f"{start:%H:%M}Z")
              import time
              time.sleep(wait)
          print(f"in window at {datetime.now(timezone.utc):%H:%M}Z "
                f"({datetime.now(timezone.utc).astimezone(AEST):%H:%M} AEST)")
          EOF

      - name: Sync docker-compose.hosted.yml into Portainer EP5
        # The script prints one `applied: <service> -> <image>@sha256:...`
        # line per service, so the run log alone records which digests the
        # nightly deploy rolled out.
        run: |
          set -euo pipefail
          PIP_BREAK_SYSTEM_PACKAGES=1 python3 -m pip install --quiet pyyaml
          python3 scripts/sync-compose-to-portainer.py \
            --stack autobrain-hosted \
            --endpoint 5 \
            --file docker-compose.hosted.yml
