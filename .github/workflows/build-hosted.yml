name: Build hosted images (multi-arch)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag
        required: true
        default: hosted
      platforms:
        description: Comma-separated platforms
        required: true
        default: linux/amd64,linux/arm64
      api_base_url:
        description: Frontend API base URL
        required: true
        default: https://hosted.autobrainservice.app/api/v1
      ws_base_url:
        description: Frontend WS base URL
        required: true
        default: wss://hosted.autobrainservice.app/ws

jobs:
  auto-bump:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Cut a release if [Unreleased] has content (AUT-240)
        run: |
          set -euo pipefail
          git config user.name "AutoBrain Release Bot"
          git config user.email "release@autobrainservice.app"
          ./scripts/auto-bump.sh
          git push origin main
          echo "==> auto-bump done"

  build:
    needs: auto-bump
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: docker/setup-qemu-action@v3
        if: ${{ github.event.inputs.platforms != 'linux/amd64' }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push images
        env:
          TAG: ${{ github.event.inputs.tag }}
          PLATFORMS: ${{ github.event.inputs.platforms }}
          API_BASE_URL: ${{ github.event.inputs.api_base_url }}
          WS_BASE_URL: ${{ github.event.inputs.ws_base_url }}
        run: |
          set -euo pipefail
          for svc in backend ai frontend market-data; do
            case "$svc" in
              backend)  ctx=.;        df=docker/backend/Dockerfile;   args="";;
              ai)       ctx=./ai;     df=docker/ai/Dockerfile;         args="";;
              frontend) ctx=.;        df=docker/frontend/Dockerfile;   args="--build-arg API_BASE_URL=${API_BASE_URL} --build-arg WS_BASE_URL=${WS_BASE_URL}";;
              market-data) ctx=./market-data; df=market-data/Dockerfile; args="";;
            esac
            echo "==> building autobrain-${svc}:${TAG} for ${PLATFORMS}"
            docker buildx build --platform "${PLATFORMS}" --push \
              -t "ghcr.io/cannonfodder151/autobrain-${svc}:${TAG}" \
              ${args} -f "${df}" "${ctx}"
          done
