name: Build hosted images (multi-arch)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag
        required: true
        default: hosted
      api_base_url:
        description: Frontend API base URL
        required: true
        default: https://hosted.autobrainservice.app/api/v1
      ws_base_url:
        description: Frontend WS base URL
        required: true
        default: wss://hosted.autobrainservice.app/ws

concurrency:
  group: build-hosted-${{ github.ref }}
  cancel-in-progress: false

jobs:
  changelog-gate:
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require changelog iteration on docker changes (AUT-168)
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            if [ "${{ github.actor }}" = "dependabot[bot]" ]; then
              echo "dependabot PR — skipping changelog gate"
              exit 0
            fi
            BASE="${{ github.event.pull_request.base.sha }}"
            if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
              echo "no usable base SHA — skipping changelog gate"
              exit 0
            fi
            MB="$(git merge-base "$BASE" "$GITHUB_SHA")"
            if [ -z "$MB" ]; then
              echo "no merge-base with base SHA — skipping changelog gate"
              exit 0
            fi
            CHANGED="$(git diff --name-only "$MB" "$GITHUB_SHA")"
          elif [ "${{ github.event_name }}" = "push" ]; then
            BEFORE="$(git rev-parse "${{ github.event.before }}" 2>/dev/null || echo '')"
            if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
              echo "no usable before SHA — skipping changelog gate"
              exit 0
            fi
            CHANGED="$(git diff --name-only "$BEFORE" "$GITHUB_SHA")"
          else
            echo "changelog gate skipped (AUT-451)"
            exit 0
          fi
          APP_CHANGED="$(printf '%s\n' "$CHANGED" | grep -E '^(backend/|ai/|frontend/|docker/|docker-compose)' || true)"
          if [ -n "$APP_CHANGED" ] && ! printf '%s\n' "$CHANGED" | grep -qx 'CHANGELOG.md'; then
            echo "::error::App/docker files changed but CHANGELOG.md was not updated. Add an entry under [Unreleased] (see CONTRIBUTING.md) before merging."
            exit 1
          fi
          echo "changelog gate OK — CHANGELOG.md iterated with app/docker changes"

  auto-bump:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, x64, vm2]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Cut a release if [Unreleased] has content (AUT-240)
        run: |
          set -euo pipefail
          git config user.name "AutoBrain Release Bot"
          git config user.email "release@autobrainservice.app"
          ./scripts/auto-bump.sh
          if ! git diff --quiet origin/main --; then
            for i in 1 2 3; do
              git push origin main && break
              echo "==> push raced with main updates — rebasing and retrying (attempt $i/3)"
              git pull --rebase origin main
            done
          else
            echo "==> nothing to bump — no push needed"
          fi
          echo "==> auto-bump done"

  build:
    needs: auto-bump
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runs_on: [self-hosted, linux, x64, vm2]
          - arch: arm64
            runs_on: [self-hosted, linux, ARM64]
    runs-on: ${{ matrix.runs_on }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT || secrets.GITHUB_TOKEN }}

      - name: Verify runner arch (${{ matrix.arch }})
        run: |
          set -euo pipefail
          want="${{ matrix.arch }}"
          got="$(uname -m)"
          case "$want" in
            amd64) norm="x86_64";;
            arm64) norm="aarch64";;
            *) echo "::error::unknown matrix arch $want"; exit 2;;
          esac
          if [ "$got" != "$norm" ]; then
            echo "::error::runner arch mismatch: want $want (=$norm), got $got"
            exit 1
          fi
          echo "==> runner arch OK: $got ($want)"

      - name: Build and push images (linux/${{ matrix.arch }})
        env:
          TAG: ${{ github.event.inputs.tag || 'hosted' }}
          ARCH: ${{ matrix.arch }}
          API_BASE_URL: ${{ github.event.inputs.api_base_url || 'https://hosted.autobrainservice.app/api/v1' }}
          WS_BASE_URL: ${{ github.event.inputs.ws_base_url || 'wss://hosted.autobrainservice.app/ws' }}
          CACHE_FROM: ${{ matrix.arch == 'arm64' && '' || format('type=gha,scope=build-hosted-{0}', matrix.arch) }}
          CACHE_TO: ${{ format('type=gha,scope=build-hosted-{0},mode=max', matrix.arch) }}
        run: |
          set -euo pipefail
          for svc in backend worker ai frontend; do
            case "$svc" in
              backend)  ctx=.;        df=docker/backend/Dockerfile;   args="";;
              worker)   ctx=.;        df=docker/worker/Dockerfile;     args="";;
              ai)       ctx=.;        df=docker/ai/Dockerfile;         args="";;
              frontend) ctx=.;        df=docker/frontend/Dockerfile;   args="--build-arg API_BASE_URL=${API_BASE_URL} --build-arg WS_BASE_URL=${WS_BASE_URL}";;
            esac
            echo "==> building autobrain-${svc}:${TAG}-${ARCH} for linux/${ARCH}"
            cache_from_args=()
            if [ -n "${CACHE_FROM}" ]; then
              cache_from_args=(--cache-from "${CACHE_FROM}")
            fi
            docker buildx build --platform linux/${ARCH} --push \
              "${cache_from_args[@]}" \
              --cache-to   "${CACHE_TO}" \
              -t "ghcr.io/cannonfodder151/autobrain-${svc}:${TAG}-${ARCH}" \
              ${args} -f "${df}" "${ctx}"
          done

      - name: Verify pushed image arch (${{ matrix.arch }})
        env:
          TAG: ${{ github.event.inputs.tag || 'hosted' }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          norm=""
          case "$ARCH" in
            amd64) norm="x86_64";;
            arm64) norm="aarch64";;
            *) echo "::error::unknown arch $ARCH"; exit 2;;
          esac
          for svc in backend worker ai frontend; do
            img="ghcr.io/cannonfodder151/autobrain-${svc}:${TAG}-${ARCH}"
            echo "==> verifying $img"
            got="$(docker run --rm --platform linux/${ARCH} "$img" uname -m)"
            if [ "$got" != "$norm" ]; then
              echo "::error::$img reports arch=$got, expected $norm — refusing to assemble manifest"
              exit 1
            fi
            docker run --rm --platform linux/${ARCH} "$img" /bin/sh -c 'true'
          done
          echo "==> all ${ARCH} images verified"

  build-manifest:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: [self-hosted, linux, x64, vm2]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT || secrets.GITHUB_TOKEN }}

      - name: Gate manifest assembly on per-arch verification
        env:
          TAG: ${{ github.event.inputs.tag || 'hosted' }}
        run: |
          set -euo pipefail
          for svc in backend worker ai frontend; do
            for arch in amd64 arm64; do
              img="ghcr.io/cannonfodder151/autobrain-${svc}:${TAG}-${arch}"
              if ! docker buildx imagetools inspect "$img" >/dev/null 2>&1; then
                echo "::error::$img missing — per-arch build for $arch did not publish. Aborting manifest assembly."
                exit 1
              fi
            done
          done

      - name: Assemble multi-arch manifests
        id: digest
        env:
          TAG: ${{ github.event.inputs.tag || 'hosted' }}
          SHA_TAG: hosted-sha-${{ github.sha }}
        run: |
          set -euo pipefail
          for svc in backend worker ai frontend; do
            echo "==> manifest autobrain-${svc}:${TAG}"
            docker buildx imagetools create \
              -t "ghcr.io/cannonfodder151/autobrain-${svc}:${TAG}" \
              -t "ghcr.io/cannonfodder151/autobrain-${svc}:${SHA_TAG}" \
              "ghcr.io/cannonfodder151/autobrain-${svc}:${TAG}-amd64" \
              "ghcr.io/cannonfodder151/autobrain-${svc}:${TAG}-arm64"
          done

          for svc in backend worker ai frontend; do
            d="$(docker buildx imagetools inspect "ghcr.io/cannonfodder151/autobrain-${svc}:${TAG}" --raw | head -n1)"
            echo "${svc}_digest=${d}" >> "$GITHUB_OUTPUT"
          done
