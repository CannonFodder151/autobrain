name: Build hosted images (multi-arch)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag
        required: true
        default: hosted
      api_base_url:
        description: Frontend API base URL
        required: true
        default: https://hosted.autobrainservice.app/api/v1
      ws_base_url:
        description: Frontend WS base URL
        required: true
        default: wss://hosted.autobrainservice.app/ws

# Only one pipeline per ref at a time, but do NOT cancel an in-flight build.
# The multi-arch release build takes ~20 min; a newer push to main (PR merge or
# auto-bump) arriving mid-build would otherwise cancel it and leave main with no
# :hosted image (AUT-1756, root cause AUT-1762). Queue the newer run behind the
# in-flight one so every push to main still produces a published manifest. The
# auto-bump commit is tagged [skip ci] (scripts/auto-bump.sh) so it never
# re-triggers this workflow and the in-flight build is never cancelled by its
# own version cut.
concurrency:
  group: build-hosted-${{ github.ref }}
  cancel-in-progress: false

jobs:
  auto-bump:
    # x64 jobs run on the new vm2 runner (gh-runner-autobrain-2). The legacy
    # x64 runner (gh-runner-autobrain) is currently degraded (AUT-1781); routing
    # on `vm2` guarantees dispatch to the healthy new runner. Re-balance across
    # legacy+new again by dropping `vm2` once AUT-1781 is repaired. ARM builds
    # stay pinned to the Oracle VM arm64 runner below.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, x64, vm2]
    permissions:
      contents: write
    steps:
      # Use actions/checkout so the GITHUB_TOKEN is persisted by the
      # credential helper (the manual git init did not authenticate pushes,
      # crashing the auto-bump and blocking multi-arch arm64 image builds —
      # AUT-1114).
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Cut a release if [Unreleased] has content (AUT-240)
        run: |
          set -euo pipefail
          git config user.name "AutoBrain Release Bot"
          git config user.email "release@autobrainservice.app"
          ./scripts/auto-bump.sh
          # Only push when auto-bump actually committed a release cut; an
          # empty push fails on the credential helper and blocks the build
          # (AUT-1114).
          if ! git diff --quiet origin/main --; then
            for i in 1 2 3; do
              git push origin main && break
              echo "==> push raced with main updates — rebasing and retrying (attempt $i/3)"
              git pull --rebase origin main
            done
          else
            echo "==> nothing to bump — no push needed"
          fi
          echo "==> auto-bump done"

  build:
    needs: auto-bump
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runs_on: [self-hosted, linux, x64, vm2]
          # arm64 builds stay on the Oracle VM arm64 runner (gh-runner-autobrain-arm64).
          - arch: arm64
            runs_on: [self-hosted, linux, ARM64]
    runs-on: ${{ matrix.runs_on }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT || secrets.GITHUB_TOKEN }}

      - name: Verify runner arch (${{ matrix.arch }})
        # AUT-2097: catch a qemu-user-x86_64 shim on the arm64 runner before any
        # build runs. If the runner claims ARM64 but uname reports x86_64, every
        # image it produces is contaminated regardless of --platform.
        run: |
          set -euo pipefail
          want="${{ matrix.arch }}"
          got="$(uname -m)"
          case "$want" in
            amd64) norm="x86_64";;
            arm64) norm="aarch64";;
            *) echo "::error::unknown matrix arch $want"; exit 2;;
          esac
          if [ "$got" != "$norm" ]; then
            echo "::error::runner arch mismatch: want $want (=$norm), got $got"
            exit 1
          fi
          echo "==> runner arch OK: $got ($want)"

      - name: Build and push images (linux/${{ matrix.arch }})
        env:
          TAG: ${{ github.event.inputs.tag || 'hosted' }}
          ARCH: ${{ matrix.arch }}
          API_BASE_URL: ${{ github.event.inputs.api_base_url || 'https://hosted.autobrainservice.app/api/v1' }}
          WS_BASE_URL: ${{ github.event.inputs.ws_base_url || 'wss://hosted.autobrainservice.app/ws' }}
          # AUT-2220: CARTO basemap key (public-by-design).
          CARTO_API_KEY: ${{ secrets.CARTO_API_KEY || '' }}
          # AUT-2097: scope GHA buildx cache per-arch so the arm64 build cannot
          # pull amd64 layer blobs from the x64 cache namespace (cache poisoning
          # produced OCI manifests that declared arm64 but shipped amd64 layers,
          # crashing on the Oracle VM with exec format error).
          CACHE_FROM: ${{ matrix.arch == 'arm64' && '' || format('type=gha,scope=build-hosted-{0}', matrix.arch) }}
          CACHE_TO: ${{ format('type=gha,scope=build-hosted-{0},mode=max', matrix.arch) }}
        run: |
          set -euo pipefail
          for svc in backend worker ai frontend; do
            case "$svc" in
              backend)  ctx=.;        df=docker/backend/Dockerfile;   args="";;
              worker)   ctx=.;        df=docker/worker/Dockerfile;     args="";;
              ai)       ctx=.;        df=docker/ai/Dockerfile;         args="";;
              frontend) ctx=.;        df=docker/frontend/Dockerfile;   args="--build-arg API_BASE_URL=${API_BASE_URL} --build-arg WS_BASE_URL=${WS_BASE_URL} --build-arg CARTO_API_KEY=${CARTO_API_KEY}";;
            esac
            echo "==> building autobrain-${svc}:${TAG}-${ARCH} for linux/${ARCH}"
            # shellcheck disable=SC2086
            cache_from_args=()
            if [ -n "${CACHE_FROM}" ]; then
              cache_from_args=(--cache-from "${CACHE_FROM}")
            fi
            docker buildx build --platform linux/${ARCH} --push \
              "${cache_from_args[@]}" \
              --cache-to   "${CACHE_TO}" \
              -t "ghcr.io/cannonfodder151/autobrain-${svc}:${TAG}-${ARCH}" \
              ${args} -f "${df}" "${ctx}"
          done

      - name: Verify pushed image arch (${{ matrix.arch }})
        # AUT-2097: post-build smoke test. Pulls each freshly-pushed :hosted-ARCH
        # image and runs `uname -m` inside it. If BuildKit served amd64 layers
        # under an arm64 manifest, this step fails the job before manifest
        # assembly promotes the bad digest to the :hosted multi-arch tag.
        env:
          TAG: ${{ github.event.inputs.tag || 'hosted' }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          norm=""
          case "$ARCH" in
            amd64) norm="x86_64";;
            arm64) norm="aarch64";;
            *) echo "::error::unknown arch $ARCH"; exit 2;;
          esac
          for svc in backend worker ai frontend; do
            img="ghcr.io/cannonfodder151/autobrain-${svc}:${TAG}-${ARCH}"
            echo "==> verifying $img"
            got="$(docker run --rm --platform linux/${ARCH} "$img" uname -m)"
            if [ "$got" != "$norm" ]; then
              echo "::error::$img reports arch=$got, expected $norm — refusing to assemble manifest"
              exit 1
            fi
            # /bin/sh -c true catches the exec format error case directly.
            docker run --rm --platform linux/${ARCH} "$img" /bin/sh -c 'true'
          done
          echo "==> all ${ARCH} images verified"

  build-manifest:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: [self-hosted, linux, x64, vm2]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT || secrets.GITHUB_TOKEN }}

      # AUT-2097: refuse to assemble the multi-arch :hosted manifest if either
      # arch side failed its post-build verification. Without this gate, a
      # failing build job would still let imagetools promote amd64 into both
      # slots of the arm64-bearing :hosted index.
      - name: Gate manifest assembly on per-arch verification
        env:
          TAG: ${{ github.event.inputs.tag || 'hosted' }}
        run: |
          set -euo pipefail
          for svc in backend worker ai frontend; do
            for arch in amd64 arm64; do
              img="ghcr.io/cannonfodder151/autobrain-${svc}:${TAG}-${arch}"
              if ! docker buildx imagetools inspect "$img" >/dev/null 2>&1; then
                echo "::error::$img missing — per-arch build for $arch did not publish. Aborting manifest assembly."
                exit 1
              fi
            done
          done

      - name: Assemble multi-arch manifests
        id: digest
        env:
          TAG: ${{ github.event.inputs.tag || 'hosted' }}
          SHA_TAG: hosted-sha-${{ github.sha }}
        run: |
          set -euo pipefail
          for svc in backend worker ai frontend; do
            echo "==> manifest autobrain-${svc}:${TAG}"
            # AUT-1533/F4: every build also publishes an immutable per-commit
            # tag so prod/dev can pin distinct digests instead of drifting on
            # the same floating :hosted ref.
            docker buildx imagetools create \
              -t "ghcr.io/cannonfodder151/autobrain-${svc}:${TAG}" \
              -t "ghcr.io/cannonfodder151/autobrain-${svc}:${SHA_TAG}" \
              "ghcr.io/cannonfodder151/autobrain-${svc}:${TAG}-amd64" \
              "ghcr.io/cannonfodder151/autobrain-${svc}:${TAG}-arm64"
          done

          # AUT-1881: capture every multi-arch manifest digest so downstream
          # compose-pin updates and the PR-time pin-guard have a stable ref.
          # The digest below is the content-addressed digest of the
          # :TAG multi-arch manifest list (Docker-Content-Digest). Pinned compose
          # references use <image>:<tag>@<digest> — see docker-compose.hosted.yml.
          for svc in backend worker ai frontend; do
            d="$(docker buildx imagetools inspect "ghcr.io/cannonfodder151/autobrain-${svc}:${TAG}" --raw | head -n1)"
            echo "${svc}_digest=${d}" >> "$GITHUB_OUTPUT"
          done
