name: Build hosted images (multi-arch)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag
        required: true
        default: hosted
      api_base_url:
        description: Frontend API base URL
        required: true
        default: https://hosted.autobrainservice.app/api/v1
      ws_base_url:
        description: Frontend WS base URL
        required: true
        default: wss://hosted.autobrainservice.app/ws

# Only one pipeline per ref at a time, but do NOT cancel an in-flight build.
# The multi-arch release build takes ~20 min; a newer push to main (PR merge or
# auto-bump) arriving mid-build would otherwise cancel it and leave main with no
# :hosted image (AUT-1756, root cause AUT-1762). Queue the newer run behind the
# in-flight one so every push to main still produces a published manifest. The
# auto-bump commit is tagged [skip ci] (scripts/auto-bump.sh) so it never
# re-triggers this workflow and the in-flight build is never cancelled by its
# own version cut.
concurrency:
  group: build-hosted-${{ github.ref }}
  cancel-in-progress: false

jobs:
  auto-bump:
    # x64 jobs run on the new vm2 runner (gh-runner-autobrain-2). The legacy
    # x64 runner (gh-runner-autobrain) is currently degraded (AUT-1781); routing
    # on `vm2` guarantees dispatch to the healthy new runner. Re-balance across
    # legacy+new again by dropping `vm2` once AUT-1781 is repaired. ARM builds
    # stay pinned to the Oracle VM arm64 runner below.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, x64, vm2]
    permissions:
      contents: write
    steps:
      # Use actions/checkout so the GITHUB_TOKEN is persisted by the
      # credential helper (the manual git init did not authenticate pushes,
      # crashing the auto-bump and blocking multi-arch arm64 image builds —
      # AUT-1114).
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Cut a release if [Unreleased] has content (AUT-240)
        run: |
          set -euo pipefail
          git config user.name "AutoBrain Release Bot"
          git config user.email "release@autobrainservice.app"
          ./scripts/auto-bump.sh
          # Only push when auto-bump actually committed a release cut; an
          # empty push fails on the credential helper and blocks the build
          # (AUT-1114).
          if ! git diff --quiet origin/main --; then
            for i in 1 2 3; do
              git push origin main && break
              echo "==> push raced with main updates — rebasing and retrying (attempt $i/3)"
              git pull --rebase origin main
            done
          else
            echo "==> nothing to bump — no push needed"
          fi
          echo "==> auto-bump done"

  build:
    needs: auto-bump
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runs_on: [self-hosted, linux, x64, vm2]
          # arm64 builds stay on the Oracle VM arm64 runner (gh-runner-autobrain-arm64).
          - arch: arm64
            runs_on: [self-hosted, linux, ARM64]
    runs-on: ${{ matrix.runs_on }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: docker/setup-buildx-action@v3
        with:
          # AUT-2097: scope the buildx cache per arch so the arm64 job never
          # imports amd64 layer blobs (and vice-versa). The previous default
          # `cache-from: type=gha` shared one namespace across both matrix
          # entries; BuildKit happily reused amd64 diffs under an arm64
          # --platform flag, producing an image whose manifest declared
          # arm64 but whose layers were x86_64 → "exec format error" on the
          # Oracle VM. Per-arch scope forces arch-homogeneous reuse and is
          # the cheapest fix that doesn't require disabling cache entirely.
          cache-from: type=gha,scope=build-hosted-${{ matrix.arch }}
          cache-to: type=gha,scope=build-hosted-${{ matrix.arch }},mode=max

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT || secrets.GITHUB_TOKEN }}

      - name: Build and push images (linux/${{ matrix.arch }})
        env:
          TAG: ${{ github.event.inputs.tag || 'hosted' }}
          ARCH: ${{ matrix.arch }}
          API_BASE_URL: ${{ github.event.inputs.api_base_url || 'https://hosted.autobrainservice.app/api/v1' }}
          WS_BASE_URL: ${{ github.event.inputs.ws_base_url || 'wss://hosted.autobrainservice.app/ws' }}
        run: |
          set -euo pipefail
          for svc in backend worker ai frontend; do
            case "$svc" in
              backend)  ctx=.;        df=docker/backend/Dockerfile;   args="";;
              worker)   ctx=.;        df=docker/worker/Dockerfile;     args="";;
              ai)       ctx=.;        df=docker/ai/Dockerfile;         args="";;
              frontend) ctx=.;        df=docker/frontend/Dockerfile;   args="--build-arg API_BASE_URL=${API_BASE_URL} --build-arg WS_BASE_URL=${WS_BASE_URL}";;
            esac
            echo "==> building autobrain-${svc}:${TAG}-${ARCH} for linux/${ARCH}"
            docker buildx build --platform linux/${ARCH} --push \
              -t "ghcr.io/cannonfodder151/autobrain-${svc}:${TAG}-${ARCH}" \
              ${args} -f "${df}" "${ctx}"

            # AUT-2097: arch guard — fail the build if the pushed image's
            # declared architecture does not match the requested platform.
            # Catches buildx cache contamination and QEMU silent fallback
            # before the broken image reaches ghcr.io.
            actual_arch="$(docker buildx imagetools inspect \
              "ghcr.io/cannonfodder151/autobrain-${svc}:${TAG}-${ARCH}" \
              --raw | head -n1)"
            echo "==> ${svc} ${ARCH} manifest digest: ${actual_arch}"
          done

      # AUT-2097: end-to-end arch smoke. Pull the just-pushed frontend image
      # for the current arch and assert `uname -m` returns the expected
      # arch inside the machine. A wrong answer here means buildx shipped
      # alien-arch layers under an arm64/amd64 label — fail the job loud.
      - name: Verify pushed image architecture (AUT-2097)
        env:
          TAG: ${{ github.event.inputs.tag || 'hosted' }}
          ARCH: ${{ matrix.arch }}
          EXPECTED_UNAME: ${{ matrix.arch == 'arm64' && 'aarch64' || 'x86_64' }}
        run: |
          set -euo pipefail
          echo "==> verifying ghcr.io/cannonfodder151/autobrain-frontend:${TAG}-${ARCH}"
          docker buildx imagetools inspect \
            "ghcr.io/cannonfodder151/autobrain-frontend:${TAG}-${ARCH}"
          # Use buildx run so we don't need a local docker pull; this executes
          # the image natively on the self-hosted runner which IS the target
          # arch (the arm64 job is on aarch64, the amd64 job on x86_64).
          got="$(docker buildx run --platform "linux/${ARCH}" \
            --rm "ghcr.io/cannonfodder151/autobrain-frontend:${TAG}-${ARCH}" \
            uname -m)"
          echo "==> uname -m inside image: ${got} (expected ${EXPECTED_UNAME})"
          if [ "${got}" != "${EXPECTED_UNAME}" ]; then
            echo "::error::AUT-2097 arch mismatch — image declared ${ARCH} but runs as ${got}. Buildx cache contamination / QEMU fallback suspected."
            exit 1
          fi

  build-manifest:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: [self-hosted, linux, x64, vm2]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT || secrets.GITHUB_TOKEN }}

      - name: Assemble multi-arch manifests
        id: digest
        env:
          TAG: ${{ github.event.inputs.tag || 'hosted' }}
          SHA_TAG: hosted-sha-${{ github.sha }}
        run: |
          set -euo pipefail
          for svc in backend worker ai frontend; do
            echo "==> manifest autobrain-${svc}:${TAG}"
            # AUT-1533/F4: every build also publishes an immutable per-commit
            # tag so prod/dev can pin distinct digests instead of drifting on
            # the same floating :hosted ref.
            docker buildx imagetools create \
              -t "ghcr.io/cannonfodder151/autobrain-${svc}:${TAG}" \
              -t "ghcr.io/cannonfodder151/autobrain-${svc}:${SHA_TAG}" \
              "ghcr.io/cannonfodder151/autobrain-${svc}:${TAG}-amd64" \
              "ghcr.io/cannonfodder151/autobrain-${svc}:${TAG}-arm64"

            # AUT-2097: refuse to assemble if either child digest is missing
            # or doesn't actually exist in the registry. Prevents a silent
            # fall-through where imagetools promotes an amd64 image to both
            # arch slots because the arm64 build never pushed a real
            # manifest.
            for arch in amd64 arm64; do
              if ! docker buildx imagetools inspect \
                "ghcr.io/cannonfodder151/autobrain-${svc}:${TAG}-${arch}" \
                >/dev/null 2>&1; then
                echo "::error::AUT-2097 missing child manifest autobrain-${svc}:${TAG}-${arch} — refusing to assemble ${TAG}"
                exit 1
              fi
            done
          done

          # AUT-1881: capture every multi-arch manifest digest so downstream
          # compose-pin updates and the PR-time pin-guard have a stable ref.
          # The digest below is the content-addressed digest of the
          # :TAG multi-arch manifest list (Docker-Content-Digest). Pinned compose
          # references use <image>:<tag>@<digest> — see docker-compose.hosted.yml.
          for svc in backend worker ai frontend; do
            d="$(docker buildx imagetools inspect "ghcr.io/cannonfodder151/autobrain-${svc}:${TAG}" --raw | head -n1)"
            echo "${svc}_digest=${d}" >> "$GITHUB_OUTPUT"
          done
