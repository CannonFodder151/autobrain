name: CI Triage Webhook

# Fires the CI Triage routine ~15 minutes after a push so the agent can
# review the freshly settled workflow runs for failures (AUT-557).
# The routine's execution issue is created by the Paperclip control plane
# when the webhook fires; nothing in this job needs write access.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Latest push per branch wins: bounds runner cost (no parallel `sleep 900`
# waits) and webhook/routine spam. Safe to cancel: the triage agent inspects
# the final run state, not the in-flight wait.
concurrency:
  group: ci-triage-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  fire:
    # Runs on GitHub-hosted ubuntu-latest: the job is pure sleep+curl+jq,
    # arch-independent, and must NEVER consume a scarce self-hosted release
    # runner (AUT-1762). Previously it hogged x64, then arm64, for 15 min
    # bursts, starving dockerhub-publish/build-hosted. ubuntu-latest frees both
    # self-hosted runners for real build work. The repo-level concurrency group
    # above still cancels a prior in-flight wait on a newer push.
    runs-on: ubuntu-latest
    # 15 min settle + bounded webhook attempts (~2.5 min worst case)
    # + Discord alert must fit inside the ceiling. The old 20 min
    # budget left ~5 min for up to 6 *unbounded* curl attempts, so a
    # 15 min settle + a single bounded webhook attempt (100s,
    # AUT-5694) must fit inside the ceiling. The old 20 min
    # budget left ~5 min for up to 6 *unbounded* curl attempts, so a
    # hung control-plane response ate the whole job and GitHub killed
    # it as `cancelled` — silently losing the triage wake (AUT-5668).
    timeout-minutes: 30
    steps:
      - name: Wait for runs to settle
        run: sleep 900

      - name: Fire CI triage webhook
        shell: bash
        env:
          CI_TRIAGE_WEBHOOK_URL: ${{ secrets.CI_TRIAGE_WEBHOOK_URL }}
          CI_TRIAGE_WEBHOOK_SECRET: ${{ secrets.CI_TRIAGE_WEBHOOK_SECRET }}
          DISCORD_REPORT_WEBHOOK: ${{ secrets.DISCORD_REPORT_WEBHOOK }}
        run: |
          set -euo pipefail
          payload=$(jq -n --arg repo "$GITHUB_REPOSITORY" --arg ref "$GITHUB_REF" '{event:"push",repo:$repo,ref:$ref}')

          echo "Firing CI triage webhook to $CI_TRIAGE_WEBHOOK_URL"
          # AUT-5694: the receiver is Paperclip's public routine
          # trigger ("CI Triage" routine), which accepts the
          # POST and returns 202 with the routine run. Under
          # the control-plane degradation (AUT-5567) Paperclip
          # accepted the POST 30-51s after send, so --max-time
          # 30 gave up seconds before the 202 arrived and the
          # job read as `failure` while the wake had in fact
          # landed. Evidence, run 37268628848: curl gave up
          # 05:55:03.27Z, Paperclip recorded the delivery at
          # 05:55:04.54Z and created the routine run at
          # 05:55:15.29Z. All four attempts fired the routine
          # (05:53:18Z, 05:53:58Z, 05:54:49Z, 05:55:15Z)
          # and every one was coalesced.
          #
          # No --retry. Every attempt above returned HTTP 000
          # to curl yet still landed, so a retry is never
          # safe — not even on a timeout (AUT-5567 rule 3).
          # Idempotency-Key makes an accidental re-fire return
          # the original run instead of creating a second
          # triage issue, and the routine coalesces anyway.
          response=$(curl -sS \
            --connect-timeout 15 --max-time 100 \
            -w "\nHTTP_CODE:%{http_code}" \
            -X POST "$CI_TRIAGE_WEBHOOK_URL" \
            -H "Authorization: Bearer $CI_TRIAGE_WEBHOOK_SECRET" \
            -H "Content-Type: application/json" \
            -H "Idempotency-Key: ci-triage-${GITHUB_RUN_ID}" \
            -d "$payload") || true

          http_code=$(echo "$response" | grep -E '^HTTP_CODE:' | cut -d: -f2)
          body=$(echo "$response" | sed '/^HTTP_CODE:/d')

          if [[ "$http_code" -ge 200 && "$http_code" -lt 300 ]]; then
            echo "✅ CI triage webhook fired successfully (HTTP $http_code)"
            exit 0
          fi

          # 409 = this exact delivery was already replayed, so the
          # routine already has this run. Delivered.
          if [[ "$http_code" == "409" ]]; then
            echo "✅ CI triage webhook already delivered (HTTP 409 replay)"
            exit 0
          fi

          # AUT-5567: openresty returns 504 at its 90s ceiling but
          # the write may have committed after the proxy gave up.
          # Never re-POST a 504 — that is how four routine runs were
          # fired for one delivery above. Warn, then treat as sent.
          if [[ "$http_code" == "504" ]]; then
            echo "::warning::CI triage webhook hit the 90s proxy ceiling (HTTP 504); per AUT-5567 the delivery may have committed — not retrying"
            exit 0
          fi

          # Loud failure: a lost triage wake must read as `failure`
          # with an annotation, not as `cancelled` (AUT-5668).
          echo "::error::CI triage webhook undeliverable (HTTP ${http_code:-none}): ${body:-<empty response>}"
          if [[ -n "${DISCORD_REPORT_WEBHOOK:-}" ]]; then
            discord_payload=$(jq -n \
              --arg title "CI Triage Webhook Failed" \
              --arg desc "Webhook returned HTTP ${http_code:-none} after retries. CI Triage Agent may not be woken.\nRepo: $GITHUB_REPOSITORY\nRef: $GITHUB_REF" \
              --arg color "0xFEE75C" \
              --arg author "CI Triage" \
              --arg channel "incidents" \
              '{channel:$channel,title:$title,description:$desc,color:$color,author:$author}')
            curl -sS --max-time 20 -X POST "$DISCORD_REPORT_WEBHOOK" \
              -H "Content-Type: application/json" \
              -d "$discord_payload" || echo "Discord notification also failed"
          fi
          exit 1
