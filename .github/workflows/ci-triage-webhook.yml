name: CI Triage Webhook

# Fires the CI Triage routine ~15 minutes after a push so the agent can
# review the freshly settled workflow runs for failures (AUT-557).
# The routine's execution issue is created by the Paperclip control plane
# when the webhook fires; nothing in this job needs write access.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Latest push per branch wins: bounds runner cost (no parallel `sleep 900`
# waits) and webhook/routine spam. Safe to cancel: the triage agent inspects
# the final run state, not the in-flight wait.
concurrency:
  group: ci-triage-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  fire:
    # Runs on GitHub-hosted ubuntu-latest: the job is pure sleep+curl+jq,
    # arch-independent, and must NEVER consume a scarce self-hosted release
    # runner (AUT-1762). Previously it hogged x64, then arm64, for 15 min
    # bursts, starving dockerhub-publish/build-hosted. ubuntu-latest frees both
    # self-hosted runners for real build work. The repo-level concurrency group
    # above still cancels a prior in-flight wait on a newer push.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Wait for runs to settle
        run: sleep 900

      - name: Fire CI triage webhook
        shell: bash
        env:
          CI_TRIAGE_WEBHOOK_URL: ${{ secrets.CI_TRIAGE_WEBHOOK_URL }}
          CI_TRIAGE_WEBHOOK_SECRET: ${{ secrets.CI_TRIAGE_WEBHOOK_SECRET }}
          DISCORD_REPORT_WEBHOOK: ${{ secrets.DISCORD_REPORT_WEBHOOK }}
        run: |
          set -euo pipefail
          payload=$(jq -n --arg repo "$GITHUB_REPOSITORY" --arg ref "$GITHUB_REF" '{event:"push",repo:$repo,ref:$ref}')

          echo "Firing CI triage webhook to $CI_TRIAGE_WEBHOOK_URL"
          response=$(curl -sS --retry 5 --retry-delay 30 --retry-all-errors --connect-timeout 15 \
            -w "\nHTTP_CODE:%{http_code}" \
            -X POST "$CI_TRIAGE_WEBHOOK_URL" \
            -H "Authorization: Bearer $CI_TRIAGE_WEBHOOK_SECRET" \
            -H "Content-Type: application/json" \
            -d "$payload") || true

          http_code=$(echo "$response" | grep -E '^HTTP_CODE:' | cut -d: -f2)
          body=$(echo "$response" | sed '/^HTTP_CODE:/d')

          if [[ "$http_code" -ge 200 && "$http_code" -lt 300 ]]; then
            echo "✅ CI triage webhook fired successfully (HTTP $http_code)"
            exit 0
          fi

          echo "⚠️ CI triage webhook failed with HTTP $http_code: $body"
          if [[ -n "${DISCORD_REPORT_WEBHOOK:-}" ]]; then
            discord_payload=$(jq -n \
              --arg title "CI Triage Webhook Failed" \
              --arg desc "Webhook returned HTTP $http_code after retries. CI Triage Agent may not be woken.\nRepo: $GITHUB_REPOSITORY\nRef: $GITHUB_REF" \
              --arg color "0xFEE75C" \
              --arg author "CI Triage" \
              --arg channel "incidents" \
              '{channel:$channel,title:$title,description:$desc,color:$color,author:$author}')
            curl -sS -X POST "$DISCORD_REPORT_WEBHOOK" \
              -H "Content-Type: application/json" \
              -d "$discord_payload" || echo "Discord notification also failed"
          fi
          # Don't fail the workflow - the webhook is unreliable but we don't want red runs
          exit 0
