name: build-backend-arm64-only

# AUT-2506 / AUT-2382 follow-up: rebuild only autobrain-backend for arm64
# and push as :hosted-arm64. The full build-hosted.yml is blocked because the
# frontend arm64 SUID step (AUT-2258) fails on the arm64 Playwright build.
# Backend is a pure Python image (no Playwright) so it builds cleanly on qemu
# arm64 on the GitHub-hosted ubuntu-latest runner.
#
# Trigger: workflow_dispatch (manual). Once this push completes, Portainer stack
# 83 redeploy with pullImage:true will pick up the new :hosted-arm64 digest.
#
# Safety: NOT a permanent workflow. Will be deleted after AUT-2506 resolves.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: autobrain git ref
        required: true
        default: main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref }}
          fetch-depth: 1

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push autobrain-backend :hosted-arm64
        run: |
          set -euo pipefail
          docker buildx build \
            --platform linux/arm64 \
            --push \
            --tag ghcr.io/cannonfodder151/autobrain-backend:hosted-arm64 \
            --file docker/backend/Dockerfile .
          echo "==> pushed ghcr.io/cannonfodder151/autobrain-backend:hosted-arm64"

      - name: Verify arm64 image
        run: |
          set -euo pipefail
          docker run --rm --platform linux/arm64 \
            ghcr.io/cannonfodder151/autobrain-backend:hosted-arm64 \
            /bin/sh -c 'uname -m' | grep -q aarch64
          echo "arm64 verified"