name: Graft Freshness Check

on:
  push:
    branches: [main]
    paths:
      - '**/*.py'
      - '**/*.ts'
      - '**/*.dart'
      - '.github/workflows/graft-check.yml'
  pull_request:
    branches: [main]
    paths:
      - '**/*.py'
      - '**/*.ts'
      - '**/*.dart'
      - '.github/workflows/graft-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  graft-check:
    runs-on: [self-hosted, linux, x64, vm2]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Graft
        run: npm install -g @nanonets/graft

      - name: Build Graft graph
        run: graft build

      - name: Check Graft freshness
        run: graft check