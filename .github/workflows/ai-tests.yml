name: AI tests

on:
  pull_request:
    paths:
      - "ai/**"
      - ".github/workflows/ai-tests.yml"
  push:
    branches: [main]
    paths:
      - "ai/**"
      - ".github/workflows/ai-tests.yml"

permissions:
  contents: read

jobs:
  pytest:
    name: pytest — AI health score + fallbacks
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ai/requirements.txt

      - name: Install AI dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ai/requirements.txt

      - name: Run AI health score tests with coverage
        run: |
          pytest ai/tests/test_health_score.py -v --maxfail=1 --tb=short \
            --cov=ai.app.fallbacks.health_score \
            --cov-fail-under=90

      - name: Collect AI health score tests (no silent import errors)
        run: |
          pytest ai/tests/test_health_score.py --collect-only -q

      - name: Notify Discord on test results
        if: always()
        env:
          DISCORD_REPORT_WEBHOOK: ${{ secrets.DISCORD_REPORT_WEBHOOK }}
        run: |
          set -euo pipefail
          if [ "${{ job.status }}" = "success" ]; then
            COLOR="0x2ECC71"; STATE="passed"
          else
            COLOR="0xE74C3C"; STATE="${{ job.status }}"
          fi
          discord_url="${DISCORD_REPORT_WEBHOOK:-}"
          case "$discord_url" in
            https://*|http://*) ;;
            *)
              echo "::warning::DISCORD_REPORT_WEBHOOK is not an http(s) URL; skipping Discord report"
              exit 0
              ;;
          esac
          curl -sS --max-time 30 -X POST "$discord_url" \
            -H "Content-Type: application/json" \
            -d "$(jq -nc --arg c updates --arg t "AI tests — $STATE" --arg col "$COLOR" \
              --arg d "Branch: ${{ github.ref_name }}\nCommit: ${{ github.sha }}\nRun: [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})" \
              '{channel:$c,title:$t,description:$d,color:$col,author:"CI",fields:[{name:"Workflow",value:"${{ github.workflow }}",inline:true},{name:"Status",value:"${{ job.status }}",inline:true}]}')" \
            || echo "::warning::Discord report POST failed"