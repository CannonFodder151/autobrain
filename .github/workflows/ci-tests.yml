name: Backend tests

# Runs the pytest suite on every PR and every push to main. A failing
# health_demo.test or any other test blocks the merge — see AUT-2119.
# This is the gate that keeps hosted/default from drifting out of parity.

on:
  pull_request:
    paths:
      - "backend/**"
      - "scripts/**"
      - ".github/workflows/**"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "scripts/**"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  pytest:
    name: pytest
    runs-on: [self-hosted, linux, x64, vm2]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run health_demo test (the CI gate)
        working-directory: backend
        env:
          DATABASE_URL: "postgresql+asyncpg://autobrain:autobrain@localhost:5432/autobrain"
          SECRET_KEY: "ci-test-secret"
          ENVIRONMENT: "development"
          POSTGRES_USER: "ci-test-postgres-user"
          POSTGRES_PASSWORD: "ci-test-postgres-password"
          POSTGRES_DB: "ci-test-postgres-db"
          MINIO_ACCESS_KEY: "ci-test-minio-access-key"
          MINIO_SECRET_KEY: "ci-test-minio-secret-key"
          MINIO_BUCKET: "ci-test-minio-bucket"
        run: |
          pytest tests/test_health_demo.py -v --maxfail=1 --tb=short

      - name: Collect backend tests (no silent import errors)
        working-directory: backend
        env:
          DATABASE_URL: "postgresql+asyncpg://autobrain:autobrain@localhost:5432/autobrain"
          SECRET_KEY: "ci-test-secret"
          ENVIRONMENT: "development"
          POSTGRES_USER: "ci-test-postgres-user"
          POSTGRES_PASSWORD: "ci-test-postgres-password"
          POSTGRES_DB: "ci-test-postgres-db"
          MINIO_ACCESS_KEY: "ci-test-minio-access-key"
          MINIO_SECRET_KEY: "ci-test-minio-secret-key"
          MINIO_BUCKET: "ci-test-minio-bucket"
        run: |
          # AUT-5356: the full-suite step below ends in `|| true`, so a test
          # module that fails to import is silently skipped and its coverage
          # never runs. Collection errors must fail the build instead.
          pytest --collect-only -q

      - name: Run full backend test suite
        working-directory: backend
        env:
          DATABASE_URL: "postgresql+asyncpg://autobrain:autobrain@localhost:5432/autobrain"
          SECRET_KEY: "ci-test-secret"
          ENVIRONMENT: "development"
          POSTGRES_USER: "ci-test-postgres-user"
          POSTGRES_PASSWORD: "ci-test-postgres-password"
          POSTGRES_DB: "ci-test-postgres-db"
          MINIO_ACCESS_KEY: "ci-test-minio-access-key"
          MINIO_SECRET_KEY: "ci-test-minio-secret-key"
          MINIO_BUCKET: "ci-test-minio-bucket"
        run: |
          pytest -v --maxfail=1 --tb=short || true

      - name: Notify Discord on failure
        if: failure()
        uses: slackapi/slack-github-action@v1
        with:
          # The Discord reporter is the AutoBrain-sanctioned notification path.
          # We POST an embed summarising which test failed; channel=#updates.
          payload: |
            {
              "channel": "updates",
              "title": "CI tests FAILED on ${{ github.workflow }}",
              "description": "Branch: `${{ github.ref_name }}`\nCommit: ${{ github.sha }}\nRun: ${{ github.run_id }}",
              "color": "0xED4245",
              "author": "CI",
              "fields": [
                {"name": "Workflow", "value": "${{ github.workflow }}", "inline": true},
                {"name": "Run", "value": "[#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})", "inline": true}
              ]
            }
        env:
          SLACK_WEBHOOK_URL: https://n8n.nathanmartina.com/webhook/discord-report

  # A workflow with invalid YAML never runs a single job — GitHub records it as a
  # 0-job `failure` on every push and the deploy signal is silently lost (AUT-4911).
  workflow-yaml:
    name: workflow yaml parse
    runs-on: [self-hosted, linux, x64, vm2]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Every workflow file must parse
        run: |
          python -m pip install --quiet pyyaml
          python - <<'PY'
          import pathlib, sys, yaml
          bad = []
          for f in sorted(pathlib.Path(".github/workflows").glob("*.y*ml")):
              try:
                  yaml.safe_load(f.read_text())
              except Exception as e:
                  bad.append(f"{f}: {e}")
          if bad:
              print("Invalid workflow YAML:\n" + "\n".join(bad))
              sys.exit(1)
          print("all workflow files parse")
          PY

  # AUT-4690 made docker/frontend/Dockerfile hard-fail on an empty CARTO_API_KEY,
  # which silently broke every documented/scripted frontend build that omitted the
  # build arg (AUT-4824). The check needs no docker daemon, so run it on every PR.
  carto-build-arg:
    name: carto build-arg propagation
    runs-on: [self-hosted, linux, x64, vm2]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Documented/scripted frontend builds must pass CARTO_API_KEY
        run: python3 scripts/check-carto-build-arg-propagation.py

  # scripts/bump-version.sh dies on an unset CARTO_API_KEY under `set -u` while
  # only printing its help text, which blocked the auto-bump release job on main
  # (AUT-4855, a regression from AUT-4824). Runs in a sandbox — no docker needed.
  #
  # AUT-5031: also runs the hosted-compose consolidation check and its tests.
  # The check was red on main (it still expected the gh-runner service that
  # AUT-4911 moved to its own Portainer stack), so it was never green and
  # therefore not enforced in CI — which is how the AUT-3944 backup invariants
  # were dropped unnoticed by PR #832. Needs pyyaml, no docker daemon.
  release-scripts:
    name: release script self-checks
    runs-on: [self-hosted, linux, x64, vm2]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: bump-version.sh survives an unset CARTO_API_KEY
        run: bash scripts/test-bump-version.sh

      - name: hosted compose stays consolidated (AUT-3944 backup invariants)
        run: |
          python -m pip install --quiet pyyaml
          python scripts/check-compose-consolidation.py
          python -m unittest scripts/test_check_compose_consolidation.py -v

  # AUT-5088: hosted booted without `alembic upgrade head`, so every
  # migration-only change was dead code in production. The compose guard in
  # release-scripts catches a deleted migration step; this job proves the chain
  # itself still applies — a create_all-built database at the hosted stamp
  # reaches head, and the pending revision performs real DDL rather than just
  # bumping a version string. pgvector/pgvector:pg17 matches the hosted
  # postgres image.
  alembic-migrations:
    name: alembic upgrade head (hosted-shaped DB + pending revision DDL)
    runs-on: [self-hosted, linux, x64, vm2]
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: autobrain
          POSTGRES_PASSWORD: autobrain
          POSTGRES_DB: postgres
        ports:
          - "5432:5432"
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Migration chain reaches head; migration-only changes apply
        working-directory: backend
        env:
          ALEMBIC_TEST_ADMIN_URL: "postgresql://autobrain:autobrain@localhost:5432/postgres"
        run: pytest tests/test_alembic_migration_only.py -v --maxfail=1 --tb=short

  # AUT-5031: scripts/test_sync_compose_to_portainer.py had no CI job, so the
  # AUT-4946 health gate (post-PUT verification + orphan-port refusal) shipped
  # with its own regression tests already stale — 2 of 3 failed because the
  # ordered mock list predated the new API calls. Pure stdlib, no docker.
  compose-sync-script:
    name: compose sync script self-checks
    runs-on: [self-hosted, linux, x64, vm2]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      # stdlib unittest only — ubuntu-latest ships no pytest.
      - name: sync-compose-to-portainer.py regression tests
        run: python3 scripts/test_sync_compose_to_portainer.py -v

      # AUT-5669: the pin bump's monotonic guard + provenance
      # (update-compose-pins.py) and the deploy-by-digest refusal
      # (sync-compose-to-portainer.py) are otherwise unguarded code
      # paths. Pure stdlib + a temp git repo, no docker, no pyyaml.
      - name: compose pin guard regression tests
        run: python3 scripts/test_update_compose_pins.py

      - name: compose deploy guard regression tests
        run: python3 scripts/test_sync_compose_guards.py

      # AUT-5756: CI credential scope guard — fails if a workflow references a
      # repo/org-wide credential for a push to a protected branch, or if a job
      # that pushes via secrets.*_PAT declares permissions: contents: write.
      # Pure stdlib, no docker.
      - name: CI credential scope guard
        run: python3 scripts/check-ci-credential-scope.py

      # AUT-5396: the nightly sync gate SKIPped two nights because the
      # schedule dispatcher starts cron runs 2.6-4.2h late. The cron now
      # fires at 12:30Z and the job sleeps to the 17:00Z window edge;
      # this guard replays the wait step against synthetic clocks.
      - name: nightly-hosted-sync wait step regression tests
        run: python3 scripts/test_nightly_sync_wait.py -v
  # AUT-4718: the base-image CVE gate went red on `main` for a week because the
  # Dockerfile pin and the trivy scan env had drifted onto different nginx digests —
  # the gate was not scanning the image we build. This stdlib-only guard asserts the
  # pins agree, that every pin is digest-pinned, and that no `.trivyignore` line
  # lacks a justification. No docker daemon needed.
  base-image-pins:
    name: base image pin consistency
    runs-on: [self-hosted, linux, x64, vm2]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scan env must cover the images we build
        run: python3 scripts/test_base_image_pin_consistency.py
