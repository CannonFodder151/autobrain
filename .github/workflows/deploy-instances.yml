# AUT-1905: fully-automated deployment on a new version.
#
# Board direction (AUT-1847) previously required the Deployment Lead to manually
# dispatch the upgrade after an image publish. AUT-1905 flips that: when a new
# version is deployed (images published), BOTH release tracks fire automatically:
#   1. Mobile Release Engineer track — the `trigger-mobile` job below dispatches
#      sync-mobile.yml on image-publish success; sync-mobile.yml mirrors
#      frontend -> autobrain-mobile and dispatches release-mobile.yml to publish
#      the store build. The mobile app is updated + published hands-free.
#   2. Deployment Engineer track (this file) — on image-publish success, redeploy
#      Demo -> test -> Default -> test -> Hosted -> test via scripts/upgrade-instances.sh,
#      health-gating every tier so a failed tier blocks promotion (no blind roll).
#
# Safety: the staged upgrade is still gated by per-tier health checks; a tier that
# fails health stops the whole chain rather than promoting. `workflow_dispatch`
# remains as a manual escape hatch (re-run / partial promote).

name: Upgrade instances (Demo -> Default -> Hosted)

on:
  workflow_run:
    workflows:
      - Publish images to Docker Hub
      - Build hosted images (multi-arch)
    types: [completed]
  workflow_dispatch:
    inputs:
      reason:
        description: Why (manual re-run of the upgrade path; auto path is default)
        required: false
        default: manual dispatch

concurrency:
  group: upgrade-instances
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Auto path: image published -> trigger the Deployment Engineer's staged rollout
  # and report it. Manual path (workflow_dispatch) reuses the exact same job.
  upgrade:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: [self-hosted, linux, x64, vm2]
    timeout-minutes: 90
    env:
      PORTAINER_URL: ${{ secrets.PORTAINER_URL }}
      PORTAINER_API_KEY: ${{ secrets.PORTAINER_API_KEY }}
      APP_VERSION: ""
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        run: |
          V="$(grep -E 'APP_VERSION: str' backend/app/core/config.py | sed -E 's/.*"([0-9]+\.[0-9]+\.[0-9]+)".*/\1/')"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "APP_VERSION=$V" >> "$GITHUB_ENV"

      - name: Notify Deployment Engineer (auto-upgrade triggered)
        if: github.event_name == 'workflow_run'
        run: |
          curl -s -X POST https://n8n.nathanmartina.com/webhook/discord-report \
            -H "Content-Type: application/json" \
            -d "{\"channel\":\"ops\",\"title\":\"AutoBrain v${{ steps.ver.outputs.version }} published — auto-deploying Demo -> Default -> Hosted\",\"description\":\"Image published. Deployment Engineer track triggered automatically (AUT-1905). Mobile track (sync-mobile.yml -> release-mobile.yml) runs in parallel. Per-tier health gate blocks promotion on failure.\",\"color\":\"0x95A5A6\",\"author\":\"Deployment Engineer\",\"fields\":[{\"name\":\"Version\",\"value\":\"${{ steps.ver.outputs.version }}\",\"inline\":true},{\"name\":\"Trigger\",\"value\":\"image-publish\",\"inline\":true},{\"name\":\"Mobile\",\"value\":\"auto (sync-mobile)\",\"inline\":true}]}"

      - name: Upgrade all instances along the upgrade path (Demo -> test -> Default -> test -> Hosted -> test)
        run: ./scripts/upgrade-instances.sh

      - name: Report status to Discord
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            COLOR=0x57F287; STATE=Upgraded
          else
            COLOR=0xED4245; STATE=FAILED
          fi
          curl -s -X POST https://n8n.nathanmartina.com/webhook/discord-report \
            -H "Content-Type: application/json" \
            -d "{\"channel\":\"status\",\"title\":\"AutoBrain instances upgrade — $STATE (AUT-1905)\",\"description\":\"Demo -> Default -> Hosted redeploy via the upgrade path with per-tier health gating.\",\"color\":\"$COLOR\",\"author\":\"Deployment Engineer\",\"fields\":[{\"name\":\"Trigger\",\"value\":\"${{ github.event_name }}\",\"inline\":true},{\"name\":\"State\",\"value\":\"$STATE\",\"inline\":true},{\"name\":\"Run\",\"value\":\"https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\",\"inline\":false}]}"

  # Mobile Release Engineer track (AUT-1907): image published -> dispatch the
  # mobile sync + release pipeline. Runs in parallel with the Deployment
  # Engineer `upgrade` job (independent tracks). sync-mobile.yml mirrors
  # frontend/lib + assets + version into autobrain-mobile, health-gates the
  # synced tree with `flutter analyze`, then dispatches release-mobile.yml to
  # publish the store build. The mobile app is updated + published hands-free.
  #
  # Concurrency: deploy-instances.yml fires once per image-publish workflow
  # (Docker Hub + hosted), so two trigger-mobile runs can start near-simultaneously.
  # Serialize with cancel-in-progress: false so the second waits for the first to
  # finish and finds the mobile tree already synced (no-op dispatch, no double
  # release) instead of cancelling a sync mid-push/release.
  trigger-mobile:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: [self-hosted, linux, x64, vm2]
    timeout-minutes: 10
    concurrency:
      group: trigger-mobile
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ secrets.MOBILE_SYNC_TOKEN }}
    steps:
      - name: Checkout autobrain repo
        uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        run: |
          V="$(grep -E 'APP_VERSION: str' backend/app/core/config.py | sed -E 's/.*"([0-9]+\.[0-9]+\.[0-9]+)".*/\1/')"
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Notify Mobile Release Engineer (auto mobile-sync triggered)
        if: github.event_name == 'workflow_run'
        run: |
          curl -s -X POST https://n8n.nathanmartina.com/webhook/discord-report \
            -H "Content-Type: application/json" \
            -d "{\"channel\":\"ops\",\"title\":\"AutoBrain v${{ steps.ver.outputs.version }} published — triggering mobile sync + release\",\"description\":\"Image published. Mobile Release Engineer track fired automatically (AUT-1907): deploy-instances.yml dispatches sync-mobile.yml, which syncs frontend -> autobrain-mobile and dispatches release-mobile.yml. Deployment Engineer track runs in parallel.\",\"color\":\"0x5865F2\",\"author\":\"Mobile Release Engineer\",\"fields\":[{\"name\":\"Version\",\"value\":\"${{ steps.ver.outputs.version }}\",\"inline\":true},{\"name\":\"Trigger\",\"value\":\"image-publish\",\"inline\":true},{\"name\":\"Mobile\",\"value\":\"sync-mobile -> release-mobile\",\"inline\":true}]}"

      - name: Dispatch sync-mobile.yml (Mobile Release Engineer track)
        run: |
          set -euo pipefail
          # sync-mobile.yml already serializes its own runs via the
          # sync-mobile-${{ github.ref }} concurrency group, so a re-dispatch
          # here is safe: the survivor always syncs main's latest lineage and
          # produces a valid, analyzable tree (AUT-1099 / AUT-633).
          gh workflow run sync-mobile.yml --repo "${{ github.repository }}" \
            --ref "$(git rev-parse --abbrev-ref HEAD)"
          echo "dispatched sync-mobile.yml for v${{ steps.ver.outputs.version }}"
