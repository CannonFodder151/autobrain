# AUT-1905 (Auto deployment) + AUT-1911 (wire the agent trigger):
#
# On a new-version deploy (images published to the registry by
# `dockerhub-publish.yml` / `build-hosted.yml`), CI must TRIGGER THE AGENTS —
# never run a git deploy job and never merely post a Discord embed. The `notify`
# job emits a one-line deploy signal to the n8n bridge:
#   deploy-instances.yml -> webhook/autobrain-deploy-trigger -> Paperclip API
# which raises the two AutoBrain issues that wake the release engineers:
#   - AUT-1907 -> Mobile Release Engineer (update + publish the mobile app)
#   - AUT-1908 -> Deployment Engineer (Demo->test->Default->test->Hosted->test)
#
# Agent-triggering logic lives in n8n (idempotent per APP_VERSION); git only
# emits the signal. The manual `upgrade` job (workflow_dispatch) remains as the
# AUT-1847 board-sanctioned operator fallback.
#
# The promotion order + per-tier health gating live inside the script (AUT-107);
# a tier that fails health blocks promotion to the next tier.

name: Upgrade instances (Demo → Default → Hosted)

on:
  workflow_run:
    workflows:
      - Publish images to Docker Hub
      - Build hosted images (multi-arch)
    types: [completed]
  workflow_dispatch:
    inputs:
      reason:
        description: Why (e.g. manual upgrade-path run by the Deployment Lead)
        required: false
        default: manual dispatch

concurrency:
  group: upgrade-instances
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Image published -> tell the Deployment Lead a promote is ready. No deploy
  # happens here; the Deployment Lead owns the actual upgrade (AUT-1847).
  notify:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: [self-hosted, linux, x64, vm2]
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        run: |
          V="$(grep -E 'APP_VERSION: str' backend/app/core/config.py | sed -E 's/.*"([0-9]+\.[0-9]+\.[0-9]+)".*/\1/')"
          echo "version=$V" >> "$GITHUB_OUTPUT"

      # Emit a one-line deploy signal. n8n dedupes by APP_VERSION so a re-run
      # of the same version never raises duplicate agent issues. Best-effort:
      # if the bridge is offline the publish still succeeds and we report it.
      - name: Emit deploy signal to n8n (wakes AUT-1907 + AUT-1908)
        id: signal
        continue-on-error: true
        env:
          DEPLOY_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          printf -v payload '{"event":"image-published","version":"%s","repo":"%s","run_id":"%s"}' "$DEPLOY_VERSION" "${{ github.repository }}" "${{ github.run_id }}"
          code="$(curl -s -o /tmp/signal_resp -w "%{http_code}" -X POST https://n8n.nathanmartina.com/webhook/autobrain-deploy-trigger \
            -H "Content-Type: application/json" -d "$payload")"
          echo "http_code=$code" >> "$GITHUB_OUTPUT"
          [ -s /tmp/signal_resp ] && cat /tmp/signal_resp >&2 || true

      - name: Report signal result to #ops
        if: always()
        run: |
          if [ "${{ steps.signal.outcome }}" = "success" ] && [ "${{ steps.signal.outputs.http_code }}" = "200" ]; then
            COLOR=0x57F287; STATE=signaled
          else
            COLOR=0xED4245; STATE=failed
          fi
          curl -s -X POST https://n8n.nathanmartina.com/webhook/discord-report \
            -H "Content-Type: application/json" \
            -d "{\"channel\":\"ops\",\"title\":\"AutoBrain v${{ steps.ver.outputs.version }} deploy signal\",\"description\":\"Image published; n8n bridge raised AUT-1907 (Mobile Release Engineer) + AUT-1908 (Deployment Engineer).\",\"color\":\"$COLOR\",\"author\":\"Deployment Lead\",\"fields\":[{\"name\":\"Version\",\"value\":\"${{ steps.ver.outputs.version }}\",\"inline\":true},{\"name\":\"Signal\",\"value\":\"$STATE\",\"inline\":true},{\"name\":\"Issues\",\"value\":\"AUT-1907, AUT-1908\",\"inline\":true}]}"

  # Deployment Lead triggers this after the image is published. Runs the upgrade
  # path and reports health to Discord `#status`.
  upgrade:
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, linux, x64, vm2]
    timeout-minutes: 90
    env:
      PORTAINER_URL: ${{ secrets.PORTAINER_URL }}
      PORTAINER_API_KEY: ${{ secrets.PORTAINER_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Upgrade all instances along the upgrade path
        run: ./scripts/upgrade-instances.sh

      - name: Report status to Discord
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            COLOR=0x57F287; STATE=Upgraded
          else
            COLOR=0xED4245; STATE=FAILED
          fi
          curl -s -X POST https://n8n.nathanmartina.com/webhook/discord-report \
            -H "Content-Type: application/json" \
            -d "{\"channel\":\"status\",\"title\":\"AutoBrain instances upgrade — $STATE\",\"description\":\"Demo -> Default -> Hosted redeploy via the upgrade path (AUT-1847).\",\"color\":\"$COLOR\",\"author\":\"Deployment Lead\",\"fields\":[{\"name\":\"Trigger\",\"value\":\"${{ github.event_name }}\",\"inline\":true},{\"name\":\"State\",\"value\":\"$STATE\",\"inline\":true},{\"name\":\"Run\",\"value\":\"https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\",\"inline\":false}]}"
