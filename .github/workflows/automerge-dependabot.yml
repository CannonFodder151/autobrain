# AUT-1031: Auto-merge Dependabot patch/minor updates with passing CI
# This workflow merges Dependabot PRs that are patch/minor updates
# and have all status checks passing. Major version upgrades are excluded.
# Works on free GitHub plan (no native auto-merge required).
name: "Auto-merge Dependabot PRs"

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - labeled
      - unlabeled
    branches:
      - main
  pull_request_review:
    types:
      - submitted
  check_suite:
    types:
      - completed
  status:

permissions:
  contents: write
  pull-requests: write
  statuses: read

jobs:
  automerge:
    name: "Auto-merge Dependabot patch/minor updates"
    if: |
      github.actor == 'dependabot[bot]' &&
      contains(github.event.pull_request.labels.*.name, 'dependencies') &&
      (contains(github.event.pull_request.labels.*.name, 'patch') || contains(github.event.pull_request.labels.*.name, 'minor'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: "Wait for all status checks to complete"
        id: wait_checks
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const number = context.payload.pull_request.number;
            const headSha = context.payload.pull_request.head.sha;
            
            // Poll for checks to complete (max 10 minutes)
            const maxAttempts = 60;
            const delayMs = 10000;
            
            for (let attempt = 0; attempt < maxAttempts; attempt++) {
              const { data: checks } = await github.rest.checks.listForRef({
                owner,
                repo,
                ref: headSha,
                per_page: 100
              });
              
              const pendingChecks = checks.check_runs.filter(c => c.status !== 'completed');
              const failedChecks = checks.check_runs.filter(c => 
                c.conclusion === 'failure' || c.conclusion === 'cancelled' || c.conclusion === 'timed_out' || c.conclusion === 'action_required'
              );
              
              if (failedChecks.length > 0) {
                console.log(`❌ ${failedChecks.length} checks failed:`);
                for (const check of failedChecks) {
                  console.log(`  - ${check.name}: ${check.conclusion}`);
                }
                core.setFailed('Some checks failed');
                return;
              }
              
              if (pendingChecks.length === 0) {
                console.log('✅ All checks completed successfully!');
                core.setOutput('ready', 'true');
                return;
              }
              
              console.log(`⏳ Waiting for ${pendingChecks.length} checks to complete... (attempt ${attempt + 1}/${maxAttempts})`);
              for (const check of pendingChecks) {
                console.log(`  - ${check.name}: ${check.status}`);
              }
              
              await new Promise(resolve => setTimeout(resolve, delayMs));
            }
            
            core.setFailed('Timeout waiting for checks to complete');

      - name: "Verify PR is mergeable"
        id: check_mergeable
        if: steps.wait_checks.outputs.ready == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const number = context.payload.pull_request.number;
            
            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: number });
            
            if (pr.mergeable === false) {
              core.setFailed('PR has merge conflicts');
              return;
            }
            
            if (pr.mergeable_state !== 'clean' && pr.mergeable_state !== 'has_hooks') {
              console.log(`⚠️ Mergeable state: ${pr.mergeable_state}`);
              // Don't fail, just warn - has_hooks is OK
            }
            
            console.log('✅ PR is mergeable');
            core.setOutput('ready', 'true');

      - name: "Squash merge PR"
        if: steps.check_mergeable.outputs.ready == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const number = context.payload.pull_request.number;
            const headSha = context.payload.pull_request.head.sha;
            
            // Perform squash merge
            const { data: mergeResult } = await github.rest.pulls.merge({
              owner,
              repo,
              pull_number: number,
              merge_method: 'squash',
              sha: headSha,
              commit_title: `chore(deps): ${context.payload.pull_request.title}`,
              commit_message: `Auto-merged by Dependabot auto-merge workflow.\n\nOriginal PR: #${number}\nTitle: ${context.payload.pull_request.title}`
            });
            
            if (mergeResult.merged) {
              console.log(`✅ PR #${number} merged successfully!`);
              console.log(`Merge commit: ${mergeResult.sha}`);
            } else {
              core.setFailed(`Merge failed: ${mergeResult.message}`);
            }

      - name: "Post merge confirmation"
        if: steps.check_mergeable.outputs.ready == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const number = context.payload.pull_request.number;
            
            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: number,
              body: '🤖 **Auto-merged by Dependabot workflow**\n\nAll status checks passed. This patch/minor dependency update has been automatically merged.'
            });

      - name: "Delete branch after merge"
        if: steps.check_mergeable.outputs.ready == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const headRef = context.payload.pull_request.head.ref;
            
            try {
              await github.rest.git.deleteRef({
                owner,
                repo,
                ref: `heads/${headRef}`
              });
              console.log(`🗑️ Deleted branch: ${headRef}`);
            } catch (e) {
              console.log(`Branch deletion skipped (may already be deleted): ${e.message}`);
            }