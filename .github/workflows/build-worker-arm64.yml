name: CTO worker arm64 build
on:
  push:
    branches: [hotfix/build-worker-arm64]
  workflow_dispatch:
jobs:
  build:
    runs-on: [self-hosted, linux, ARM64]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT || secrets.GITHUB_TOKEN }}
      - name: Build worker (arm64)
        env:
          TAG: hosted
          ARCH: arm64
        run: |
          set -euo pipefail
          docker buildx build \
            --platform linux/arm64 \
            --tag ghcr.io/cannonfodder151/autobrain-worker:hosted-arm64 \
            --file docker/worker/Dockerfile \
            --load \
            .
      - name: Push worker image
        run: |
          docker push ghcr.io/cannonfodder151/autobrain-worker:hosted-arm64
