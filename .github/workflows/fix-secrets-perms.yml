name: Fix Secret File Permissions on EP5

on:
  workflow_dispatch:
    inputs:
      fix_type:
        description: 'Type of fix'
        required: true
        default: 'chmod'

jobs:
  fix-perms:
    runs-on: self-hosted
    steps:
      - name: Fix market_data_api_key permissions
        run: |
          chmod 640 /data/autobrain/secrets/market_data_api_key
          chown root:1000 /data/autobrain/secrets/market_data_api_key
          ls -la /data/autobrain/secrets/market_data_api_key
          
      - name: Restart AI container
        run: |
          docker restart autobrain-hosted-ai-1
          sleep 5
          docker logs autobrain-hosted-ai-1 --tail 20
