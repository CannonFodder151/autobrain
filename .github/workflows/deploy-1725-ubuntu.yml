name: Build 0.3.141 images on ubuntu-latest (AUT-1725)

on:
  workflow_dispatch:

concurrency:
  group: deploy-1725
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version
        run: |
          echo "VERSION=$(grep -E 'APP_VERSION: str' backend/app/core/config.py | sed -E 's/.*"([0-9]+\.[0-9]+\.[0-9]+)".*/\1/')" >> $GITHUB_ENV

      - name: Build & push backend (Docker Hub)
        run: |
          for tag in latest "$VERSION"; do
            docker buildx build --platform linux/amd64 --push \
              -t "cannonfodder151/autobrain-backend:${tag}-amd64" \
              -f docker/backend/Dockerfile .
            docker buildx imagetools create \
              -t "cannonfodder151/autobrain-backend:${tag}" \
              "cannonfodder151/autobrain-backend:${tag}-amd64"
          done

      - name: Build & push ai (Docker Hub)
        run: |
          for tag in latest "$VERSION"; do
            docker buildx build --platform linux/amd64 --push \
              -t "cannonfodder151/autobrain-ai:${tag}-amd64" \
              -f docker/ai/Dockerfile .
            docker buildx imagetools create \
              -t "cannonfodder151/autobrain-ai:${tag}" \
              "cannonfodder151/autobrain-ai:${tag}-amd64"
          done

      - name: Build & push worker (Docker Hub)
        run: |
          for tag in latest "$VERSION"; do
            docker buildx build --platform linux/amd64 --push \
              -t "cannonfodder151/autobrain-worker:${tag}-amd64" \
              -f docker/worker/Dockerfile .
            docker buildx imagetools create \
              -t "cannonfodder151/autobrain-worker:${tag}" \
              "cannonfodder151/autobrain-worker:${tag}-amd64"
          done

      - name: Build & push frontend for default tier (Docker Hub)
        env:
          API_BASE_URL: https://default.autobrainservice.app/api/v1
          WS_BASE_URL: wss://default.autobrainservice.app/ws
        run: |
          echo "==> Building frontend:default"
          docker buildx build --platform linux/amd64 --push \
            -t "cannonfodder151/autobrain-frontend:default-amd64" \
            --build-arg API_BASE_URL=$API_BASE_URL --build-arg WS_BASE_URL=$WS_BASE_URL \
            -f docker/frontend/Dockerfile .
          docker buildx imagetools create \
            -t "cannonfodder151/autobrain-frontend:default" \
            "cannonfodder151/autobrain-frontend:default-amd64"

      - name: Build & push frontend 0.3.141 (Docker Hub, hosted URLs)
        env:
          API_BASE_URL: https://hosted.autobrainservice.app/api/v1
          WS_BASE_URL: wss://hosted.autobrainservice.app/ws
        run: |
          echo "==> Building frontend:$VERSION"
          docker buildx build --platform linux/amd64 --push \
            -t "cannonfodder151/autobrain-frontend:${VERSION}-amd64" \
            --build-arg API_BASE_URL=$API_BASE_URL --build-arg WS_BASE_URL=$WS_BASE_URL \
            -f docker/frontend/Dockerfile .
          docker buildx imagetools create \
            -t "cannonfodder151/autobrain-frontend:${VERSION}" \
            "cannonfodder151/autobrain-frontend:${VERSION}-amd64"

      - name: Build & push frontend for demo tier (ghcr.io)
        env:
          API_BASE_URL: https://demo.autobrainservice.app/api/v1
          WS_BASE_URL: wss://demo.autobrainservice.app/ws
        run: |
          echo "==> Building ghcr frontend:demo"
          docker buildx build --platform linux/amd64 --push \
            -t "ghcr.io/cannonfodder151/autobrain-frontend:demo-amd64" \
            --build-arg API_BASE_URL=$API_BASE_URL --build-arg WS_BASE_URL=$WS_BASE_URL \
            -f docker/frontend/Dockerfile .
          docker buildx imagetools create \
            -t "ghcr.io/cannonfodder151/autobrain-frontend:demo" \
            "ghcr.io/cannonfodder151/autobrain-frontend:demo-amd64"
