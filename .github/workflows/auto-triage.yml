name: Auto-triage Pipeline

# On CI failure/deploy fail/store rejection: create issue w/ logs, assign owner, wake agent, add postmortem template.
# SD tracks MTTR/lead time. Connect to GitHub webhook or polling routine.

on:
  workflow_run:
    workflows: 
      - "Backend tests"
      - "Build hosted images (multi-arch)"
      - "Build shop"
      - "Upgrade instance chain (AUT-4982)"
      - "Publish images to Docker Hub"
      - "Security PR gate"
      - "Code review"
      - "Visual regression"
      - "Compose checks"
      - "Security scan"
      - "Sync mobile app"
    types: [completed]
  schedule:
    - cron: "*/30 * * * *"  # Every 30 min polling fallback
  workflow_dispatch:
    inputs:
      hours_back:
        description: "Hours back to poll for failures"
        required: false
        default: "24"
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: auto-triage-${{ github.event.workflow_run.id || github.run_id }}
  cancel-in-progress: true

jobs:
  triage:
    name: Auto-triage
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      github.event.workflow_run.conclusion == 'failure'
    runs-on: [self-hosted, linux, x64, vm2]
    timeout-minutes: 10
    env:
      PAPERCLIP_API_KEY: ${{ secrets.PAPERCLIP_API_KEY }}
      GH_PAT: ${{ secrets.GH_PAT }}
      CI_TRIAGE_WEBHOOK_URL: ${{ secrets.CI_TRIAGE_WEBHOOK_URL }}
      CI_TRIAGE_WEBHOOK_SECRET: ${{ secrets.CI_TRIAGE_WEBHOOK_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip requests

      - name: Run auto-triage (poll mode)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          python scripts/auto-triage.py --poll ${{ github.event.inputs.hours_back || 24 }}

      - name: Run auto-triage (webhook mode)
        if: github.event_name == 'workflow_run'
        env:
          WEBHOOK_PAYLOAD: ${{ toJson(github.event) }}
        run: |
          echo "$WEBHOOK_PAYLOAD" | python scripts/auto-triage.py --webhook

      - name: Fire PR/CI Watchdog routine (webhook trigger)
        if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'failure'
        run: |
          payload=$(jq -n --argjson event "${{ toJson(github.event) }}" '{event: $event}')
          curl -sS --max-time 30 \
            -X POST "https://paperclip2.nathanmartina.com/api/routine-triggers/public/b1abe35f6b2b6e5988ba0111/fire" \
            -H "Authorization: Bearer ${{ secrets.CI_TRIAGE_WEBHOOK_SECRET }}" \
            -H "Content-Type: application/json" \
            -H "Idempotency-Key: auto-triage-${{ github.event.workflow_run.id }}" \
            -d "$payload" || echo "Routine webhook failed (non-blocking)"
