# AUT-1720: auto-free queued runs that are stuck on a deleted/merged branch.
# AUT-4949: also free *superseded* and *starved* runs, which is what actually wedged
#           the hosted deploy lane (82 queued runs while both x64 runners sat at
#           busy:true with zero assigned jobs).
# A run left `queued` after its head branch disappears becomes an un-cancellable
# GitHub zombie. A queued `push`/`workflow_dispatch` run whose commit has since been
# overtaken by a newer run of the same workflow on the same ref is just as dead
# weight: it can only ever produce a stale artifact, and it starves the runners.
# Logic lives in scripts/ci-queue-guard.sh so it can be unit tested.
name: CI Queue Guard

on:
  schedule:
    - cron: "*/10 * * * *" # every 10 minutes
  workflow_dispatch:

permissions:
  actions: write # required to cancel workflow runs

concurrency:
  group: ci-queue-guard
  cancel-in-progress: false

jobs:
  cancel-orphaned-runs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      # The AutoBrain self-hosted runner fleet lives under one owner.
      matrix:
        repo: [autobrain, autobrainservice-website, rego-lookup-api]
    env:
      # Starvation ceilings. A run queued this long on a busy fleet will not be
      # picked up; cancelling frees a slot and the commit can be re-run or will be
      # superseded by the next push.
      PUSH_TTL_MINUTES: "45"
      PR_TTL_MINUTES: "240"
    steps:
      - uses: actions/checkout@v4
      - name: Cancel deleted-branch, superseded and starved queued runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/ci-queue-guard.sh "${{ matrix.repo }}"