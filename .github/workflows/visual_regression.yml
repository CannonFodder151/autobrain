name: Visual regression (desktop 1280/1440/1920)

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'frontend/test/**'
      - 'frontend/lib/**'
      - '.github/workflows/visual_regression.yml'

concurrency:
  group: visual-regression-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  desktop-tests:
    name: Desktop layout — ${{ matrix.width }}
    runs-on: [self-hosted, linux, x64, vm2]
    strategy:
      fail-fast: false
      matrix:
        width: [1280, 1440, 1920]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: flutter pub get (frontend)
        working-directory: frontend
        run: flutter pub get
      - name: Desktop layout assertions (${{ matrix.width }})
        working-directory: frontend
        # ponytail: lists test files explicitly rather than running all of
        # frontend/test. 11 tests on main already fail (see AUT-5160), so
        # `flutter test` would redden every PR for pre-existing breakage.
        # Switch to a bare `flutter test` once main's suite is green.
        run: flutter test test/desktop_layout_test.dart test/login_logo_test.dart -r expanded
