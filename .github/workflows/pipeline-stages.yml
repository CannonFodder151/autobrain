name: Pipeline stages (demo -> default -> hosted)

on:
  workflow_dispatch:
    inputs:
      reason:
        description: Why (e.g. manual pipeline run by the Deployment Lead)
        required: false
        default: manual dispatch
  workflow_run:
    workflows:
      - Publish images to Docker Hub
      - Build hosted images (multi-arch)
    types: [completed]

permissions:
  contents: read

concurrency:
  group: pipeline-stages
  cancel-in-progress: false

jobs:
  stage-demo:
    name: Stage 1 — Demo deploy + health gate
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: [self-hosted, linux, x64, vm2]
    timeout-minutes: 30
    env:
      PORTAINER_URL: ${{ secrets.PORTAINER_URL }}
      PORTAINER_API_KEY: ${{ secrets.PORTAINER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Redeploy demo tier (pullImage)
        run: |
          set -euo pipefail
          UPGRADE_TIERS="autobrain-demo|2|https://demo.autobrainservice.app/health|" ./scripts/upgrade-instances.sh
      - name: Test gate — demo health
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            if curl -fsS --max-time 10 https://demo.autobrainservice.app/health >/dev/null 2>&1; then
              echo "demo healthy"
              exit 0
            fi
            sleep 10
          done
          echo "demo health gate FAILED"
          exit 1

  stage-default:
    name: Stage 2 — Default deploy + health gate
    needs: stage-demo
    runs-on: [self-hosted, linux, x64, vm2]
    timeout-minutes: 30
    env:
      PORTAINER_URL: ${{ secrets.PORTAINER_URL }}
      PORTAINER_API_KEY: ${{ secrets.PORTAINER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Redeploy default tier (pullImage)
        run: |
          set -euo pipefail
          UPGRADE_TIERS="autobrain-default|2|https://default.autobrainservice.app/health|" ./scripts/upgrade-instances.sh
      - name: Test gate — default health
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            if curl -fsS --max-time 10 https://default.autobrainservice.app/health >/dev/null 2>&1; then
              echo "default healthy"
              exit 0
            fi
            sleep 10
          done
          echo "default health gate FAILED"
          exit 1

  stage-hosted:
    name: Stage 3 — Hosted deploy + health gate
    needs: stage-default
    runs-on: [self-hosted, linux, x64, vm2]
    timeout-minutes: 30
    env:
      PORTAINER_URL: ${{ secrets.PORTAINER_URL }}
      PORTAINER_API_KEY: ${{ secrets.PORTAINER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Redeploy hosted tier (pullImage)
        run: |
          set -euo pipefail
          UPGRADE_TIERS="autobrain-hosted|5|https://hosted.autobrainservice.app/health|POSTGRES_USER=autobrain,POSTGRES_DB=autobrain" ./scripts/upgrade-instances.sh
      - name: Test gate — hosted health
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            if curl -fsS --max-time 10 https://hosted.autobrainservice.app/health >/dev/null 2>&1; then
              echo "hosted healthy"
              exit 0
            fi
            sleep 10
          done
          echo "hosted health gate FAILED"
          exit 1

  notify:
    name: Discord notification
    needs: [stage-demo, stage-default, stage-hosted]
    if: always()
    runs-on: ubuntu-latest
    env:
      DISCORD_REPORT_WEBHOOK: ${{ secrets.DISCORD_REPORT_WEBHOOK }}
    steps:
      - name: Report pipeline stages result
        run: |
          set -euo pipefail
          demo="${{ needs.stage-demo.result }}"
          default="${{ needs.stage-default.result }}"
          hosted="${{ needs.stage-hosted.result }}"
          # Overall status: success only if all stages succeeded
          if [ "$demo" = "success" ] && [ "$default" = "success" ] && [ "$hosted" = "success" ]; then
            COLOR="0x2ECC71"
            STATE="success"
          else
            COLOR="0xE74C3C"
            STATE="failure"
          fi
          discord_url="${DISCORD_REPORT_WEBHOOK:-}"
          case "$discord_url" in
            https://*|http://*) ;;
            *)
              echo "::warning::DISCORD_REPORT_WEBHOOK is not an http(s) URL; skipping Discord report"
              exit 0
              ;;
          esac
          DESC="Pipeline stages completed.\nDemo: $demo\nDefault: $default\nHosted: $hosted\nWorkflow: ${{ github.workflow }}\nRun: ${{ github.run_id }}"
          curl -sS --max-time 30 -X POST "$discord_url" \
            -H "Content-Type: application/json" \
            -d "$(jq -nc --arg c deployments --arg t "Pipeline stages — $STATE" --arg col "$COLOR" --arg d "$DESC" \
              '{channel:$c,title:$t,description:$d,color:$col,author:"Pipeline Stages",fields:[{name:"Demo",value:$demo,inline:true},{name:"Default",value:$default,inline:true},{name:"Hosted",value:$hosted,inline:true}]}')" \
            || echo "::warning::Discord report POST failed"
