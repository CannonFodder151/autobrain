name: Security — full-resolution dependency scan

on:
  schedule:
    # Weekly, Monday 06:00 UTC. A full-resolution (transitive) audit catches
    # CVEs in the resolved tree that the PR-time `--no-deps` pip-audit gate in
    # dockerhub-publish.yml cannot see (AUT-794).
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  audit:
    if: github.event_name != 'pull_request'
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v4

      - name: Install pip-audit
        run: pip install --quiet pip-audit

      - name: Fail on known vulns in the resolved tree
        id: audit
        run: |
          set -euo pipefail
          pip-audit -r backend/requirements.txt -r ai/requirements.txt \
            || { echo "result=found" >> "$GITHUB_OUTPUT"; exit 1; }
          echo "result=clean" >> "$GITHUB_OUTPUT"

      - name: Report to Discord #status
        if: always()
        env:
          RESULT: ${{ steps.audit.outputs.result }}
          COLOR: ${{ steps.audit.outputs.result == 'clean' && '0x57F287' || '0xED4245' }}
          TITLE: ${{ steps.audit.outputs.result == 'clean' && 'Dependency scan clean' || 'Dependency scan found known CVEs' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -s -X POST https://n8n.nathanmartina.com/webhook/discord-report \
            -H "Content-Type: application/json" \
            -d "$(jq -nc --arg c status --arg t "$TITLE" --arg col "$COLOR" --arg u "$RUN_URL" \
              '{channel:$c,title:$t,description:"Weekly full-resolution pip-audit of backend + ai requirements.",color:$col,author:"Security Scan",fields:[{name:"Scan",value:"full-resolution (transitive)",inline:true},{name:"Run",value:$u,inline:true}]}')"
