name: Sync docs to Outline wiki

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'docs.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile=false
      - run: node scripts/sync-docs-outline.mjs
        env:
          OUTLINE_API_TOKEN: ${{ secrets.OUTLINE_API_TOKEN }}
          OUTLINE_API_URL: ${{ secrets.OUTLINE_API_URL || 'https://outline.nathanmartina.com' }}
