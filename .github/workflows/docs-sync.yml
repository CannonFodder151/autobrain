name: Sync docs to Outline wiki

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'docs.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Read failure count
        id: failure_count
        run: |
          if [ -f .github/docs-sync-failures.txt ]; then
            count=$(cat .github/docs-sync-failures.txt)
          else
            count=0
          fi
          echo "count=$count" >> $GITHUB_OUTPUT

      - name: Sync docs to Outline
        id: sync
        run: node scripts/sync-docs-outline.mjs
        env:
          OUTLINE_API_TOKEN: ${{ secrets.OUTLINE_API_TOKEN }}
          OUTLINE_API_URL: ${{ secrets.OUTLINE_API_URL || 'https://outline.nathanmartina.com' }}

      - name: Reset failure count on success
        if: success()
        run: |
          echo "0" > .github/docs-sync-failures.txt
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/docs-sync-failures.txt
          git diff --cached --quiet || git commit -m "chore: reset docs-sync failure count [skip ci]"

      - name: Increment failure count on failure
        if: failure()
        run: |
          new_count=$((${{ steps.failure_count.outputs.count }} + 1))
          echo "$new_count" > .github/docs-sync-failures.txt
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/docs-sync-failures.txt
          git diff --cached --quiet || git commit -m "chore: increment docs-sync failure count to $new_count [skip ci]"

      - name: Push failure count update
        if: always()
        run: |
          if ! git diff --quiet origin/main --; then
            for i in 1 2 3; do
              git push origin main && break
              echo "push raced — rebasing and retrying ($i/3)"
              git pull --rebase origin main
            done
          fi
