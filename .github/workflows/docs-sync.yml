name: Sync docs to Outline wiki

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'docs.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ci-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const { data: { workflow_runs } } = await github.rest.actions.listWorkflowRuns({
              owner, repo,
              workflow_id: 'docs-sync.yml',
              branch: 'main',
              per_page: 5,
              status: 'completed',
            });
            const recent = workflow_runs.filter(r => r.event === 'push' || r.event === 'workflow_dispatch').slice(0, 3);
            const failures = recent.filter(r => r.conclusion === 'failure');
            if (failures.length >= 3) {
              core.setFailed(`Docs sync has failed ${failures.length} consecutive times (${failures.map(f => f.id).join(', ')}). Manual intervention required.`);
              return;
            }
            core.info(`Recent runs: ${recent.length} total, ${failures.length} failures. Proceeding.`);

  sync-docs:
    needs: ci-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/sync-docs-outline.mjs
        env:
          OUTLINE_API_TOKEN: ${{ secrets.OUTLINE_API_TOKEN }}
          OUTLINE_API_URL: ${{ secrets.OUTLINE_API_URL || 'https://outline.nathanmartina.com' }}

      - name: Reset failure count on success
        if: success()
        run: |
          echo "0" > .github/docs-sync-failures.txt
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/docs-sync-failures.txt
          git diff --cached --quiet || git commit -m "chore: reset docs-sync failure count [skip ci]"

      - name: Increment failure count on failure
        if: failure()
        run: |
          if [ -f .github/docs-sync-failures.txt ]; then
            new_count=$(($(cat .github/docs-sync-failures.txt) + 1))
          else
            new_count=1
          fi
          echo "$new_count" > .github/docs-sync-failures.txt
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/docs-sync-failures.txt
          git diff --cached --quiet || git commit -m "chore: increment docs-sync failure count to $new_count [skip ci]"

      - name: Push failure count update
        if: always()
        run: |
          if ! git diff --quiet origin/main --; then
            git push origin main
          fi