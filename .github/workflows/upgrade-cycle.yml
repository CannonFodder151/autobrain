# AUT-364: 2-day automated upgrade cycle.
# Runs every 2 days. Checks for new commits on main. If updates exist:
#   builds Docker containers (dockerhub-publish.yml),
#   builds mobile apps Android+iOS (sync-mobile.yml -> release-mobile.yml / release-ios.yml),
#   uploads to stores (mobile release workflows),
#   notifies Discord #deployments with evidence links.
# Skips if no new commits since the last processed SHA.
name: Upgrade cycle (2-day)

on:
  schedule:
    - cron: '0 0 */2 * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: upgrade-cycle-${{ github.ref }}
  cancel-in-progress: false

jobs:
  cycle:
    runs-on: [self-hosted, linux, x64, vm2]
    timeout-minutes: 30
    steps:
      - name: Checkout main + marker branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main

      - name: Fetch marker branch
        run: |
          set -euo pipefail
          git fetch origin upgrade-cycle-marker 2>/dev/null || true
          git branch -r | grep -q "upgrade-cycle-marker" && \
            git checkout -b upgrade-cycle-marker origin/upgrade-cycle-marker || \
            git checkout -b upgrade-cycle-marker

      - name: Resolve last processed commit
        id: last
        run: |
          set -euo pipefail
          if [ -f .upgrade-cycle-last-commit ]; then
            LAST="$(tr -d '[:space:]' < .upgrade-cycle-last-commit)"
            # Validate LAST is a full SHA (40 hex chars) — reject malformed marker
            if ! [[ "$LAST" =~ ^[0-9a-f]{40}$ ]]; then
              echo "Invalid marker SHA, treating as empty" >&2
              LAST=""
            fi
          else
            LAST=""
          fi
          HEAD="$(git rev-parse HEAD)"
          echo "last=$LAST" >> "$GITHUB_OUTPUT"
          echo "head=$HEAD" >> "$GITHUB_OUTPUT"
          if [ -n "$LAST" ] && [ "$LAST" = "$HEAD" ]; then
            echo "has_updates=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_updates=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build evidence links
        id: evidence
        if: steps.last.outputs.has_updates == 'true'
        env:
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          LAST_SHA: ${{ steps.last.outputs.last }}
          HEAD_SHA: ${{ steps.last.outputs.head }}
        run: |
          set -euo pipefail
          RUN_URL="https://github.com/${REPO}/actions/runs/${RUN_ID}"
          COMMIT_URL="https://github.com/${REPO}/commit/${HEAD_SHA}"
          if [ -n "${LAST_SHA}" ]; then
            COMPARE_URL="https://github.com/${REPO}/compare/${LAST_SHA}...${HEAD_SHA}"
          else
            COMPARE_URL="https://github.com/${REPO}/commits/${HEAD_SHA}"
          fi
          DOCKER_URL="https://github.com/${REPO}/actions/workflows/dockerhub-publish.yml"
          MOBILE_URL="https://github.com/${REPO}/actions/workflows/sync-mobile.yml"
          DEPLOY_URL="https://github.com/${REPO}/actions/workflows/deploy-instances.yml"

          echo "run_url=$RUN_URL" >> "$GITHUB_OUTPUT"
          echo "compare_url=$COMPARE_URL" >> "$GITHUB_OUTPUT"
          echo "commit_url=$COMMIT_URL" >> "$GITHUB_OUTPUT"
          echo "docker_url=$DOCKER_URL" >> "$GITHUB_OUTPUT"
          echo "mobile_url=$MOBILE_URL" >> "$GITHUB_OUTPUT"
          echo "deploy_url=$DEPLOY_URL" >> "$GITHUB_OUTPUT"

      - name: Skip if no new commits
        if: steps.last.outputs.has_updates == 'false'
        run: |
          set -euo pipefail
          echo "No new commits on main since ${LAST:-none} — skipping upgrade cycle."
          curl -s -X POST -H "Content-Type: application/json" \
            -d '{"embeds":[{"title":"Upgrade cycle — skipped","description":"No new commits on main. Nothing to build or deploy.\n\nIssue: AUT-373","color":3447003,"timestamp":"'$(date -u +%Y-%m-%dT%H:%M:%SZ)'"}]}' \
            "${{ secrets.DISCORD_REPORT_WEBHOOK }}" 2>&1 || true

      - name: Publish Docker images
        if: steps.last.outputs.has_updates == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          $(command -v gh) workflow run dockerhub-publish.yml --repo ${{ github.repository }} --ref main
          echo "dispatched dockerhub-publish.yml"

      - name: Sync mobile + trigger mobile release (Android/iOS)
        if: steps.last.outputs.has_updates == 'true'
        env:
          GH_TOKEN: ${{ secrets.MOBILE_SYNC_TOKEN }}
        run: |
          set -euo pipefail
          $(command -v gh) workflow run sync-mobile.yml --repo ${{ github.repository }} --ref main
          echo "dispatched sync-mobile.yml (builds Android+iOS, uploads to stores)"

      - name: Deploy instances
        if: steps.last.outputs.has_updates == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          $(command -v gh) workflow run deploy-instances.yml --repo ${{ github.repository }} --ref main 2>&1 || echo "deploy-instances dispatch skipped (may require manual)"
          echo "dispatched deploy-instances.yml"

      - name: Record last processed commit
        if: steps.last.outputs.has_updates == 'true'
        run: |
          set -euo pipefail
          echo "${{ steps.last.outputs.head }}" > .upgrade-cycle-last-commit
          git config user.name "AutoBrain Upgrade Cycle"
          git config user.email "upgrade@autobrainservice.app"
          git add .upgrade-cycle-last-commit
          git commit -m "chore: record upgrade cycle last commit ${{ steps.last.outputs.head }} [skip ci]" || true
          git push origin upgrade-cycle-marker --force-with-lease || git push origin HEAD:upgrade-cycle-marker

      - name: Notify Discord #deployments
        if: steps.last.outputs.has_updates == 'true'
        env:
          RUN_URL: ${{ steps.evidence.outputs.run_url }}
          COMPARE_URL: ${{ steps.evidence.outputs.compare_url }}
          COMMIT_URL: ${{ steps.evidence.outputs.commit_url }}
          DOCKER_URL: ${{ steps.evidence.outputs.docker_url }}
          MOBILE_URL: ${{ steps.evidence.outputs.mobile_url }}
          DEPLOY_URL: ${{ steps.evidence.outputs.deploy_url }}
          HEAD_SHA: ${{ steps.last.outputs.head }}
          LAST_SHA: ${{ steps.last.outputs.last }}
          RUN_NUMBER: ${{ github.run_number }}
          ISSUE_ID: AUT-497
        run: |
          set -euo pipefail
          SHORT_HEAD="${HEAD_SHA:0:7}"
          if [ -n "${LAST_SHA}" ]; then
            SHORT_LAST="${LAST_SHA:0:7}"
            COMPARE_LABEL="${SHORT_LAST}...${SHORT_HEAD}"
          else
            COMPARE_LABEL="commits@${SHORT_HEAD}"
          fi
          DESCRIPTION=$(printf '%s\n' \
            "New commits detected on main. Docker images published, mobile apps (Android+iOS) building + uploading to stores, instances upgrading." \
            "Last commit: [${SHORT_HEAD}](${COMMIT_URL})" \
            "Compare: [${COMPARE_LABEL}](${COMPARE_URL})" \
            "Workflow run: [#${RUN_NUMBER}](${RUN_URL})" \
            "Docker build: [dockerhub-publish.yml](${DOCKER_URL})" \
            "Mobile build: [sync-mobile.yml](${MOBILE_URL})" \
            "Deploy: [deploy-instances.yml](${DEPLOY_URL})" \
            "" \
            "Issue: ${ISSUE_ID}")
          curl -s -X POST -H "Content-Type: application/json" \
            -d "$(jq -n --arg title "Upgrade cycle — deployed" --arg desc "$DESCRIPTION" --arg color "10181046" --arg timestamp "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              '{embeds: [{title: $title, description: $desc, color: ($color|tonumber), timestamp: $timestamp, footer: {text: "AutoBrain Paperclip"}}]}')" \
            "${{ secrets.DISCORD_REPORT_WEBHOOK }}" 2>&1 || true