# AUT-293: 2-day automated upgrade cycle.
# Runs every 2 days. Checks for new commits on main. If updates exist:
#   builds Docker containers (dockerhub-publish.yml),
#   builds mobile apps Android+iOS (sync-mobile.yml -> release-mobile.yml / release-ios.yml),
#   uploads to stores (mobile release workflows),
#   notifies Discord #deployments.
# Skips if no new commits since the last processed SHA.
name: Upgrade cycle (2-day)

on:
  schedule:
    - cron: '0 0 */2 * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: upgrade-cycle-${{ github.ref }}
  cancel-in-progress: false

jobs:
  cycle:
    runs-on: [self-hosted, linux, x64, vm2]
    timeout-minutes: 30
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve last processed commit
        id: last
        run: |
          set -euo pipefail
          if [ -f .upgrade-cycle-last-commit ]; then
            LAST="$(tr -d '[:space:]' < .upgrade-cycle-last-commit)"
          else
            LAST=""
          fi
          HEAD="$(git rev-parse HEAD)"
          echo "last=$LAST" >> "$GITHUB_OUTPUT"
          echo "head=$HEAD" >> "$GITHUB_OUTPUT"
          if [ -n "$LAST" ] && [ "$LAST" = "$HEAD" ]; then
            echo "has_updates=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_updates=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip if no new commits
        if: steps.last.outputs.has_updates == 'false'
        run: |
          set -euo pipefail
          echo "No new commits on main since ${LAST:-none} — skipping upgrade cycle."
          /usr/bin/node /app/discord_poster.js deployments "Upgrade cycle — skipped" "No new commits on main. Nothing to build or deploy." 0x3498DB AUT-293 2>&1 || true

      - name: Publish Docker images
        if: steps.last.outputs.has_updates == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh workflow run dockerhub-publish.yml --repo ${{ github.repository }} --ref main
          echo "dispatched dockerhub-publish.yml"

      - name: Sync mobile + trigger mobile release (Android/iOS)
        if: steps.last.outputs.has_updates == 'true'
        env:
          GH_TOKEN: ${{ secrets.MOBILE_SYNC_TOKEN }}
        run: |
          set -euo pipefail
          gh workflow run sync-mobile.yml --repo ${{ github.repository }} --ref main
          echo "dispatched sync-mobile.yml (builds Android+iOS, uploads to stores)"

      - name: Deploy instances
        if: steps.last.outputs.has_updates == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh workflow run deploy-instances.yml --repo ${{ github.repository }} --ref main 2>&1 || echo "deploy-instances dispatch skipped (may require manual)"
          echo "dispatched deploy-instances.yml"

      - name: Record last processed commit
        if: steps.last.outputs.has_updates == 'true'
        run: |
          set -euo pipefail
          echo "${{ steps.last.outputs.head }}" > .upgrade-cycle-last-commit
          git config user.name "AutoBrain Upgrade Cycle"
          git config user.email "upgrade@autobrainservice.app"
          git add .upgrade-cycle-last-commit
          git commit -m "chore: record upgrade cycle last commit ${{ steps.last.outputs.head }} [skip ci]" || true
          git push origin main || true

      - name: Notify Discord #deployments
        if: steps.last.outputs.has_updates == 'true'
        run: |
          set -euo pipefail
          /usr/bin/node /app/discord_poster.js deployments "Upgrade cycle — deployed" "New commits detected on main. Docker images published, mobile apps (Android+iOS) building + uploading to stores, instances upgrading. Last commit: ${{ steps.last.outputs.head }}." 0x9B59B6 AUT-293 2>&1 || true