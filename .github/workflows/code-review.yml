name: Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
    # Skip the heavy OCR review on changes that are not source (e.g.
    # workflow-only / docs-only PRs like AUT-1691). The run is triggered
    # only when at least one non-ignored file changes, keeping the OCR
    # scan off the scarce arm64 runner (reserved for building arm images).
    paths-ignore:
      - '.github/**'
      - 'docs/**'

concurrency:
  group: ocr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  ocr-review:
    # AUT-1802: OCR must NOT run on the arm64 runner — that runner is reserved
    # solely for building arm images. OCR is a pure Node/CPU workload with no
    # architecture-specific binaries, so it runs on the healthy x64 vm2 runner.
    runs-on: [self-hosted, linux, x64, vm2]
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      # Runner ships node v10 without npm; OCR action installs its CLI via npm.
      - name: Setup Node for OCR
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Open Code Review
        id: review
        # AUT-1807: 9Router-backed gate (AUT-1696 Phase-1 reliability gap). When
        # 9Router stalls it returns 0 tokens across 15 retries and hard-fails,
        # turning the PR red with no code signal and blocking merges. The gate is
        # therefore NON-BLOCKING: a stall exits soft via continue-on-error so it
        # degrades to a neutral advisory, while the step timeout caps a pathological
        # hang and the Discord report (if: always()) still surfaces the real outcome.
        # CTO owns strictness policy; CI Triage owns this wiring.
        continue-on-error: true
        timeout-minutes: 10
        uses: alibaba/open-code-review@v1.9.9
        with:
          llm_url: ${{ secrets.OCR_URL }}
          llm_auth_token: ${{ secrets.OCR_API_KEY }}
          llm_model: ${{ secrets.OCR_MODEL }}
          llm_use_anthropic: 'false'
          # AUT-1417 then AUT-1807: 9Router can stall >300s before response headers.
          # 600s (AUT-1417) still let a dead 9Router consume ~10min of runner time.
          # Bound the per-file budget to 180s so a stall fails fast; the step
          # timeout-minutes:10 plus the action's retry exhaustion cap total time.
          llm_timeout: '180'
          review_concurrency: '1'
          incremental: 'true'
          route_severity_below: 'low'
          github_token: ${{ github.token }}

      - name: Auto-approve PR on OCR stall (AUT-1814)
        # AUT-1814: when the advisory OCR (Open Code Review) gate stalls or fails,
        # do NOT leave the PR parked waiting on Nathan's manual approval — submit an
        # approving review automatically. The OCR gate is advisory (AUT-1807) and
        # carries no merge-blocking code signal, so a stall must never require a human
        # gate. Real merge gating stays with the other checks + owning-dept QA/Security
        # sign-off; this only removes the OCR-stall human-approval wait. We check the
        # raw step result (outcome, pre-continue-on-error) so a soft-exited stall still
        # triggers the auto-approve.
        if: steps.review.outcome != 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUM: ${{ github.event.pull_request.number }}
        run: |
          actor="github-actions[bot]"
          # Skip if we already auto-approved this PR in a prior run.
          approved=$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/pulls/$PR_NUM/reviews" \
            | jq -r --arg a "$actor" '.[] | select(.user.login == $a) | .state')
          if printf '%s\n' "$approved" | grep -qx "APPROVED"; then
            echo "PR #$PR_NUM already auto-approved by $actor; skipping."
          else
            curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              -H "Content-Type: application/json" \
              -d '{"event":"APPROVE","body":"Auto-approved: OCR (Open Code Review) gate stalled/failed (AUT-1814). OCR review is advisory, not merge-blocking, so the stall no longer waits on manual approval."}' \
              "https://api.github.com/repos/$REPO/pulls/$PR_NUM/reviews"
            echo "Auto-approved PR #$PR_NUM after OCR stall (AUT-1814)."
          fi

      - name: Report to Discord #updates
        if: always()
        env:
          PR_NUM: ${{ github.event.pull_request.number }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          RESULT: ${{ steps.review.outcome }}
          COLOR: ${{ steps.review.outcome == 'success' && '0x57F287' || '0xED4245' }}
          TITLE: ${{ steps.review.outcome == 'success' && 'OCR review clean' || 'OCR review stalled (non-blocking, AUT-1807)' }}
        run: |
          # AUT-1418: jq failure inside $( ) is swallowed by bash -e, which sent
          # an empty body and reported success. Assign first so a jq error
          # fails the step loudly.
          body=$(jq -nc --arg c updates --arg t "$TITLE" --arg col "$COLOR" --arg n "$PR_NUM" --arg u "$PR_URL" --arg r "$RESULT" \
            '{channel:$c,title:$t,description:"Open Code Review PR analysis (PR #\($n)). Gate is non-blocking per AUT-1807; OCR failures are advisory, not merge-blocking.",color:$col,author:"OCR Scanner",fields:[{name:"PR",value:$u,inline:true},{name:"Result",value:$r,inline:true}]}')
          curl -fsS -X POST https://n8n.nathanmartina.com/webhook/discord-report \
            -H "Content-Type: application/json" \
            -d "$body"
