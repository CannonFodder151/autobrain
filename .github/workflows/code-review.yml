name: Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
    # Skip the heavy OCR review on changes that are not source (e.g.
    # workflow-only / docs-only PRs like AUT-1691). The run is triggered
    # only when at least one non-ignored file changes, keeping the arm64
    # runner busy only for reviews that have real code to scan.
    paths-ignore:
      - '.github/**'
      - 'docs/**'

concurrency:
  group: ocr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  ocr-review:
    # Routed to the idle arm64 runner (Phase 1(a)): OCR is a pure Node/CPU
    # workload with no architecture-specific binaries, so it does not need
    # the x64 runner that builds amd64 images. Frees x64 for PR-check jobs.
    runs-on: [self-hosted, Linux, ARM64]
    permissions:
      contents: read
      pull-requests: write
      issues: write
    # AUT-1807: OCR is a 9Router-backed AI gate (AUT-1696 Phase-1 reliability
    # gap). When 9Router stalls it returns 0 tokens across 15 retries and hard-
    # fails this job, turning the PR red with no code signal and blocking
    # merges. The gate is therefore NON-BLOCKING: a stall degrades to a neutral
    # advisory (OCR step exits soft via continue-on-error) while the Discord
    # report still surfaces the real outcome. CTO owns strictness policy; CI
    # Triage owns this wiring.
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      # Runner ships node v10 without npm; OCR action installs its CLI via npm.
      - name: Setup Node for OCR
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Open Code Review
        id: review
        # AUT-1807: never let a 9Router stall hard-fail the run / block merges.
        # A failure (timeout, provider error, 0 tokens) exits soft via
        # continue-on-error so the job is advisory-green; the step-level
        # timeout-minutes caps a pathological stall; Discord still reports red.
        continue-on-error: true
        timeout-minutes: 10
        uses: alibaba/open-code-review@v1.9.9
        with:
          llm_url: ${{ secrets.OCR_URL }}
          llm_auth_token: ${{ secrets.OCR_API_KEY }}
          llm_model: ${{ secrets.OCR_MODEL }}
          llm_use_anthropic: 'false'
          # AUT-1417 then AUT-1807: 9Router can stall well past 300s before
          # response headers. 600s (AUT-1417) still let a dead 9Router consume
          # ~10min of runner time. Shorten the per-file budget to 180s so a
          # stall fails fast; the retry guard is bounded by timeout-minutes:10
          # plus the action's internal retry exhaustion.
          llm_timeout: '180'
          review_concurrency: '1'
          incremental: 'true'
          route_severity_below: 'low'
          github_token: ${{ github.token }}

      - name: Report to Discord #updates
        if: always()
        env:
          PR_NUM: ${{ github.event.pull_request.number }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          RESULT: ${{ steps.review.outcome }}
          COLOR: ${{ steps.review.outcome == 'success' && '0x57F287' || '0xED4245' }}
          TITLE: ${{ steps.review.outcome == 'success' && 'OCR review clean' || 'OCR review stalled (non-blocking, AUT-1807)' }}
        run: |
          # AUT-1418: jq failure inside $( ) is swallowed by bash -e, which sent
          # an empty body and reported success. Assign first so a jq error
          # fails the step loudly.
          body=$(jq -nc --arg c updates --arg t "$TITLE" --arg col "$COLOR" --arg n "$PR_NUM" --arg u "$PR_URL" --arg r "$RESULT" \
            '{channel:$c,title:$t,description:"Open Code Review PR analysis (PR #\($n)). Gate is non-blocking per AUT-1807; OCR failures are advisory, not merge-blocking.",color:$col,author:"OCR Scanner",fields:[{name:"PR",value:$u,inline:true},{name:"Result",value:$r,inline:true}]}')
          curl -fsS -X POST https://n8n.nathanmartina.com/webhook/discord-report \
            -H "Content-Type: application/json" \
            -d "$body"
