# AUT-1746: x64 jobs (gitleaks, trivy config, pip-audit) dispatch to the bare
# x64 self-hosted runner; the flutter osv-scanner job uses the vm2 x64 runner
# (AUT-1798/AUT-1802). This is the missing PR/push-time security gate called for
# in AUT-1746: a pre-merge gate that blocks on findings so the CVEs /
# misconfigurations from the review cannot recur silently.
name: Security — PR gate (secrets, IaC, deps, flutter)

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# The two nginx guards below are path-filtered: they only need to run when the
# trust boundary (docker/frontend/*.conf) or the guard itself changes. A stale
# Cloudflare range list is inert (the real peer is the docker-bridge proxy), so
# the drift check must not silently skip on an unrelated PR.

# Digest-pinned frontend nginx image — same pin as trivy-image-scan.yml; the
# `nginx -t` job validates config syntax against the image that actually ships.
env:
  NGINX_FRONTEND_IMAGE: 'nginxinc/nginx-unprivileged:stable-alpine@sha256:ed04ec1ff34502c339ee5c3ae3f855442398edc1d05591e2b98981dcbbd20b1e'

# Never let two runs of the same ref race; newest wins (same pattern as the
# other security workflows).
concurrency:
  group: security-pr-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # (2) gitleaks detect on every PR — block on findings (AUT-1746).
  # Runs gitleaks directly (not the gitleaks-action) so the gate depends only on
  # the checked-out `.gitleaks.toml` config, not on extra tokens/SARIF perms.
  #
  # AUT-5531: PR runs scan only the commit range under review
  # (`pull_request.base.sha..HEAD`). gitleaks' default (no --log-opts)
  # scans every fetched ref, so a secret on ANY branch failed every
  # unrelated open PR — observed 2026-10-04 when PR #900 failed purely
  # on commit d744758 from PR #899's branch. A leak now blocks only the
  # branch that introduced it; push-to-main sweeps main's full history,
  # and workflow_dispatch remains the on-demand all-refs sweep, so any
  # leak that reaches main is caught the moment it lands.
  gitleaks:
    name: Gitleaks — secret detection
    runs-on: [self-hosted, linux, x64]
    outputs:
      findings: ${{ steps.report.outputs.count }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the PR range needs the base sha, and the
          # push-to-main full-history sweep needs every commit.
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sfL https://github.com/gitleaks/gitleaks/releases/download/v8.18.1/gitleaks_8.18.1_linux_x64.tar.gz \
            | tar xz -C "$HOME/.local/bin" gitleaks
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Gitleaks detect — fail on any finding
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -uo pipefail
          REPORT="gitleaks-report.json"
          LOG_OPTS=()
          if [ "$EVENT_NAME" = "pull_request" ]; then
            # AUT-5531: scope the scan to the commits this PR introduces.
            # If the base sha cannot be resolved, fall back to the wider
            # full-history scan — the gate must never scan narrower than
            # intended (fail-closed for coverage).
            if [ -n "${PR_BASE_SHA:-}" ] && git rev-parse --verify --quiet "${PR_BASE_SHA}^{commit}" >/dev/null; then
              LOG_OPTS=(--log-opts="${PR_BASE_SHA}..HEAD")
            else
              echo "::warning::PR base ${PR_BASE_SHA:-<unset>} not resolvable; running full-history scan instead"
            fi
          elif [ "$EVENT_NAME" = "push" ]; then
            # Push to main: full history of main (every commit reachable
            # from HEAD), so pre-existing main leaks still surface
            # (AUT-5531 AC2). Scoped to main rather than all refs on
            # purpose — an unmerged branch's leak must not block main
            # pushes; that branch is blocked on its own PR, and the
            # all-refs sweep stays available via workflow_dispatch.
            LOG_OPTS=(--log-opts="HEAD")
          fi
          # workflow_dispatch: no --log-opts → all-refs sweep of the whole
          # repo, for on-demand incident triage. --redact keeps raw secret
          # values out of logs and the report.
          rc=0
          gitleaks detect --source=. --config=.gitleaks.toml --redact --exit-code 1 \
            ${LOG_OPTS[@]+"${LOG_OPTS[@]}"} \
            --report-format json --report-path "$REPORT" || rc=$?
          # rc 1 = findings (detailed by the report step); any other
          # non-zero exit is a real failure and fails the step as-is.
          exit "$rc"
      - name: Emit gitleaks findings report (AUT-5531)
        if: always()
        id: report
        run: |
          set -uo pipefail
          if [ ! -s gitleaks-report.json ]; then
            echo "count=0" >> "$GITHUB_OUTPUT"
            echo "gitleaks: no findings"
            exit 0
          fi
          python3 - gitleaks-report.json <<'PY'
          import json, os, sys
          findings = json.load(open(sys.argv[1]))

          def cell(v):
              # Untrusted git metadata (filenames, authors): strip control
              # chars so a crafted finding cannot forge annotation lines in
              # the log or inject rows into the step-summary table.
              return "".join(c if c.isprintable() else " " for c in str(v))[:200]

          # One ::error annotation per finding → clickable file/line in the
          # PR checks UI. Secrets are already redacted (--redact), so the
          # annotation, summary, and report never carry raw secret values.
          for f in findings:
              print("::error file={},line={}::gitleaks [{}] commit {} by {} — {}".format(
                  cell(f.get("File", "?")), f.get("StartLine", 0), cell(f.get("RuleID", "?")),
                  f.get("Commit", "?")[:12], cell(f.get("Author", "?")), cell(f.get("Fingerprint", "?"))))
          lines = ["## Gitleaks findings — %d leak(s)" % len(findings), "",
                   "| Rule | File:Line | Commit | Author | Fingerprint |",
                   "| --- | --- | --- | --- | --- |"]
          for f in findings:
              lines.append("| %s | %s:%s | `%s` | %s | `%s` |" % (
                  cell(f.get("RuleID", "")), cell(f.get("File", "")), f.get("StartLine", ""),
                  f.get("Commit", "")[:12], cell(f.get("Author", "")), cell(f.get("Fingerprint", ""))))
          md = "\n".join(lines) + "\n"
          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary, "a") as fh:
                  fh.write(md)
          else:
              print(md)
          gh_out = os.environ.get("GITHUB_OUTPUT")
          if gh_out:
              with open(gh_out, "a") as fh:
                  fh.write("count=%d\n" % len(findings))
          PY
      - name: Upload gitleaks report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks-report.json
          if-no-files-found: ignore

  # (4) trivy config (misconfig) on every Dockerfile build target (AUT-1746).
  # Fails on HIGH/CRITICAL misconfig. NOTE: trivy 0.74 has no docker-compose
  # misconfig scanner, and `docker compose config` is stricter than the runtime
  # (it false-errors on the working dev/hosted stacks), so compose misconfig is
  # NOT structurally gated here. Compose-referenced images (postgres, minio,
  # 9router) are still covered by the existing trivy-image-scan.yml +
  # security-scan.yml pin/image guards. Revisit when trivy ships compose support.
  trivy-config:
    name: Trivy config — Dockerfile misconfig
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v4
      - name: Install trivy
        run: |
          # Self-hosted runners may run as a non-root user; /usr/local/bin is
          # not writable there (trivy-image-scan.yml sidesteps this via the
          # trivy-action). Install to a user-writable bin and put it on PATH.
          mkdir -p "$HOME/.local/bin"
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sh -s -- -b "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: trivy config — Dockerfile build targets (HIGH/CRITICAL, exit 1)
        run: |
          set -euo pipefail
          fail=0
          for f in \
            docker/frontend/Dockerfile \
            docker/backend/Dockerfile \
            docker/ai/Dockerfile \
            docker/worker/Dockerfile \
            market-data/Dockerfile; do
            echo "==> trivy config $f"
            trivy config --severity HIGH,CRITICAL --exit-code 1 "$f" || fail=1
          done
          exit $fail

  # (3) pip-audit on requirements.txt — extend the existing PR-time gate to cover
  # market-data too (the dockerhub-publish pip-audit-gate only covers backend+ai).
  # Two passes per requirements file:
  #   * direct-deps (`--no-deps`) — fast, only flags exact-pinned versions with
  #     a published CVE. Catches "I pinned a vulnerable direct dep" in CI seconds.
  #   * resolved-tree — installs into a throwaway venv then audits it. Catches
  #     *transitive* CVE drift in transitively-resolved packages (AUT-1189:
  #     idna / pycryptodome / pygments, unpinned at build time so any upstream
  #     constraint shift can land a vulnerable transitive in the built image).
  # market-data is a separate tree and is audited on its own.
  #
  # The resolved-tree pass dispatches to the vm2 runner because pip-audit
  # needs `python3 -m venv` to build a throwaway venv for transitive
  # resolution; the legacy x64 runner (where the rest of this PR gate runs)
  # is not guaranteed to have python3-venv. The vm2 runner is already used by
  # security-scan.yml for the same reason, so we know it works.
  pip-audit-direct:
    name: pip-audit — python dependency CVEs (direct deps)
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v4
      - name: Install pip-audit (+ packaging for PEP 440 version compare in the direct-deps dedup pass)
        run: |
          python3 -m pip --version 2>/dev/null || \
            curl -sS https://bootstrap.pypa.io/get-pip.py | PIP_BREAK_SYSTEM_PACKAGES=1 python3 -
          PIP_BREAK_SYSTEM_PACKAGES=1 python3 -m pip install --quiet pip-audit
      - name: Direct-deps pass — fail on known-vuln pinned deps
        run: |
          set -euo pipefail
          # Concat backend + ai + market-data. Dedupe by package name (keep
          # highest version: stricter cap on a direct dep means tighter audit)
          # so backend/ai (pydantic 2.10.4) and market-data (pydantic 2.13.4)
          # don't trip the duplicate-line reject.
          TMPREQ="$(mktemp)"
          python3 - > "$TMPREQ" <<'PY'
          import re
          from packaging.version import Version  # transitive dep of pip-audit
          pkgs = {}
          float_re = re.compile(r'^([A-Za-z0-9_.+\-]+)\s*(>=|<=|==|!=|~=|>|<)\s*([^\s#]+)(?:\s*#\s*(.*))?$')
          for f in ('backend/requirements.txt', 'ai/requirements.txt', 'market-data/requirements.txt'):
              for line in open(f):
                  line = line.strip()
                  if not line or line.startswith('#'):
                      continue
                  m = float_re.match(line)
                  if not m:
                      continue
                  name, op, ver, comment = m.group(1), m.group(2), m.group(3), m.group(4)
                  if op != '==':
                      continue
                  cur = pkgs.get(name)
                  if cur is None or Version(ver) > Version(cur[0]):
                      pkgs[name] = (ver, comment or '')
          for name in sorted(pkgs):
              ver, comment = pkgs[name]
              out = f"{name}=={ver}"
              if comment:
                  out += f"  # {comment}"
              print(out)
          PY
          python3 -m pip_audit --disable-pip --no-deps -r "$TMPREQ"
          rm -f "$TMPREQ"

  # (3b) resolved-tree pass — fail on transitive CVE drift (AUT-1189).
  # Each service resolves its own tree (backend/ai vs market-data pin
  # different fastapi major versions and cannot share a venv).
  # virtualenv bundles pip so it works without ensurepip / python3-venv
  # on the vm2 runner (AUT-2947). Install deps into a per-service venv,
  # then run pip-audit --local against the installed set — no internal
  # venv creation, no ensurepip needed.
  pip-audit-resolved:
    name: pip-audit — resolved tree (transitive CVE drift, AUT-1189)
    runs-on: [self-hosted, linux, x64, vm2]
    steps:
      - uses: actions/checkout@v4
      - name: Install virtualenv + pip-audit
        run: |
          python3 -m pip --version 2>/dev/null || \
            curl -sS https://bootstrap.pypa.io/get-pip.py | PIP_BREAK_SYSTEM_PACKAGES=1 python3 -
          PIP_BREAK_SYSTEM_PACKAGES=1 python3 -m pip install --quiet virtualenv pip-audit
      - name: Resolved-tree pass — fail on transitive CVE drift (AUT-1189)
        run: |
          set -euo pipefail
          for req in backend/requirements.txt ai/requirements.txt market-data/requirements.txt; do
            svc="$(echo "$req" | cut -d/ -f1)"
            echo "==> creating venv and installing $svc deps"
            python3 -m virtualenv "/tmp/audit-${svc}"
            "/tmp/audit-${svc}/bin/pip" install --quiet -r "$req"
            # pip-audit isn't installed inside the venv by default — install it
            # per-service so /tmp/audit-${svc}/bin/pip-audit resolves (AUT-2947).
            "/tmp/audit-${svc}/bin/pip" install --quiet pip-audit
            echo "==> auditing $svc (resolved tree)"
            "/tmp/audit-${svc}/bin/pip-audit" --local
            rm -rf "/tmp/audit-${svc}"
          done

  # (5) Flutter/Dart dependency vulnerability scan (AUT-2066).
  # `flutter pub audit` and `dart pub audit` do not exist on current Flutter/Dart
  # stable — the subcommand was never shipped, so every PR was failing this step
  # regardless of diff content (blocking AUT-1899 and any other PR that touched
  # `frontend/`). Use osv-scanner against `pubspec.lock` (the canonical
  # ecosystem-aware vuln source for Dart/Flutter), gated to fail on HIGH/CRITICAL.
  flutter-audit:
    name: Flutter — osv-scanner (pubspec.lock)
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          # AUT-2985: disable pub-cache to avoid stale tar restore creating
          # doubled .pub-cache/hosted/hosted/ paths that break flutter pub get.
          cache: false
      - name: flutter pub get (frontend)
        working-directory: frontend
        run: |
          set -euo pipefail
          flutter pub get
      - name: Install osv-scanner
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          # AUT-2312: v1.7.3's asset name was `osv-scanner_linux_amd64`, not the
          # `osv-scanner_1.7.3_linux_amd64` filename this step used (404).
          # Pin v1.9.2 with the correct asset name; bump deliberately when ready.
          OSV_VER="1.9.2"
          curl -sfL "https://github.com/google/osv-scanner/releases/download/v${OSV_VER}/osv-scanner_linux_amd64" \
            -o "$HOME/.local/bin/osv-scanner"
          chmod +x "$HOME/.local/bin/osv-scanner"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: osv-scanner — fail on any finding
        working-directory: frontend
        run: |
          set -euo pipefail
          # v1.x CLI: `osv-scanner scan` is the v1 entrypoint; v1.x exits
          # non-zero automatically on any finding (no `--exit-code` flag in v1).
          osv-scanner scan --format=table --lockfile=pubspec.lock

  # (6a) AUT-2390 compose-config-diff — prevent AUT-1964 typo recurrence.
  # When a PR touches any `docker-compose*.yml`, run `docker compose config`
  # on the PR version (with `.env.example` stubbed in for required vars) and
  # on the main-branch version, extract the set of env-var keys referenced
  # by each, and block the PR on any key rename (e.g. AUTOBRIAN_BACKEND_URL
  # -> AUTOBRAIN_BACKEND_URL) or new key that is not declared in
  # `.env.example`. A renamed key is silent at deploy time — the new name
  # interpolates empty, the old name keeps its value, and nothing breaks
  # until production hits the empty field.
  compose-config-diff:
    name: "Compose config diff — env-var rename detector (AUT-2390)"
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect modified docker-compose files
        id: detect
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || 'origin/main' }}
        run: |
          set -euo pipefail
          # Only run when the PR actually changes a compose file; otherwise
          # pass (empty list). On push to main we run unconditionally.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            mapfile -t CHANGED < <(git diff --name-only "$BASE_REF"...HEAD -- 'docker-compose*.yml' || true)
          else
            mapfile -t CHANGED < <(git diff --name-only HEAD~1...HEAD -- 'docker-compose*.yml' || true)
          fi
          if [ ${#CHANGED[@]} -eq 0 ]; then
            echo "changed=" >> "$GITHUB_OUTPUT"
            echo "no compose files changed; skipping"
            exit 0
          fi
          {
            printf 'changed<<EOF\n'
            printf '%s\n' "${CHANGED[@]}"
            printf 'EOF\n'
          } >> "$GITHUB_OUTPUT"
      - name: Install docker compose
        if: steps.detect.outputs.changed != ''
        run: |
            set -euo pipefail
            # Ensure docker compose plugin exists; install to user plugin dir if missing.
            if ! docker compose version >/dev/null 2>&1; then
              mkdir -p "$HOME/.docker/cli-plugins"
              curl -fL https://github.com/docker/compose/releases/download/v2.27.1/docker-compose-linux-x86_64 -o "$HOME/.docker/cli-plugins/docker-compose"
              chmod +x "$HOME/.docker/cli-plugins/docker-compose"
            fi
            docker compose version
      - name: Build a stub .env for compose interpolation
        if: steps.detect.outputs.changed != ''
        run: |
          set -euo pipefail
          # .env.example keys, stubbed with safe placeholder values so
          # `docker compose config` can interpolate `${VAR}` and
          # `${VAR:?...}` references without erroring. Values are never
          # read by this gate — only key names matter.
          : > .env.ci
          while IFS= read -r line; do
            # Skip comments / blanks.
            case "$line" in ''|\#*) continue ;; esac
            # Take only the first `=` so values with `=` survive.
            key="${line%%=*}"
            case "$key" in
              # Secrets/digests stay empty in the stub; we're not running
              # the stack, only resolving the compose graph.
              *) printf '%s=ci-stub\n' "$key" >> .env.ci ;;
            esac
          done < .env.example
          echo "--- .env.ci keys ---"
          cut -d= -f1 .env.ci | sort
          # docker-compose.prod.yml declares env_file: .env — mirror the stub
          # so docker compose config can resolve both --env-file and env_file:.
          cp .env.ci .env
      - name: Compose config diff vs main
        if: steps.detect.outputs.changed != ''
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || 'origin/main' }}
        run: |
          set -euo pipefail
          CHANGED_FILES="${{ steps.detect.outputs.changed }}"
          # extract_env_keys <compose-rendered.yml> -> sorted unique keys
          extract_env_keys() {
            # `environment:` (map form) and inline `${VAR}` interpolations.
            # List-form environment and env_file: file paths are intentionally
            # not in scope — those are operator inputs, not key declarations.
            python3 - "$1" <<'PY'
          import re, sys, pathlib
          text = pathlib.Path(sys.argv[1]).read_text()
          keys = set()
          for m in re.finditer(r'(?m)^[ \t]*([A-Z][A-Z0-9_]*):[ \t]*[^\s#]', text):
              keys.add(m.group(1))
          for m in re.finditer(r'\$\{([A-Z][A-Z0-9_]*)', text):
              keys.add(m.group(1))
          for k in sorted(keys):
              print(k)
          PY
          }
          render() {
            local f="$1" out="$2"
            docker compose --env-file .env.ci -f "$f" config > "$out" 2>render.err
          }
          # Drive the loop without a `while | pipe` subshell so $fail
          # propagates back to the step.
          fail=0
          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            [ -f "$f" ] || continue
            echo "==> $f"
            pr_render="$tmpdir/$(basename "$f").pr"; main_render="$tmpdir/$(basename "$f").main"
            if ! render "$f" "$pr_render"; then
              echo "::error file=$f::docker compose config failed on PR version (see render.err)" >&2
              # Dump the captured compose error where the runner actually
              # records it. Do NOT pipe through `sed` in a subshell — the
              # pipe's stderr was dropped by the CI runner, so only the
              # generic ::error pointer ever showed up (AUT-3030).
              cat render.err >&2 || true
              fail=1
              continue
            fi
            git show "$BASE_REF:$f" > "$f.main" 2>/dev/null || {
              echo "::notice file=$f::new file in PR; no base to diff" >&2
              continue
            }
            if ! render "$f.main" "$main_render"; then
              echo "::notice file=$f::docker compose config failed on main version; skipping diff" >&2
              continue
            fi
            pr_keys="$(extract_env_keys "$pr_render")"
            main_keys="$(extract_env_keys "$main_render")"
            printf '%s\n' "$pr_keys"  > "$tmpdir/pr.keys"
            printf '%s\n' "$main_keys" > "$tmpdir/main.keys"
            sort -u -o "$tmpdir/pr.keys"  "$tmpdir/pr.keys"
            sort -u -o "$tmpdir/main.keys" "$tmpdir/main.keys"
            added="$(comm -13 "$tmpdir/main.keys" "$tmpdir/pr.keys" || true)"
            removed="$(comm -23 "$tmpdir/main.keys" "$tmpdir/pr.keys" || true)"
            # Rename detection: any added key with 1-edit / fuzzy match to
            # some removed key (catches AUTOBRIAN <-> AUTOBRAIN).
            if [ -n "$added" ] && [ -n "$removed" ]; then
              printf '%s\n' "$added"   > "$tmpdir/added.txt"
              printf '%s\n' "$removed" > "$tmpdir/removed.txt"
              pairs="$(python3 - "$tmpdir/added.txt" "$tmpdir/removed.txt" <<'PY'
          import difflib, sys
          added   = [l.rstrip() for l in open(sys.argv[1]) if l.strip()]
          removed = [l.rstrip() for l in open(sys.argv[2]) if l.strip()]
          for a in added:
              for r in removed:
                  if a == r: continue
                  if len(a) == len(r) and sum(x!=y for x,y in zip(a,r)) <= 2:
                      print(f"RENAME? {r} -> {a}  (1-edit)")
                  if abs(len(a)-len(r)) <= 2:
                      ratio = difflib.SequenceMatcher(None, a, r).ratio()
                      if ratio >= 0.85:
                          print(f"FUZZY   {r} -> {a}  (ratio {ratio:.2f})")
          PY
          )"
              if [ -n "$pairs" ]; then
                echo "::error file=$f::possible env-var rename detected (AUT-2390, AUT-1964):" >&2
                echo "$pairs" | sed 's/^/  /' >&2
                fail=1
              fi
            fi
            # Pure adds must exist in .env.example (so reviewers know
            # where to put the value).
            if [ -n "$added" ]; then
              cut -d= -f1 .env.example | sort -u > "$tmpdir/envex.keys"
              printf '%s\n' "$added" | grep -v '^$' | sort -u > "$tmpdir/added.uniq"
              missing="$(comm -23 "$tmpdir/added.uniq" "$tmpdir/envex.keys" || true)"
              if [ -n "$missing" ]; then
                echo "::error file=$f::new env-var keys not declared in .env.example (AUT-2390):" >&2
                echo "$missing" | sed 's/^/  /' >&2
                echo "  Add the key(s) to .env.example or split the rename clearly in the PR description." >&2
                fail=1
              fi
            fi
            rm -f "$f.main" render.err
          done <<< "$CHANGED_FILES"
          exit $fail
      - name: Result
        if: steps.detect.outputs.changed != ''
        run: |
          echo "OK: no env-var renames or undeclared keys detected (AUT-2390)."

  # (6b) AUT-1881 pin-guard — fail any compose `image:` reference that is not
  # pinned by `@sha256` digest. Complements the postgres/nginx/python pin
  # guards in trivy-image-scan.yml and ensures the floating `:hosted` /
  # `:latest` tags cannot re-appear in compose without a digest pin.
  pin-guard:
    name: "Pin guard — every compose image: must carry @sha256"
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v4
      - name: Check image references for digest pin
        run: |
          set -euo pipefail
          FILES="docker-compose.yml docker-compose.prod.yml docker-compose.hosted.yml"
          # Fail: every `image:` line in $FILES must carry an @sha256 digest,
          # use a `${VAR}` expansion (deploy-time), or follow a `build:` block
          # within the same service (locally-built image). Locally-built
          # images tag themselves `:latest` post-build, so we exempt them —
          # the supply-chain integrity for those flows from the Dockerfile
          # base digest pin (AUT-1735) and the build context.
          FLOATING="$(awk '
            FNR==1 {svc_has_build=0; svc_indent=-1}
            /^[^ #].*:/ && !/^[[:space:]]/ {svc_has_build=0}
            /^[[:space:]]+build:[[:space:]]*$/ {svc_has_build=1; svc_indent=match($0, /[^ ]/)-1}
            /^[[:space:]]+image:[[:space:]]+/ {
              cur_indent = match($0, /[^ ]/) - 1
              if (cur_indent < svc_indent) {svc_has_build=0; svc_indent=cur_indent}
              line=$0
              sub(/^[[:space:]]+image:[[:space:]]+/, "", line)
              if (line ~ /@sha256:/) next
              if (line ~ /\$\{/) next
              if (svc_has_build) next
              print FILENAME ":" FNR ": " $0
            }
          ' FILES="$FILES" $FILES)"
          if [ -n "$FLOATING" ]; then
            echo "::error::floating (non-digest) compose image: references found (AUT-1881):" >&2
            printf '%s\n' "$FLOATING" >&2
            exit 1
          fi
          echo "OK: every compose image: reference carries an @sha256 digest (AUT-1881)."

  # (7) AUT-5695: Cloudflare edge-range drift guard. The `set_real_ip_from`
  # list in docker/frontend/nginx.conf + nginx-proxy.conf is a hand-copied
  # mirror of https://www.cloudflare.com/ips-v4 + ips-v6. It already drifted
  # once on main (198.41.128.0/17 was missing) and the stale list is inert
  # because the real peer is the docker-bridge proxy — so the AUT-3858/AUT-5460
  # login lockout silently re-opens instead of failing loudly. This job diffs
  # the confs against the LIVE ranges so a stale list blocks the merge.
  cf-ips-drift-guard:
    name: "Cloudflare edge-range drift guard (AUT-5695)"
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gate — only when the trust boundary or the guard changes
        id: gate
        run: |
          set -uo pipefail
          # schedule / workflow_dispatch have no diff range — the guard must run
          # unconditionally on those triggers (that is the whole point: catch
          # drift on main), so short-circuit to run=true before the range logic.
          case "${{ github.event_name }}" in
            schedule|workflow_dispatch) echo "run=true — no diff range on this trigger" >> "$GITHUB_OUTPUT"; exit 0 ;;
          esac
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$BASE" ]; then BASE="$(git merge-base HEAD origin/main 2>/dev/null || echo HEAD~1)"; fi
          CHANGED="$(git --name-only "$BASE" "${{ github.sha }}" 2>/dev/null || true)"
          [ -z "$CHANGED" ] && CHANGED="$(git --name-only HEAD~1 HEAD 2>/dev/null || true)"
          RELEVANT="$(printf '%s\n' "$CHANGED" | grep -E '^(docker/frontend/(nginx\.conf|nginx-proxy\.conf|security-headers\.inc)|scripts/cf-ips-diff\.sh|scripts/test_cf_ips_diff\.py|backend/tests/test_aut5460_cf_real_ip\.py)' || true)"
          if [ -z "$RELEVANT" ]; then
            echo "run=false — no trust-boundary or guard changes" >&2
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"
          echo "changed: $(printf '%s\n' "$CHANGED" | tr '\n' ' ')"
      - name: Diff set_real_ip_from against live Cloudflare ranges
        if: steps.gate.outputs.run == 'true'
        run: |
          set -euo pipefail
          bash scripts/cf-ips-diff.sh

  # (8) AUT-5695: `nginx -t` against the shipped frontend image. No CI job ever
  # validated nginx config syntax, which is how a dead second copy of the trust
  # boundary (docker/frontend/nginx-proxy.conf, referenced by nothing) sat in
  # the repo for months. A syntax error, a typo'd directive, or a config that
  # no longer matches the image must fail the gate — not ship.
  nginx-config-syntax:
    name: "nginx -t against the frontend image (AUT-5695)"
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gate — only when the trust boundary or the image changes
        id: gate
        run: |
          set -uo pipefail
          # schedule / workflow_dispatch have no diff range — the syntax check
          # must run unconditionally on those triggers (catches a broken conf
          # on main before the next deploy).
          case "${{ github.event_name }}" in
            schedule|workflow_dispatch) echo "run=true — no diff range on this trigger" >> "$GITHUB_OUTPUT"; exit 0 ;;
          esac
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$BASE" ]; then BASE="$(git merge-base HEAD origin/main 2>/dev/null || echo HEAD~1)"; fi
          CHANGED="$(git --name-only "$BASE" "${{ github.sha }}" 2>/dev/null || true)"
          [ -z "$CHANGED" ] && CHANGED="$(git --name-only HEAD~1 HEAD 2>/dev/null || true)"
          RELEVANT="$(printf '%s\n' "$CHANGED" | grep -E '^(docker/frontend/|docker/frontend/Dockerfile)' || true)"
          if [ -z "$RELEVANT" ]; then
            echo "run=false — no frontend config/image changes" >&2
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"
          echo "changed: $(printf '%s\n' "$CHANGED" | tr '\n' ' ')"
      - name: Pull digest-pinned frontend nginx image
        if: steps.gate.outputs.run == 'true'
        run: |
          set -euo pipefail
          docker pull "$NGINX_FRONTEND_IMAGE"
      - name: nginx -t (config syntax + includes)
        if: steps.gate.outputs.run == 'true'
        run: |
          set -euo pipefail
          # The image's default.conf is overwritten by the repo's config; the
          # include path must match what the Dockerfile lays down, or this
          # check validates the wrong file. Run nginx -t inside the image with
          # the repo's conf + security-headers include mounted in.
          docker run --rm \
            -v "$PWD/docker/frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro" \
            -v "$PWD/docker/frontend/security-headers.inc:/etc/nginx/conf.d/security-headers.inc:ro" \
            "$NGINX_FRONTEND_IMAGE" \
            nginx -t
  report-status:
    name: Report gate result to Discord #status
    if: always()
    needs: [gitleaks, trivy-config, pip-audit-direct, pip-audit-resolved, flutter-audit, compose-config-diff, pin-guard, cf-ips-drift-guard, nginx-config-syntax]
    runs-on: [self-hosted, linux, x64]
    steps:
      - name: Report to Discord #status
        env:
          # The two AUT-5695 jobs are path-gated: on an unrelated PR they exit 0 early
# and report `skipped`, which is NOT a failure. Treat `skipped` as clean for
# these two only — every other job must be an explicit `success` (a skipped
# gitleaks run would mean the secret scan never ran, which is a real miss).
          RESULT: ${{ (needs.gitleaks.result == 'success' && needs.trivy-config.result == 'success' && needs.pip-audit-direct.result == 'success' && needs.pip-audit-resolved.result == 'success' && needs.flutter-audit.result == 'success' && needs.compose-config-diff.result == 'success' && needs.pin-guard.result == 'success' && (needs.cf-ips-drift-guard.result == 'success' || needs.cf-ips-drift-guard.result == 'skipped') && (needs.nginx-config-syntax.result == 'success' || needs.nginx-config-syntax.result == 'skipped')) && 'clean' || 'findings' }}
          COLOR: ${{ ((needs.gitleaks.result == 'success' && needs.trivy-config.result == 'success' && needs.pip-audit-direct.result == 'success' && needs.pip-audit-resolved.result == 'success' && needs.flutter-audit.result == 'success' && needs.compose-config-diff.result == 'success' && needs.pin-guard.result == 'success' && (needs.cf-ips-drift-guard.result == 'success' || needs.cf-ips-drift-guard.result == 'skipped') && (needs.nginx-config-syntax.result == 'success' || needs.nginx-config-syntax.result == 'skipped'))) && '0x57F287' || '0xED4245' }}
          TITLE: ${{ ((needs.gitleaks.result == 'success' && needs.trivy-config.result == 'success' && needs.pip-audit-direct.result == 'success' && needs.pip-audit-resolved.result == 'success' && needs.flutter-audit.result == 'success' && needs.compose-config-diff.result == 'success' && needs.pin-guard.result == 'success' && (needs.cf-ips-drift-guard.result == 'success' || needs.cf-ips-drift-guard.result == 'skipped') && (needs.nginx-config-syntax.result == 'success' || needs.nginx-config-syntax.result == 'skipped'))) && 'PR security gate clean' || 'PR security gate found issues' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GITLEAKS_FINDINGS: ${{ needs.gitleaks.outputs.findings || 'n/a' }}
        run: |
          curl -s -X POST https://n8n.nathanmartina.com/webhook/discord-report \
            -H "Content-Type: application/json" \
            -d "$(jq -nc --arg c status --arg t "$TITLE" --arg col "$COLOR" --arg u "$RUN_URL" --arg g "$GITLEAKS_FINDINGS" \
              '{channel:$c,title:$t,description:"AUT-1746 PR gate: gitleaks + trivy config + pip-audit (direct + resolved tree) + flutter osv-scanner (pubspec.lock) + compose env-var diff (AUT-2390).",color:$col,author:"Security Scan",fields:[{name:"Scope",value:"secrets, IaC, python (direct+transitive), flutter, compose-env",inline:true},{name:"Gitleaks findings",value:$g,inline:true},{name:"Run",value:$u,inline:true}]}')"
