# AUT-1746: x64 jobs (gitleaks, trivy config, pip-audit) dispatch to the bare
# x64 self-hosted runner; the flutter pub-audit job uses the vm2 x64 runner
# (AUT-1798/AUT-1802). This is the missing PR/push-time security gate called for
# in AUT-1746: a pre-merge gate that blocks on findings so the CVEs /
# misconfigurations from the review cannot recur silently.
name: Security — PR gate (secrets, IaC, deps, flutter)

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Never let two runs of the same ref race; newest wins (same pattern as the
# other security workflows).
concurrency:
  group: security-pr-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # (2) gitleaks detect on every PR — block on findings (AUT-1746).
  # Runs gitleaks directly (not the gitleaks-action) so the gate depends only on
  # the checked-out `.gitleaks.toml` config, not on extra tokens/SARIF perms.
  gitleaks:
    name: Gitleaks — secret detection
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sfL https://github.com/gitleaks/gitleaks/releases/download/v8.18.1/gitleaks_8.18.1_linux_x64.tar.gz \
            | tar xz -C "$HOME/.local/bin" gitleaks
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Gitleaks detect — fail on any finding
        run: |
          set -euo pipefail
          # Whole-repo scan with the repo-root `.gitleaks.toml` (vendored default
          # ruleset + AutoBrain allowlist of known non-secret fixtures). Exits
          # non-zero on any real finding → blocks the PR.
          gitleaks detect --source=. --config=.gitleaks.toml --redact --exit-code 1

  # (4) trivy config (misconfig) on every Dockerfile build target (AUT-1746).
  # Fails on HIGH/CRITICAL misconfig. NOTE: trivy 0.74 has no docker-compose
  # misconfig scanner, and `docker compose config` is stricter than the runtime
  # (it false-errors on the working dev/hosted stacks), so compose misconfig is
  # NOT structurally gated here. Compose-referenced images (postgres, minio,
  # 9router) are still covered by the existing trivy-image-scan.yml +
  # security-scan.yml pin/image guards. Revisit when trivy ships compose support.
  trivy-config:
    name: Trivy config — Dockerfile misconfig
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v4
      - name: Install trivy
        run: |
          # Self-hosted runners may run as a non-root user; /usr/local/bin is
          # not writable there (trivy-image-scan.yml sidesteps this via the
          # trivy-action). Install to a user-writable bin and put it on PATH.
          mkdir -p "$HOME/.local/bin"
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sh -s -- -b "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: trivy config — Dockerfile build targets (HIGH/CRITICAL, exit 1)
        run: |
          set -euo pipefail
          fail=0
          for f in \
            docker/frontend/Dockerfile \
            docker/backend/Dockerfile \
            docker/ai/Dockerfile \
            docker/worker/Dockerfile \
            market-data/Dockerfile; do
            echo "==> trivy config $f"
            trivy config --severity HIGH,CRITICAL --exit-code 1 "$f" || fail=1
          done
          exit $fail

  # (3) pip-audit on requirements.txt — extend the existing PR-time gate to cover
  # market-data too (the dockerhub-publish pip-audit-gate only covers backend+ai).
  # Two passes per requirements file:
  #   * direct-deps (`--no-deps`) — fast, only flags exact-pinned versions with
  #     a published CVE. Catches "I pinned a vulnerable direct dep" in CI seconds.
  #   * resolved-tree — installs into a throwaway venv then audits it. Catches
  #     *transitive* CVE drift in transitively-resolved packages (AUT-1189:
  #     idna / pycryptodome / pygments, unpinned at build time so any upstream
  #     constraint shift can land a vulnerable transitive in the built image).
  # market-data is a separate tree and is audited on its own.
  #
  # The resolved-tree pass dispatches to the vm2 runner because pip-audit
  # needs `python3 -m venv` to build a throwaway venv for transitive
  # resolution; the legacy x64 runner (where the rest of this PR gate runs)
  # is not guaranteed to have python3-venv. The vm2 runner is already used by
  # security-scan.yml for the same reason, so we know it works.
  pip-audit-direct:
    name: pip-audit — python dependency CVEs (direct deps)
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v4
      - name: Install pip-audit (+ packaging for PEP 440 version compare in the direct-deps dedup pass)
        run: |
          python3 -m pip --version 2>/dev/null || \
            curl -sS https://bootstrap.pypa.io/get-pip.py | PIP_BREAK_SYSTEM_PACKAGES=1 python3 -
          PIP_BREAK_SYSTEM_PACKAGES=1 python3 -m pip install --quiet pip-audit
      - name: Direct-deps pass — fail on known-vuln pinned deps
        run: |
          set -euo pipefail
          # Concat backend + ai + market-data. Filter the AUT-1189 floor pins
          # (idna/pycryptodome/pygments use `>=` so they can roll forward; they
          # cannot be audited by the `--no-deps` pass which requires exact pins
          # — those are covered by the resolved-tree pass below). Dedupe by
          # package name (keep highest version: stricter cap on a direct
          # dep means tighter audit) so backend/ai (pydantic 2.10.4) and
          # market-data (pydantic 2.13.4) don't trip the duplicate-line reject.
          # Non-exact pins (e.g. `~=`, `>=`) are skipped here and audited in
          # the resolved-tree pass.
          TMPREQ="$(mktemp)"
          python3 - > "$TMPREQ" <<'PY'
          import re
          from packaging.version import Version  # transitive dep of pip-audit
          pkgs = {}
          float_re = re.compile(r'^([A-Za-z0-9_.+\-]+)\s*(>=|<=|==|!=|~=|>|<)\s*([^\s#]+)(?:\s*#\s*(.*))?$')
          skip = {'idna', 'pycryptodome', 'pygments'}
          for f in ('backend/requirements.txt', 'ai/requirements.txt', 'market-data/requirements.txt'):
              for line in open(f):
                  line = line.strip()
                  if not line or line.startswith('#'):
                      continue
                  m = float_re.match(line)
                  if not m:
                      continue
                  name, op, ver, comment = m.group(1), m.group(2), m.group(3), m.group(4)
                  if name.lower() in skip or op != '==':
                      continue
                  cur = pkgs.get(name)
                  if cur is None or Version(ver) > Version(cur[0]):
                      pkgs[name] = (ver, comment or '')
          for name in sorted(pkgs):
              ver, comment = pkgs[name]
              out = f"{name}=={ver}"
              if comment:
                  out += f"  # {comment}"
              print(out)
          PY
          python3 -m pip_audit --disable-pip --no-deps -r "$TMPREQ"
          rm -f "$TMPREQ"

  pip-audit-resolved:
    name: pip-audit — resolved tree (transitive CVE drift, AUT-1189)
    runs-on: [self-hosted, linux, x64, vm2]
    steps:
      - uses: actions/checkout@v4
      - name: Install pip-audit
        run: |
          python3 -m pip --version 2>/dev/null || \
            curl -sS https://bootstrap.pypa.io/get-pip.py | PIP_BREAK_SYSTEM_PACKAGES=1 python3 -
          PIP_BREAK_SYSTEM_PACKAGES=1 python3 -m pip install --quiet pip-audit
      - name: Resolved-tree pass — fail on transitive CVE drift (AUT-1189)
        run: |
          set -euo pipefail
          # Each service resolves its own tree (backend/ai vs market-data pin
          # different fastapi major versions and cannot share a venv). Run each
          # in its own throwaway venv so the resolution is identical to what
          # `pip install -r` produces at image build time, but never pollutes
          # the runner env.
          for req in backend/requirements.txt ai/requirements.txt market-data/requirements.txt; do
            VENV="$(mktemp -d)/venv"
            python3 -m venv "$VENV"
            # shellcheck disable=SC1091
            source "$VENV/bin/activate"
            # Quiet install (audit happens after) but show resolution errors so a
            # bad pin never silently downgrades a transitive under the floor.
            pip install --quiet -r "$req"
            # `pip-audit` without --no-deps audits the resolved env (transitives
            # included). Exit code 1 on any known CVE.
            pip-audit
            rc=$?
            deactivate || true
            if [ "$rc" -ne 0 ]; then
              echo "::error::resolved-tree pip-audit failed for $req (AUT-1189 transitive CVE gate)" >&2
              exit "$rc"
            fi
          done

  # (5) dart pub audit on the frontend (requires the Flutter toolchain).
  flutter-audit:
    name: Flutter — pub audit
    runs-on: [self-hosted, linux, x64, vm2]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: dart pub audit (frontend)
        working-directory: frontend
        run: |
          set -euo pipefail
          flutter pub get
          # `flutter pub audit` was removed; the canonical Dart/Flutter audit
          # subcommand is `dart pub audit` (per AUT-1746 recommendation).
          dart pub audit

  # (6) AUT-1881 pin-guard — fail any compose `image:` reference that is not
  # pinned by `@sha256` digest. Complements the postgres/nginx/python pin
  # guards in trivy-image-scan.yml and ensures the floating `:hosted` /
  # `:latest` tags cannot re-appear in compose without a digest pin.
  pin-guard:
    name: "Pin guard — every compose image: must carry @sha256"
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v4
      - name: Check image references for digest pin
        run: |
          set -euo pipefail
          FILES="docker-compose.yml docker-compose.prod.yml docker-compose.hosted.yml"
          # Fail: every `image:` line in $FILES must carry an @sha256 digest,
          # use a `${VAR}` expansion (deploy-time), or follow a `build:` block
          # within the same service (locally-built image). Locally-built
          # images tag themselves `:latest` post-build, so we exempt them —
          # the supply-chain integrity for those flows from the Dockerfile
          # base digest pin (AUT-1735) and the build context.
          FLOATING="$(awk '
            FNR==1 {svc_has_build=0; svc_indent=-1}
            /^[^ #].*:/ && !/^[[:space:]]/ {svc_has_build=0}
            /^[[:space:]]+build:[[:space:]]*$/ {svc_has_build=1; svc_indent=match($0, /[^ ]/)-1}
            /^[[:space:]]+image:[[:space:]]+/ {
              cur_indent = match($0, /[^ ]/) - 1
              if (cur_indent < svc_indent) {svc_has_build=0; svc_indent=cur_indent}
              line=$0
              sub(/^[[:space:]]+image:[[:space:]]+/, "", line)
              if (line ~ /@sha256:/) next
              if (line ~ /\$\{/) next
              if (svc_has_build) next
              print FILENAME ":" FNR ": " $0
            }
          ' FILES="$FILES" $FILES)"
          if [ -n "$FLOATING" ]; then
            echo "::error::floating (non-digest) compose image: references found (AUT-1881):" >&2
            printf '%s\n' "$FLOATING" >&2
            exit 1
          fi
          echo "OK: every compose image: reference carries an @sha256 digest (AUT-1881)."
  report-status:
    name: Report gate result to Discord #status
    if: always()
    needs: [gitleaks, trivy-config, pip-audit-direct, pip-audit-resolved, flutter-audit, pin-guard]
    runs-on: [self-hosted, linux, x64]
    steps:
      - name: Report to Discord #status
        env:
          RESULT: ${{ needs.gitleaks.result == 'success' && needs.trivy-config.result == 'success' && needs.pip-audit-direct.result == 'success' && needs.pip-audit-resolved.result == 'success' && needs.flutter-audit.result == 'success' && needs.pin-guard.result == 'success' && 'clean' || 'findings' }}
          COLOR: ${{ (needs.gitleaks.result == 'success' && needs.trivy-config.result == 'success' && needs.pip-audit-direct.result == 'success' && needs.pip-audit-resolved.result == 'success' && needs.flutter-audit.result == 'success' && needs.pin-guard.result == 'success') && '0x57F287' || '0xED4245' }}
          TITLE: ${{ (needs.gitleaks.result == 'success' && needs.trivy-config.result == 'success' && needs.pip-audit-direct.result == 'success' && needs.pip-audit-resolved.result == 'success' && needs.flutter-audit.result == 'success' && needs.pin-guard.result == 'success') && 'PR security gate clean' || 'PR security gate found issues' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -s -X POST https://n8n.nathanmartina.com/webhook/discord-report \
            -H "Content-Type: application/json" \
            -d "$(jq -nc --arg c status --arg t "$TITLE" --arg col "$COLOR" --arg u "$RUN_URL" \
              '{channel:$c,title:$t,description:"AUT-1746 PR gate: gitleaks + trivy config + pip-audit (direct + resolved tree) + flutter pub audit + image digest-pin guard.",color:$col,author:"Security Scan",fields:[{name:"Scope",value:"secrets, IaC, python (direct+transitive), flutter, image pins",inline:true},{name:"Run",value:$u,inline:true}]}')"
