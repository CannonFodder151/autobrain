name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend lint + test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: autobrain
          POSTGRES_PASSWORD: autobrain
          POSTGRES_DB: autobrain
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U autobrain"
          --health-interval 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Lint
        run: ruff check app tests
      - name: Test
        env:
          DATABASE_URL: postgresql+asyncpg://autobrain:autobrain@localhost:5432/autobrain
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: ci-secret
        run: pytest -q

  ai:
    name: AI layer lint + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Lint
        run: ruff check app tests
      - name: Test
        env:
          AI_ROUTER_URL: http://your-9router-instance:port
        run: pytest -q

  frontend:
    name: Frontend analyze + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  docker-build:
    name: Build Docker images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Backend image
        run: docker build -f docker/backend/Dockerfile -t autobrain-backend:ci backend
      - name: AI image
        run: docker build -f docker/ai/Dockerfile -t autobrain-ai:ci ai
      - name: Worker image
        run: docker build -f docker/worker/Dockerfile -t autobrain-worker:ci .
