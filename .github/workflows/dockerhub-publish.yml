name: Publish images to Docker Hub

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  changelog-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require changelog iteration on app/docker changes (AUT-168)
        run: |
          set -euo pipefail
          BEFORE="${{ github.event.before }}"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "workflow_dispatch or initial push — skipping changelog gate"
            exit 0
          fi
          CHANGED="$(git diff --name-only "$BEFORE" "$GITHUB_SHA")"
          APP_CHANGED="$(printf '%s\n' "$CHANGED" | grep -E '^(backend/|ai/|frontend/|docker/|docker-compose)' || true)"
          if [ -n "$APP_CHANGED" ] && ! printf '%s\n' "$CHANGED" | grep -qx 'CHANGELOG.md'; then
            echo "::error::App/docker files changed but CHANGELOG.md was not updated. Add an entry under [Unreleased] (see CONTRIBUTING.md) before merging."
            exit 1
          fi
          echo "changelog gate OK — CHANGELOG.md iterated with app/docker changes"

  publish:
    needs: changelog-gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push images
        env:
          API_BASE_URL: https://hosted.autobrainservice.app/api/v1
          WS_BASE_URL: wss://hosted.autobrainservice.app/ws
        run: |
          set -euo pipefail
          for svc in backend ai frontend; do
            case "$svc" in
              backend)  ctx=.;        df=docker/backend/Dockerfile;   args="";;
              ai)       ctx=./ai;     df=docker/ai/Dockerfile;         args="";;
              frontend) ctx=.;        df=docker/frontend/Dockerfile;   args="--build-arg API_BASE_URL=${API_BASE_URL} --build-arg WS_BASE_URL=${WS_BASE_URL}";;
            esac
            for tag in latest hosted; do
              echo "==> building autobrain-${svc}:${tag}"
              docker buildx build --platform linux/amd64,linux/arm64 --push \
                -t "cannonfodder151/autobrain-${svc}:${tag}" \
                ${args} -f "${df}" "${ctx}"
            done
          done

  sync-changelog:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          path: app
      - uses: actions/checkout@v4
        with:
          repository: CannonFodder151/autobrainservice-website
          token: ${{ secrets.WEBSITE_SYNC_TOKEN }}
          path: website
      - name: Sync CHANGELOG.md to the marketing site
        working-directory: website
        run: |
          set -euo pipefail
          cp ../app/CHANGELOG.md CHANGELOG.md
          if git diff --quiet CHANGELOG.md; then
            echo "changelog unchanged — nothing to sync"
            exit 0
          fi
          git config user.name "AutoBrain Release Bot"
          git config user.email "release@autobrainservice.app"
          git add CHANGELOG.md
          git commit -m "Changelog: sync release notes from autobrain"
          git push
