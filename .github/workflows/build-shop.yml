name: Build Shop images (private registry)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag
        required: true
        default: latest
      api_base_url:
        description: Frontend API base URL
        required: true
        default: https://shop.autobrainservice.app/api/v1
      ws_base_url:
        description: Frontend WS base URL
        required: true
        default: wss://shop.autobrainservice.app/ws
      registry:
        description: Private registry URL
        required: true
        default: 152.69.188.133:5000

concurrency:
  group: build-shop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  auto-bump:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, x64, vm2]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Cut a release if [Unreleased] has content (AUT-240)
        id: bump
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          git config user.name "AutoBrain Release Bot"
          git config user.email "release@autobrainservice.app"
          ./scripts/auto-bump.sh
          # PR-based auto-bump (AUT-296): main is protected (GH006 blocks
          # direct pushes), so cut the version on a branch and merge via PR.
          if git diff --quiet origin/main --; then
            echo "==> nothing to bump — no push needed"
            echo "bumped=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          VERSION=$(git describe --tags --abbrev=0 2>/dev/null | sed 's/^v//')
          BRANCH="auto-bump/v${VERSION}-$(date +%s)"
          git checkout -b "$BRANCH"
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_PAT" | base64 -w0)"
          git -c "http.extraheader=${auth}" push origin "$BRANCH"
          PR_JSON=$(curl -s -X POST -H "Authorization: token $GH_PAT" -H "Accept: application/vnd.github+json" https://api.github.com/repos/CannonFodder151/autobrain/pulls -d "{\"title\":\"chore: release v${VERSION} (auto-bump)\",\"head\":\"${BRANCH}\",\"base\":\"main\"}")
          PR_NUMBER=$(echo "$PR_JSON" | python3 -c "import sys,json; print(json.load(sys.stdin)['number'])")
          curl -s -X PUT -H "Authorization: token $GH_PAT" -H "Accept: application/vnd.github+json" https://api.github.com/repos/CannonFodder151/autobrain/pulls/$PR_NUMBER/auto-merge -d '{"merge_method":"merge"}' >/dev/null
          curl -s -X PUT -H "Authorization: token $GH_PAT" -H "Accept: application/vnd.github+json" https://api.github.com/repos/CannonFodder151/autobrain/pulls/$PR_NUMBER/merge -d '{"merge_method":"merge"}' >/dev/null
          echo "==> auto-bump done"
          echo "bumped=true" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

  build:
    needs: auto-bump
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runs_on: [self-hosted, linux, x64, vm2]
          - arch: arm64
            runs_on: [self-hosted, linux, ARM64]
    runs-on: ${{ matrix.runs_on }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: docker/setup-buildx-action@v3

      - name: Login to private registry
        uses: docker/login-action@v3
        with:
          registry: ${{ github.event.inputs.registry || '152.69.188.133:5000' }}
          username: ${{ secrets.REGISTRY_USER || 'admin' }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Verify runner arch (${{ matrix.arch }})
        run: |
          set -euo pipefail
          want="${{ matrix.arch }}"
          got="$(uname -m)"
          case "$want" in
            amd64) norm="x86_64";;
            arm64) norm="aarch64";;
            *) echo "::error::unknown matrix arch $want"; exit 2;;
          esac
          if [ "$got" != "$norm" ]; then
            echo "::error::runner arch mismatch: want $want (=$norm), got $got"
            exit 1
          fi
          echo "==> runner arch OK: $got ($want)"

      - name: Clear buildx builder cache (arm64 only)
        if: matrix.arch == 'arm64'
        run: |
          echo "==> clearing local buildx builder cache (arm64)"
          docker buildx prune -a -f || true

      - name: Build and push images (linux/${{ matrix.arch }})
        env:
          TAG: ${{ github.event.inputs.tag || 'latest' }}
          ARCH: ${{ matrix.arch }}
          REGISTRY: ${{ github.event.inputs.registry || '152.69.188.133:5000' }}
          API_BASE_URL: ${{ github.event.inputs.api_base_url || 'https://shop.autobrainservice.app/api/v1' }}
          WS_BASE_URL: ${{ github.event.inputs.ws_base_url || 'wss://shop.autobrainservice.app/ws' }}
          CARTO_API_KEY: ${{ secrets.CARTO_API_KEY }}
        run: |
          set -euo pipefail
          for svc in backend ai frontend; do
            case "$svc" in
              backend)  df=docker/backend/Dockerfile;   args="";;
              ai)       df=docker/ai/Dockerfile;         args="";;
              frontend) df=docker/frontend/Dockerfile;   args="--build-arg API_BASE_URL=${API_BASE_URL} --build-arg WS_BASE_URL=${WS_BASE_URL} --build-arg CARTO_API_KEY=${CARTO_API_KEY}";;
            esac
            echo "==> building autobrain-shop-${svc}:${TAG}-${ARCH} for linux/${ARCH}"
            docker buildx build --platform linux/${ARCH} --push \
              -t "${REGISTRY}/autobrain-shop-${svc}:${TAG}-${ARCH}" \
              ${args} -f "${df}" "."
          done

      - name: Verify pushed image arch (${{ matrix.arch }})
        env:
          TAG: ${{ github.event.inputs.tag || 'latest' }}
          ARCH: ${{ matrix.arch }}
          REGISTRY: ${{ github.event.inputs.registry || '152.69.188.133:5000' }}
        run: |
          set -euo pipefail
          norm=""
          case "$ARCH" in
            amd64) norm="x86_64";;
            arm64) norm="aarch64";;
            *) echo "::error::unknown arch $ARCH"; exit 2;;
          esac
          for svc in backend ai frontend; do
            img="${REGISTRY}/autobrain-shop-${svc}:${TAG}-${ARCH}"
            echo "==> verifying $img"
            docker rmi "$img" 2>/dev/null || true
            docker pull --platform linux/${ARCH} "$img"
            got="$(docker run --rm --platform linux/${ARCH} "$img" uname -m)"
            if [ "$got" != "$norm" ]; then
              echo "::error::$img reports arch=$got, expected $norm"
              exit 1
            fi
            docker run --rm --platform linux/${ARCH} "$img" /bin/sh -c 'true'
          done
          echo "==> all ${ARCH} images verified"

  build-manifest:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: [self-hosted, linux, x64, vm2]
    permissions:
      contents: read
    steps:
      - name: Login to private registry
        uses: docker/login-action@v3
        with:
          registry: ${{ github.event.inputs.registry || '152.69.188.133:5000' }}
          username: ${{ secrets.REGISTRY_USER || 'admin' }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Gate manifest assembly on per-arch verification
        env:
          TAG: ${{ github.event.inputs.tag || 'latest' }}
          REGISTRY: ${{ github.event.inputs.registry || '152.69.188.133:5000' }}
        run: |
          set -euo pipefail
          for svc in backend ai frontend; do
            for arch in amd64 arm64; do
              img="${REGISTRY}/autobrain-shop-${svc}:${TAG}-${arch}"
              if ! docker buildx imagetools inspect "$img" >/dev/null 2>&1; then
                echo "::error::$img missing — per-arch build for $arch did not publish. Aborting."
                exit 1
              fi
            done
          done

      - name: Assemble multi-arch manifests
        env:
          TAG: ${{ github.event.inputs.tag || 'latest' }}
          REGISTRY: ${{ github.event.inputs.registry || '152.69.188.133:5000' }}
          SHA_TAG: shop-sha-${{ github.sha }}
        run: |
          set -euo pipefail
          for svc in backend ai frontend; do
            echo "==> manifest autobrain-shop-${svc}:${TAG}"
            docker buildx imagetools create \
              -t "${REGISTRY}/autobrain-shop-${svc}:${TAG}" \
              -t "${REGISTRY}/autobrain-shop-${svc}:${SHA_TAG}" \
              "${REGISTRY}/autobrain-shop-${svc}:${TAG}-amd64" \
              "${REGISTRY}/autobrain-shop-${svc}:${TAG}-arm64"
          done
          echo "==> manifests assembled"

  sync-portainer:
    needs: build-manifest
    if: github.event_name != 'pull_request'
    runs-on: [self-hosted, linux, x64, vm2]
    permissions:
      contents: read
    env:
      PORTAINER_API_KEY: ${{ secrets.PORTAINER_API_KEY }}
      PORTAINER_URL: https://portainer.nathanmartina.com
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Sync updated compose into Portainer shop stack
        env:
          TAG: ${{ github.event.inputs.tag || 'latest' }}
        run: |
          set -euo pipefail
          python3 scripts/sync-compose-to-portainer.py \
            --stack autobrain-shop \
            --endpoint 5 \
            --file docker-compose.shop.yml
