# AutoBrain local development stack.
# Usage: cp .env.example .env && docker compose up --build
# Runs: postgres, redis, minio, backend (API + Celery worker+beat), ai (reload), frontend.
# All services bind to localhost — connects to 9Router at AI_ROUTER_URL.

# Backend service factory — reused by dev and test overrides.
x-backend-base: &backend-base
  build:
    context: .
    dockerfile: docker/backend/Dockerfile
  image: autobrain-backend:latest
  restart: unless-stopped
  env_file: .env
  environment:
    POSTGRES_HOST: postgres
    GITHUB_TOKEN: ${GITHUB_TOKEN:-}  # PAT for release checks; keep in sync after rotation (AUT-439)
    REDIS_URL: redis://redis:6379/0
    MINIO_ENDPOINT: minio:9000
    AI_ROUTER_URL: ${AI_ROUTER_URL:-http://your-9router-instance:port}
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    minio:
      condition: service_healthy

services:
  # ── Datastores ──────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set in .env}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    # Pinned to immutable release (AUT-322). digest sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY must be set in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY must be set in .env}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── App services ───────────────────────────────────────────
  backend:
    <<: *backend-base
    ports:
      - "8000:8000"
    command: ["sh", "-c", "alembic upgrade head && (celery -A app.workers.celery_app:celery_app worker -B -l info --concurrency=2 &) && exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"]
    volumes:
      - ./backend:/app

  ai:
    build:
      context: ./ai
      dockerfile: ../docker/ai/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      AI_ROUTER_URL: ${AI_ROUTER_URL:-http://your-9router-instance:port}
      AI_GATEWAY_API_KEY: ${AI_GATEWAY_API_KEY:-}
      # Local dev: explicit opt-out from gateway auth (fail-closed by default).
      AI_ENV: development
    ports:
      - "8001:8001"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8001 --reload
    volumes:
      - ./ai:/app

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
      args:
        API_BASE_URL: ${API_BASE_URL:-http://localhost:8000/api/v1}
        WS_BASE_URL: ${WS_BASE_URL:-ws://localhost:8000/ws}
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend

# ── Persistent volumes ──────────────────────────────────────
volumes:
  postgres-data:
  redis-data:
  minio-data:
