# AutoBrain local development stack.
# Usage: cp .env.example .env && docker compose up --build

x-backend-base: &backend-base
  build:
    context: ./backend
    dockerfile: ../docker/backend/Dockerfile
  restart: unless-stopped
  env_file: .env
  environment:
    POSTGRES_HOST: postgres
    REDIS_URL: redis://redis:6379/0
    CELERY_BROKER_URL: redis://redis:6379/1
    CELERY_RESULT_BACKEND: redis://redis:6379/2
    MINIO_ENDPOINT: minio:9000
    AI_ROUTER_URL: ${AI_ROUTER_URL:-http://your-9router-instance:port}
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    minio:
      condition: service_healthy

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-autobrain}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-autobrain}
      POSTGRES_DB: ${POSTGRES_DB:-autobrain}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-autobrain}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-autobrain}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-autobrain}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    <<: *backend-base
    ports:
      - "8000:8000"
    # migrations then Celery worker+beat, then API (dev reload).
    command: ["sh", "-c", "alembic upgrade head && (celery -A app.workers.celery_app:celery_app worker -l info --beat &) && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"]
    volumes:
      - ./backend:/app

  ai:
    build:
      context: ./ai
      dockerfile: ../docker/ai/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      AI_ROUTER_URL: ${AI_ROUTER_URL:-http://your-9router-instance:port}
    ports:
      - "8001:8001"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8001 --reload
    volumes:
      - ./ai:/app

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
      args:
        API_BASE_URL: ${API_BASE_URL:-http://localhost:8000/api/v1}
        WS_BASE_URL: ${WS_BASE_URL:-ws://localhost:8000/ws}
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  postgres-data:
  redis-data:
  minio-data:
