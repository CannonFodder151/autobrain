apiVersion: apps/v1
kind: Deployment
metadata:
  name: autobrain-ai
  namespace: autobrain
spec:
  replicas: 1
  selector:
    matchLabels:
      app: autobrain
      component: ai
  template:
    metadata:
      labels:
        app: autobrain
        component: ai
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ai
          image: autobrain-ai:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8001
          env:
            - name: AI_ROUTER_URL
              valueFrom:
                configMapKeyRef:
                  name: autobrain-config
                  key: ai-router-url
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 30
            periodSeconds: 15
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: autobrain-ai
  namespace: autobrain
spec:
  selector:
    app: autobrain
    component: ai
  ports:
    - port: 8001
      targetPort: 8001
