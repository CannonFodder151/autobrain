apiVersion: apps/v1
kind: Deployment
metadata:
  name: autobrain-ai
  namespace: autobrain
spec:
  replicas: 1
  selector:
    matchLabels:
      app: autobrain
      component: ai
  template:
    metadata:
      labels:
        app: autobrain
        component: ai
    spec:
      containers:
        - name: ai
          image: autobrain-ai:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8001
          env:
            - name: AI_ROUTER_URL
              valueFrom:
                configMapKeyRef:
                  name: autobrain-config
                  key: ai-router-url
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: autobrain-ai
  namespace: autobrain
spec:
  selector:
    app: autobrain
    component: ai
  ports:
    - port: 8001
      targetPort: 8001
