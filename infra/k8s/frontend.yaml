apiVersion: apps/v1
kind: Deployment
metadata:
  name: autobrain-frontend
  namespace: autobrain
spec:
  replicas: 1
  selector:
    matchLabels:
      app: autobrain
      component: frontend
  template:
    metadata:
      labels:
        app: autobrain
        component: frontend
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: frontend
          image: autobrain-frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            # nginx binds :80; everything else dropped.
            capabilities:
              drop: ["ALL"]
              add: ["NET_BIND_SERVICE"]
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: cache
              mountPath: /var/cache/nginx
            - name: run
              mountPath: /var/run
      volumes:
        - name: cache
          emptyDir: {}
        - name: run
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: autobrain-frontend
  namespace: autobrain
spec:
  selector:
    app: autobrain
    component: frontend
  ports:
    - port: 80
      targetPort: 80
