apiVersion: v1
kind: Secret
metadata:
  name: autobrain-secrets
  namespace: autobrain
type: Opaque
stringData:
  # Placeholders only — replace with real values at install (kubectl apply -f
  # config.yaml after editing, or patch via external secret manager). Never
  # commit real values. The deployments reference this Secret by name
  # (secretRef/secretKeyRef), so create/update it out-of-band if you prefer.
  secret-key: "replace-me-with-long-random-string"
  postgres-user: "replace-me-postgres-user"
  postgres-password: "replace-me-postgres-password"
  minio-access-key: "replace-me-minio-access-key"
  minio-secret-key: "replace-me-minio-secret-key"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: autobrain-config
  namespace: autobrain
data:
  environment: "production"
  ai-router-url: "http://your-9router-instance:port/v1"
  minio-bucket: "autobrain-assets"
  postgres-db: "autobrain"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: autobrain-postgres-pvc
  namespace: autobrain
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
