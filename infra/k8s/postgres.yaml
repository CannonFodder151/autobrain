apiVersion: apps/v1
kind: Deployment
metadata:
  name: autobrain-postgres
  namespace: autobrain
spec:
  replicas: 1
  selector:
    matchLabels:
      app: autobrain
      component: postgres
  template:
    metadata:
      labels:
        app: autobrain
        component: postgres
    spec:
      # ponytail: official postgres entrypoint needs root (chown data dir,
      # gosu drop) — only seccomp applies cleanly; revisit with a
      # pre-chowned securityContext or a hardened image (e.g. bitnami).
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: autobrain-secrets
                  key: postgres-user
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: autobrain-secrets
                  key: postgres-password
            - name: POSTGRES_DB
              value: autobrain
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              # AUT-4038: -h 127.0.0.1 forces TCP; without it this probe uses
              # the peer-auth unix socket as root and fails auth every time.
              command: ["pg_isready", "-h", "127.0.0.1", "-U", "autobrain"]
            initialDelaySeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: autobrain-postgres-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: autobrain-postgres
  namespace: autobrain
spec:
  selector:
    app: autobrain
    component: postgres
  ports:
    - port: 5432
      targetPort: 5432
