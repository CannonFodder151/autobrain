apiVersion: apps/v1
kind: Deployment
metadata:
  name: autobrain-redis
  namespace: autobrain
spec:
  replicas: 1
  selector:
    matchLabels:
      app: autobrain
      component: redis
  template:
    metadata:
      labels:
        app: autobrain
        component: redis
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          # AB-INFRA-001: require auth; password comes from autobrain-secrets.
          command: ["sh", "-c", "exec redis-server --requirepass \"$REDIS_PASSWORD\" --appendonly yes"]
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: autobrain-secrets
                  key: redis-password
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            exec:
              command: ["sh", "-c", "redis-cli --no-auth-warning -a \"$REDIS_PASSWORD\" ping"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", "redis-cli --no-auth-warning -a \"$REDIS_PASSWORD\" ping"]
            initialDelaySeconds: 30
            periodSeconds: 15
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: autobrain-redis-pvc
        - name: tmp
          emptyDir: {}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: autobrain-redis-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: autobrain-redis-pvc
  namespace: autobrain
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: autobrain-redis
  namespace: autobrain
spec:
  selector:
    app: autobrain
    component: redis
  ports:
    - port: 6379
      targetPort: 6379
