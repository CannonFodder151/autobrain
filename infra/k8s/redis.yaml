apiVersion: apps/v1
kind: Deployment
metadata:
  name: autobrain-redis
  namespace: autobrain
spec:
  replicas: 1
  selector:
    matchLabels:
      app: autobrain
      component: redis
  template:
    metadata:
      labels:
        app: autobrain
        component: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          args: ["--appendonly", "yes"]
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 30
            periodSeconds: 15
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: autobrain-redis-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: autobrain-redis-pvc
  namespace: autobrain
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: autobrain-redis
  namespace: autobrain
spec:
  selector:
    app: autobrain
    component: redis
  ports:
    - port: 6379
      targetPort: 6379
