apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: autobrain-redis
  namespace: autobrain
spec:
  podSelector:
    matchLabels:
      app: autobrain
      component: redis
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: autobrain
              component: backend
        - podSelector:
            matchLabels:
              app: autobrain
              component: worker
        - podSelector:
            matchLabels:
              app: autobrain
              component: beat
      ports:
        - port: 6379
---
